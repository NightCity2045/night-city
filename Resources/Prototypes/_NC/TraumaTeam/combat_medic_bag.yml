# The combat medic bag: stabilise yourself and the person next to you.
- type: entity
  parent: ClothingBackpackSatchelMedical
  id: NCTraumaTeamCombatMedicBag
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: NCTraumaTeamPenTraumaAnalgesic
          amount: 4
        - id: NCTraumaTeamPenProcoagulant
          amount: 3
        - id: NCTraumaTeamPenRespiratoryStimulant
          amount: 2
        - id: NCTraumaTeamPenAntitoxin
          amount: 2
        - id: NCTraumaTeamPenVasopressor
          amount: 2
        - id: Gauze
          amount: 2
        - id: Tourniquet
          amount: 2
