- type: job
  id: MilitechRigger
  name: job-name-militech-rigger
  description: job-description-militech-rigger
  playTimeTracker: NCJobMilitechRigger
  supervisors: nc-job-supervisors-militech-command
  weight: 55
  salary: 350
  setPreference: false
  startingGear: MilitechRiggerGear
  icon: JobIconMilitechRigger
  accessGroups: [ MilitechBasic ]
  access: [ Militech_Tech ]

- type: startingGear
  id: MilitechRiggerGear
  equipment:
    jumpsuit: ClothingUniformMilitech
    back: ClothingBackpackEngineering
    shoes: ClothingShoesBootsWork
    head: ClothingHeadHatMilitechCap
    eyes: ClothingEyesGlassesMeson
    gloves: ClothingHandsGlovesColorYellow
    id: MilitechRiggerPDA
    belt: ClothingBeltUtilityFilled
  storage:
    back:
    - LogProbeCartridge
    - AstroNavCartridge

- type: jobIcon
  parent: JobIcon
  id: JobIconMilitechRigger
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: militech_other
  jobName: job-name-militech-rigger

- type: entity
  parent: BasePDA
  id: MilitechRiggerPDA
  name: Militech rigger PDA
  description: Smells like coolant and questionable repairs.
  components:
  - type: Pda
    id: MilitechRiggerIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-engineer
  - type: PdaBorderColor
    borderColor: "#949137"
    accentVColor: "#A32D26"
  - type: Icon
    state: pda-engineer
