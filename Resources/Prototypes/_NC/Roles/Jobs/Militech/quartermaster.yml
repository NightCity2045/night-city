- type: job
  id: MilitechQuartermaster
  name: job-name-militech-quartermaster
  description: job-description-militech-quartermaster
  playTimeTracker: NCJobMilitechQuartermaster
  supervisors: nc-job-supervisors-militech-command
  weight: 45
  salary: 300
  setPreference: false
  startingGear: MilitechQuartermasterGear
  icon: JobIconMilitechQuartermaster
  accessGroups: [ MilitechBasic ]
  access: [ Militech_Armory ]

- type: startingGear
  id: MilitechQuartermasterGear
  equipment:
    jumpsuit: ClothingUniformMilitech
    back: ClothingBackpackCargo
    shoes: ClothingShoesBootsWork
    head: ClothingHeadHatMilitechCap
    id: MilitechQuartermasterPDA
    belt: BoxFolderClipboardThreePapers
    pocket1: AppraisalTool
    outerClothing: ClothingOuterWinterQM

- type: jobIcon
  parent: JobIcon
  id: JobIconMilitechQuartermaster
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: militech_qm
  jobName: job-name-militech-quartermaster

- type: entity
  parent: BaseSecurityPDA
  id: MilitechQuartermasterPDA
  name: Militech quartermaster PDA
  description: Rugged and well-worn.
  components:
  - type: Pda
    id: MilitechQuartermasterIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-cargo
  - type: PdaBorderColor
    borderColor: "#949137"
    accentVColor: "#A32D26"
  - type: Icon
    state: pda-cargo
