- type: job
  id: MilitechCombatMedic
  name: job-name-militech-combat-medic
  description: job-description-militech-combat-medic
  playTimeTracker: NCJobMilitechCombatMedic
  supervisors: nc-job-supervisors-militech-command
  weight: 60
  startingGear: MilitechCombatMedicGear
  icon: NCJobIconMilitechCombatMedic
  accessGroups: [ MilitechBasic ]
  access: [ Militech_Operative, Militech_Medical ]

- type: startingGear
  id: MilitechCombatMedicGear
  equipment:
    jumpsuit: ClothingUniformMilitech
    back: ClothingBackpackMedical
    shoes: ClothingShoesBootsJack
    eyes: ClothingEyesHudMedical
    mask: ClothingMaskSterile
    gloves: ClothingHandsGlovesNitrile
    id: MilitechCombatMedicPDA
    ears: ClothingHeadsetEngineering
    belt: ClothingBeltMedicalFilled
    armor: ClothingOuterArmorMilitechBulletproof
  storage:
    back:
    - MedTekCartridge

- type: jobIcon
  parent: JobIcon
  id: NCJobIconMilitechCombatMedic
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons_extra.rsi
    state: militech_medic
  jobName: job-name-militech-combat-medic

- type: entity
  parent: IDCardStandard
  id: MilitechCombatMedicIDCard
  name: Militech combat medic ID
  components:
  - type: Sprite
    layers:
    - state: default
    - state: stripe_top
      color: "#8A8C91"
    - state: stripe_bottom
      color: "#5B5E64"
    - sprite: _NC/Interface/Misc/job_icons_extra.rsi
      offset: -0.09375, 0.0625
      state: militech_medic
  - type: PresetIdCard
    job: MilitechCombatMedic

# Keeps the department tools of the ParamedicPDA it replaces.
- type: entity
  parent: ParamedicPDA
  id: MilitechCombatMedicPDA
  name: Militech combat medic PDA
  description: A rugged department terminal tied to its owner's persistent position.
  components:
  - type: Pda
    id: MilitechCombatMedicIDCard
  - type: PdaBorderColor
    borderColor: "#8A8C91"
