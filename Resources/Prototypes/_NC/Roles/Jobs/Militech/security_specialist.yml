- type: job
  id: MilitechSecuritySpecialist
  name: job-name-militech-security-specialist
  description: job-description-militech-security-specialist
  playTimeTracker: NCJobMilitechSecuritySpecialist
  supervisors: nc-job-supervisors-militech-command
  weight: 55
  salary: 350
  setPreference: false
  startingGear: MilitechSecuritySpecialistGear
  icon: JobIconMilitechSecuritySpecialist
  accessGroups: [ MilitechBasic ]
  access: [ Militech_Operative, Militech_Armory ]

- type: startingGear
  id: MilitechSecuritySpecialistGear
  equipment:
    jumpsuit: ClothingUniformMilitech
    back: ClothingBackpackSecurity
    shoes: ClothingShoesBootsJack
    head: ClothingHeadHatMilitechCap
    eyes: ClothingEyesGlassesSecurity
    gloves: ClothingHandsGlovesCombat
    id: MilitechSecuritySpecialistPDA
    belt: ClothingBeltSecurity
    armor: ClothingOuterArmorMilitechBulletproof
  storage:
    belt:
    - Handcuffs
    - Handcuffs
    - HoloprojectorSecurity
    - RadioHandheldSecurity

- type: jobIcon
  parent: JobIcon
  id: JobIconMilitechSecuritySpecialist
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: militech_security
  jobName: job-name-militech-security-specialist

- type: entity
  parent: BaseSecurityPDA
  id: MilitechSecuritySpecialistPDA
  name: Militech security specialist PDA
  description: Rugged and well-worn.
  components:
  - type: Pda
    id: MilitechSecuritySpecialistIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-security
  - type: PdaBorderColor
    borderColor: "#949137"
    accentVColor: "#A32D26"
  - type: Icon
    state: pda-security
