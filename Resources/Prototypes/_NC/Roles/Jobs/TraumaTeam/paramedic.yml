- type: job
  id: TraumaTeamParamedic
  name: job-name-trauma-team-paramedic
  description: job-description-trauma-team-paramedic
  playTimeTracker: NCJobTraumaTeamParamedic
  supervisors: nc-job-supervisors-trauma-team-command
  weight: 70
  salary: 350
  setPreference: false
  startingGear: TraumaTeamParamedicGear
  icon: NCJobIconTraumaTeamParamed
  accessGroups: [ TraumaBasic ]
  access: [ Trauma_Morgue ]

- type: startingGear
  id: TraumaTeamParamedicGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitParamedic
    back: ClothingBackpackMedical
    shoes: ClothingShoesBootsWork
    head: ClothingHeadHatParamedicsoft
    eyes: ClothingEyesHudMedical
    mask: ClothingMaskSterile
    gloves: ClothingHandsGlovesLatex
    id: TraumaTeamParamedicPDA
    belt: ClothingBeltMedicalFilled
    outerClothing: ClothingOuterHardsuitTraumaMed
  storage:
    back:
    - MedTekCartridge
    - NCTraumaResponseCartridge
    - NCTraumaTrackingImplanter

- type: entity
  parent: BaseMedicalPDA
  id: TraumaTeamParamedicPDA
  name: Trauma Team paramedic PDA
  description: Shiny and sterile. Mostly. Someone wiped the blood off in a hurry.
  components:
  - type: Pda
    id: TraumaTeamParamedicIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-paramedic
  - type: PdaBorderColor
    borderColor: "#d7d7d0"
    accentVColor: "#2a4b5b"
  - type: Icon
    state: pda-paramedic
