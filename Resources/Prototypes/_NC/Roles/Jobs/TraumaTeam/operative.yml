- type: job
  id: TraumaTeamOperative
  name: job-name-trauma-team-operative
  description: job-description-trauma-team-operative
  playTimeTracker: NCJobTraumaTeamOperative
  supervisors: nc-job-supervisors-trauma-team-command
  weight: 60
  salary: 400
  setPreference: false
  startingGear: TraumaTeamOperativeGear
  icon: NCJobIconTraumaTeamOperative
  accessGroups: [ TraumaBasic ]
  access: [ Trauma_Operative ]

- type: startingGear
  id: TraumaTeamOperativeGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitSecGrey
    back: ClothingBackpackSecurity
    shoes: ClothingShoesBootsJack
    eyes: ClothingEyesGlassesSecurity
    gloves: ClothingHandsGlovesCombat
    id: TraumaTeamOperativePDA
    belt: ClothingBeltSecurity
    outerClothing: ClothingOuterHardsuitTraumaArmored
  storage:
    back:
    - NCTraumaResponseCartridge
    belt:
    - Handcuffs
    - Handcuffs
    - HoloprojectorSecurity
    - RadioHandheldSecurity

- type: entity
  parent: BaseSecurityPDA
  id: TraumaTeamOperativePDA
  name: Trauma Team operative PDA
  description: A rugged department terminal tied to its owner's persistent position. The screen is cracked exactly where a patient once grabbed it.
  components:
  - type: Pda
    id: TraumaTeamOperativeIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-warden
  - type: PdaBorderColor
    borderColor: "#4777C8"
    accentVColor: "#2F5C9E"
  - type: Icon
    state: pda-warden
