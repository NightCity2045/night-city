- type: job
  id: NCMedicalCoroner
  name: job-name-medical-coroner
  description: job-description-medical-coroner
  playTimeTracker: NCJobMedicalCoroner
  supervisors: nc-job-supervisors-medical-command
  weight: 90
  startingGear: NCMedicalCoronerGear
  icon: NCJobIconNCMedicalCoroner
  accessGroups: [ MedicalBasic ]
  access: [ Medical_Morgue ]

- type: startingGear
  id: NCMedicalCoronerGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitMedicalDoctor
    back: ClothingBackpackMedical
    shoes: ClothingShoesColorBlack
    eyes: ClothingEyesHudMedical
    mask: ClothingMaskSterile
    gloves: ClothingHandsGlovesForensic
    id: NCMedicalCoronerPDA
    belt: ClothingBeltMedicalFilled
    outerClothing: ClothingOuterCoatLab
  storage:
    back:
    - ForensicPad
    - ForensicScanner
    - MedTekCartridge

- type: jobIcon
  parent: JobIcon
  id: NCJobIconNCMedicalCoroner
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: trauma_coroner
  jobName: job-name-medical-coroner

- type: entity
  parent: IDCardStandard
  id: NCMedicalCoronerIDCard
  name: coroner ID
  components:
  - type: Sprite
    layers:
    - state: default
    - state: stripe_top
      color: "#66C58D"
    - state: stripe_bottom
      color: "#3F9A65"
    - sprite: _NC/Interface/Misc/job_icons.rsi
      offset: -0.09375, 0.0625
      state: trauma_coroner
  - type: PresetIdCard
    job: NCMedicalCoroner

# Keeps the department tools of the MedicalPDA it replaces.
- type: entity
  parent: MedicalPDA
  id: NCMedicalCoronerPDA
  name: coroner PDA
  description: A rugged department terminal tied to its owner's persistent position.
  components:
  - type: Pda
    id: NCMedicalCoronerIDCard
  - type: PdaBorderColor
    borderColor: "#66C58D"
