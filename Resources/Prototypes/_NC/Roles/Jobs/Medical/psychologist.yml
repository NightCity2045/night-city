- type: job
  id: NCMedicalPsychologist
  name: job-name-medical-psychologist
  description: job-description-medical-psychologist
  playTimeTracker: NCJobMedicalPsychologist
  supervisors: nc-job-supervisors-medical-command
  weight: 80
  startingGear: NCMedicalPsychologistGear
  icon: NCJobIconNCMedicalPsychologist
  accessGroups: [ MedicalBasic ]

- type: startingGear
  id: NCMedicalPsychologistGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitPsychologist
    back: ClothingBackpackMedical
    shoes: ClothingShoesColorWhite
    id: NCMedicalPsychologistPDA
    outerClothing: ClothingOuterCoatLab

- type: jobIcon
  parent: JobIcon
  id: NCJobIconNCMedicalPsychologist
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: trauma-psihologophobia
  jobName: job-name-medical-psychologist

- type: entity
  parent: IDCardStandard
  id: NCMedicalPsychologistIDCard
  name: psychologist ID
  components:
  - type: Sprite
    layers:
    - state: default
    - state: stripe_top
      color: "#66C58D"
    - state: stripe_bottom
      color: "#3F9A65"
    - sprite: _NC/Interface/Misc/job_icons.rsi
      offset: -0.09375, 0.0625
      state: trauma-psihologophobia
  - type: PresetIdCard
    job: NCMedicalPsychologist

# Keeps the department tools of the PsychologistPDA it replaces.
- type: entity
  parent: PsychologistPDA
  id: NCMedicalPsychologistPDA
  name: psychologist PDA
  description: A rugged department terminal tied to its owner's persistent position.
  components:
  - type: Pda
    id: NCMedicalPsychologistIDCard
  - type: PdaBorderColor
    borderColor: "#66C58D"
