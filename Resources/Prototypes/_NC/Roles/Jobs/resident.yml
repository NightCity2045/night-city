# Residents join as the vanilla Passenger job; these give them a Night City icon, ID and PDA.
- type: jobIcon
  parent: JobIcon
  id: NCJobIconPassenger
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: civ_citizen
  jobName: job-name-passenger

- type: entity
  parent: IDCardStandard
  id: NCResidentIDCard
  name: resident ID
  components:
  - type: Sprite
    layers:
    - state: default
    - state: stripe_top
      color: "#9A9A9A"
    - state: stripe_bottom
      color: "#6E6E6E"
    - sprite: _NC/Interface/Misc/job_icons.rsi
      offset: -0.09375, 0.0625
      state: civ_citizen
  - type: PresetIdCard
    job: Passenger

# Keeps the department tools of the PassengerPDA it replaces.
- type: entity
  parent: PassengerPDA
  id: NCResidentPDA
  name: resident PDA
  description: A rugged department terminal tied to its owner's persistent position.
  components:
  - type: Pda
    id: NCResidentIDCard
  - type: PdaBorderColor
    borderColor: "#9A9A9A"
