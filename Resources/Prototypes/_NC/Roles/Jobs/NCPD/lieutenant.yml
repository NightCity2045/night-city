- type: job
  id: NCPDLieutenant
  name: job-name-ncpd-lieutenant
  description: job-description-ncpd-lieutenant
  playTimeTracker: NCJobNCPDLieutenant
  supervisors: nc-job-supervisors-ncpd-commander
  weight: 85
  salary: 220
  setPreference: false
  startingGear: NCPDLieutenantGear
  icon: JobIconNCPDLieutenant
  accessGroups: [ NCPDBasic ]
  access: [ NCPD_Armory, NCPD_Investigations, NCPD_Command ]

- type: startingGear
  id: NCPDLieutenantGear
  equipment:
    jumpsuit: ClothingUniformNCPDCommand
    back: ClothingBackpackSecurity
    shoes: ClothingShoesBootsJack
    head: ClothingHeadHatWarden
    eyes: ClothingEyesGlassesSecurity
    id: NCPDLieutenantPDA
    belt: ClothingBeltSecurity
    armor: ClothingOuterArmorBulletproof
    neck: NCPDWarrantCard
  storage:
    back:
    - WantedListCartridge
    belt:
    - Handcuffs
    - Handcuffs
    - HoloprojectorSecurity
    - RadioHandheldSecurity

- type: jobIcon
  parent: JobIcon
  id: JobIconNCPDLieutenant
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: ncpd_Letenant
  jobName: job-name-ncpd-lieutenant

- type: entity
  parent: NCIDCardStandard
  id: NCPDLieutenantAccesCard
  name: NCPD lieutenant acces card
  components:
  - type: Sprite
    layers:
    - state: ncpd
  - type: PresetIdCard
    job: NCPDLieutenant

- type: entity
  parent: BaseSecurityPDA
  id: NCPDLieutenantPDA
  name: NCPD lieutenant PDA
  description: Scuffed from years of paperwork and riots.
  components:
  - type: Pda
    id: NCPDLieutenantAccesCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-warden
  - type: PdaBorderColor
    borderColor: "#4777C8"
    accentVColor: "#2F5C9E"
  - type: Icon
    state: pda-warden
