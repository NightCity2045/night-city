- type: job
  id: NCPDChief
  name: job-name-ncpd-chief
  description: job-description-ncpd-chief
  playTimeTracker: NCJobNCPDChief
  supervisors: nc-job-supervisors-city-administration
  weight: 100
  salary: 450
  ncNpcAllowed: false
  setPreference: false
  startingGear: NCPDChiefGear
  icon: JobIconNCPDChief
  accessGroups: [ NCPDBasic ]
  access: [ NCPD_Command, NCPD_Armory, NCPD_Investigations ]

- type: startingGear
  id: NCPDChiefGear
  equipment:
    jumpsuit: ClothingUniformNCPDChief
    back: ClothingBackpackSecurity
    shoes: ClothingShoesBootsJack
    head: ClothingHeadHatBeretHoS
    eyes: ClothingEyesGlassesSecurity
    gloves: ClothingHandsGlovesCombat
    id: NCPDChiefPDA
    belt: ClothingBeltSecurity
    armor: ClothingOuterArmorBulletproof
    outerClothing: ClothingOuterCoatHoSTrench
    neck: NCPDWarrantCard
  storage:
    back:
    - WantedListCartridge
    belt:
    - Handcuffs
    - Handcuffs
    - HoloprojectorSecurity
    - RadioHandheldSecurity

- type: jobIcon
  parent: JobIcon
  id: JobIconNCPDChief
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: ncpd_Nachalnik
  jobName: job-name-ncpd-chief

- type: entity
  parent: NCIDCardStandard
  id: NCPDChiefAccesCard
  name: NCPD chief acces card
  components:
  - type: Sprite
    layers:
    - state: ncpd
  - type: PresetIdCard
    job: NCPDChief

- type: entity
  parent: BaseSecurityPDA
  id: NCPDChiefPDA
  name: NCPD chief PDA
  description: Carries more authority than its cracked screen suggests.
  components:
  - type: Pda
    id: NCPDChiefAccesCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-hos
  - type: PdaBorderColor
    borderColor: "#4777C8"
    accentVColor: "#D8A650"
  - type: Icon
    state: pda-hos
