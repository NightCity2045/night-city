- type: job
  id: NCPDOfficer
  name: job-name-ncpd-officer
  description: job-description-ncpd-officer
  playTimeTracker: NCJobNCPDOfficer
  supervisors: nc-job-supervisors-ncpd-sergeants
  weight: 40
  salary: 120
  setPreference: false
  startingGear: NCPDOfficerGear
  icon: JobIconNCPDOfficer
  accessGroups: [ NCPDBasic ]

- type: startingGear
  id: NCPDOfficerGear
  equipment:
    jumpsuit: ClothingUniformNCPDPatrol
    back: ClothingBackpackSecurity
    shoes: ClothingShoesBootsJack
    eyes: ClothingEyesGlassesSecurity
    id: NCPDOfficerPDA
    belt: ClothingBeltSecurity
    armor: ClothingOuterArmorBasic
    neck: NCPDBadgeSilver
  storage:
    back:
    - WantedListCartridge
    belt:
    - Handcuffs
    - Handcuffs
    - HoloprojectorSecurity
    - RadioHandheldSecurity
- type: jobIcon
  parent: JobIcon
  id: JobIconNCPDOfficer
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: ncpd_policer
  jobName: job-name-ncpd-officer

- type: entity
  parent: NCIDCardStandard
  id: NCPDOfficerAccesCard
  name: NCPD officer acces card
  components:
  - type: Sprite
    layers:
    - state: ncpd
  - type: PresetIdCard
    job: NCPDOfficer

- type: entity
  parent: BaseSecurityPDA
  id: NCPDOfficerPDA
  name: NCPD officer PDA
  description: Rugged and well-worn. Like the beat it walks.
  components:
  - type: Pda
    id: NCPDOfficerAccesCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-security
  - type: PdaBorderColor
    borderColor: "#4777C8"
    accentVColor: "#2F5C9E"
  - type: Icon
    state: pda-security
