- type: job
  id: NCPDInspector
  name: job-name-ncpd-inspector
  description: job-description-ncpd-inspector
  playTimeTracker: NCJobNCPDInspector
  supervisors: nc-job-supervisors-ncpd-lieutenants
  weight: 80
  salary: 200
  setPreference: false
  startingGear: NCPDInspectorGear
  icon: JobIconNCPDInspector
  accessGroups: [ NCPDBasic ]
  access: [ NCPD_Investigations ]

- type: startingGear
  id: NCPDInspectorGear
  equipment:
    jumpsuit: ClothingUniformNCPDPatrol
    back: ClothingBackpackSecurity
    shoes: ClothingShoesColorBlack
    head: ClothingHeadHatFedoraBrown
    eyes: ClothingEyesGlassesSecurity
    gloves: ClothingHandsGlovesForensic
    id: NCPDInspectorPDA
    belt: ClothingBeltSecurity
    armor: ClothingOuterVestDetective
    neck: NCPDBadgeSilverGold
  storage:
    back:
    - ForensicPad
    - ForensicScanner
    - WantedListCartridge
    - LogProbeCartridge
    belt:
    - Handcuffs
    - Handcuffs
    - HoloprojectorSecurity
    - RadioHandheldSecurity

- type: jobIcon
  parent: JobIcon
  id: JobIconNCPDInspector
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: ncpd_inspector
  jobName: job-name-ncpd-inspector

- type: entity
  parent: NCIDCardStandard
  id: NCPDInspectorAccesCard
  name: NCPD inspector acces card
  components:
  - type: Sprite
    layers:
    - state: ncpd
  - type: PresetIdCard
    job: NCPDInspector

- type: entity
  parent: BaseSecurityPDA
  id: NCPDInspectorPDA
  name: NCPD inspector PDA
  description: Full of case notes and half-finished thoughts.
  components:
  - type: Pda
    id: NCPDInspectorAccesCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-detective
  - type: PdaBorderColor
    borderColor: "#4777C8"
    accentVColor: "#2F5C9E"
  - type: Icon
    state: pda-detective
