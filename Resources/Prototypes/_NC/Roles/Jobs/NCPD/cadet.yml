- type: job
  id: NCPDCadet
  name: job-name-ncpd-cadet
  description: job-description-ncpd-cadet
  playTimeTracker: NCJobNCPDCadet
  supervisors: nc-job-supervisors-ncpd-officers
  weight: 10
  salary: 80
  setPreference: false
  startingGear: NCPDCadetGear
  icon: JobIconNCPDCadet
  accessGroups: [ NCPDBasic ]

- type: startingGear
  id: NCPDCadetGear
  equipment:
    jumpsuit: ClothingUniformNCPDPatrol
    back: ClothingBackpackSecurity
    shoes: ClothingShoesBootsJack
    eyes: ClothingEyesGlassesSecurity
    id: NCPDCadetPDA
    belt: ClothingBeltSecurity
    armor: ClothingOuterArmorBasicSlim
    pocket2: BookSecurity
    neck: NCPDBadgeSilver
  storage:
    back:
    - WantedListCartridge
    belt:
    - Handcuffs
    - RadioHandheldSecurity

- type: jobIcon
  parent: JobIcon
  id: JobIconNCPDCadet
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: ncpd_policer
  jobName: job-name-ncpd-cadet

- type: entity
  parent: NCIDCardStandard
  id: NCPDCadetAccesCard
  name: NCPD cadet acces card
  components:
  - type: Sprite
    layers:
    - state: ncpd
  - type: PresetIdCard
    job: NCPDCadet

- type: entity
  parent: BaseSecurityPDA
  id: NCPDCadetPDA
  name: NCPD cadet PDA
  description: A rugged department terminal tied to its owner's persistent position.
  components:
  - type: Pda
    id: NCPDCadetAccesCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-security
  - type: PdaBorderColor
    borderColor: "#4777C8"
    accentVColor: "#2F5C9E"
  - type: Icon
    state: pda-security
