- type: job
  id: NCPDCadet
  name: job-name-ncpd-cadet
  description: job-description-ncpd-cadet
  playTimeTracker: NCJobNCPDCadet
  supervisors: nc-job-supervisors-ncpd-officers
  weight: 10
  salary: 80
  setPreference: false
  startingGear: NCPDCadetGear
  icon: JobIconNCPDCadet
  accessGroups: [ NCPDBasic ]

- type: startingGear
  id: NCPDCadetGear
  equipment:
    jumpsuit: ClothingUniformNCPDPatrol
    back: ClothingBackpackSecurity
    shoes: ClothingShoesBootsJack
    eyes: ClothingEyesGlassesSecurity
    id: NCPDCadetPDA
    ears: ClothingHeadsetSecurity
    belt: ClothingBeltSecurityFilled
    outerClothing: ClothingOuterArmorBasic
    pocket2: BookSecurity

- type: jobIcon
  parent: JobIcon
  id: JobIconNCPDCadet
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: ncpd_policer
  jobName: job-name-ncpd-cadet

- type: entity
  parent: IDCardStandard
  id: NCPDCadetIDCard
  name: NCPD cadet ID
  components:
  - type: Sprite
    layers:
    - state: default
    - state: stripe_top
      color: "#4777C8"
    - state: stripe_bottom
      color: "#2F5C9E"
    - sprite: _NC/Interface/Misc/job_icons.rsi
      offset: -0.09375, 0.0625
      state: ncpd_policer
  - type: PresetIdCard
    job: NCPDCadet

- type: entity
  parent: BaseSecurityPDA
  id: NCPDCadetPDA
  name: NCPD cadet PDA
  description: A rugged department terminal tied to its owner's persistent position.
  components:
  - type: Pda
    id: NCPDCadetIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-security
  - type: PdaBorderColor
    borderColor: "#4777C8"
  - type: Icon
    state: pda-security
