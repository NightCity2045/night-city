- type: job
  id: BiotechnicaRigger
  name: job-name-biotechnica-rigger
  description: job-description-biotechnica-rigger
  playTimeTracker: NCJobBiotechnicaRigger
  supervisors: nc-job-supervisors-biotechnica-management
  weight: 55
  salary: 300
  setPreference: false
  startingGear: BiotechnicaRiggerGear
  icon: JobIconBiotechnicaRigger
  accessGroups: [ BiotechBasic ]
  access: [ Biotech_Tech ]

- type: startingGear
  id: BiotechnicaRiggerGear
  equipment:
    jumpsuit: ClothingUniformBiotech
    back: ClothingBackpackDuffelBiotechnica
    shoes: ClothingShoesBiotechnica
    head: ClothingHeadEnvirohelmBiotechnica
    eyes: ClothingEyesGogglesBiotechnicaTech
    gloves: ClothingHandsGlovesBiotechnica
    id: BiotechnicaRiggerPDA
    belt: ClothingBeltUtilityFilled
  storage:
    back:
    - LogProbeCartridge
    - AstroNavCartridge

- type: jobIcon
  parent: JobIcon
  id: JobIconBiotechnicaRigger
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: biotech
  jobName: job-name-biotechnica-rigger

- type: entity
  parent: BasePDA
  id: BiotechnicaRiggerPDA
  name: Biotechnica rigger PDA
  description: Smells like coolant and questionable repairs.
  components:
  - type: Pda
    id: BiotechnicaRiggerIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-engineer
  - type: PdaBorderColor
    borderColor: "#949137"
    accentVColor: "#A32D26"
  - type: Icon
    state: pda-engineer
