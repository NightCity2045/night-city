- type: job
  id: BiotechnicaParamedic
  name: job-name-biotechnica-paramedic
  description: job-description-biotechnica-paramedic
  playTimeTracker: NCJobBiotechnicaParamedic
  supervisors: nc-job-supervisors-biotechnica-management
  weight: 60
  salary: 150
  setPreference: false
  startingGear: BiotechnicaParamedicGear
  icon: JobIconBiotechnicaParamedic
  accessGroups: [ BiotechBasic ]
  access: [ Biotech_MedTech, Biotech_Operative ]

- type: startingGear
  id: BiotechnicaParamedicGear
  equipment:
    jumpsuit: ClothingUniformBiotech
    back: ClothingBackpackBiotechnica
    shoes: ClothingShoesBiotechnica
    head: ClothingHeadHatBiotechnicaSterile
    eyes: ClothingEyesHudMedical
    mask: ClothingMaskBiotechnicaMedtech
    gloves: ClothingHandsGlovesBiotechnica
    id: BiotechnicaParamedicPDA
    belt: ClothingBeltMedicalFilled
    armor: ClothingOuterArmorBiotechBulletproof
    outerClothing: ClothingOuterCoatBiotechnicaMedtechAdvanced
  storage:
    back:
    - MedTekCartridge

- type: jobIcon
  parent: JobIcon
  id: JobIconBiotechnicaParamedic
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: biotech_paramedic
  jobName: job-name-biotechnica-paramedic

- type: entity
  parent: BaseMedicalPDA
  id: BiotechnicaParamedicPDA
  name: paramedic PDA
  description: Someone already wiped the blood off. Mostly.
  components:
  - type: Pda
    id: BiotechnicaParamedicIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-paramedic
  - type: PdaBorderColor
    borderColor: "#d7d7d0"
    accentVColor: "#2a4b5b"
  - type: Icon
    state: pda-paramedic
