- type: job
  id: BiotechnicaNetrunner
  name: job-name-biotechnica-netrunner
  description: job-description-biotechnica-netrunner
  playTimeTracker: NCJobBiotechnicaNetrunner
  supervisors: nc-job-supervisors-biotechnica-management
  weight: 60
  startingGear: BiotechnicaNetrunnerGear
  icon: NCJobIconBiotechnicaNetrunner
  accessGroups: [ BiotechBasic ]
  access: [ Biotech_Tech ]

- type: startingGear
  id: BiotechnicaNetrunnerGear
  equipment:
    jumpsuit: ClothingUniformBiotech
    back: ClothingBackpackSatchelBiotechnica
    shoes: ClothingShoesColorBlack
    head: ClothingHeadHatBiotechCap
    eyes: ClothingEyesGlasses
    id: BiotechnicaNetrunnerPDA
    ears: ClothingHeadsetScience
    outerClothing: ClothingOuterCoatBiotechnicaMedtechRadiation
  storage:
    back:
    - NetProbeCartridge
    - LogProbeCartridge

- type: jobIcon
  parent: JobIcon
  id: NCJobIconBiotechnicaNetrunner
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: biotech_netruner
  jobName: job-name-biotechnica-netrunner

- type: entity
  parent: IDCardStandard
  id: BiotechnicaNetrunnerIDCard
  name: Biotechnica netrunner ID
  components:
  - type: Sprite
    layers:
    - state: default
    - state: stripe_top
      color: "#6DB15C"
    - state: stripe_bottom
      color: "#4A8A3B"
    - sprite: _NC/Interface/Misc/job_icons.rsi
      offset: -0.09375, 0.0625
      state: biotech_netruner
  - type: PresetIdCard
    job: BiotechnicaNetrunner

# Keeps the department tools of the SciencePDA it replaces.
- type: entity
  parent: SciencePDA
  id: BiotechnicaNetrunnerPDA
  name: Biotechnica netrunner PDA
  description: A rugged department terminal tied to its owner's persistent position.
  components:
  - type: Pda
    id: BiotechnicaNetrunnerIDCard
  - type: PdaBorderColor
    borderColor: "#6DB15C"
