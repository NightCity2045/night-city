- type: job
  id: BiotechnicaTech
  name: job-name-biotechnica-tech
  description: job-description-biotechnica-tech
  playTimeTracker: NCJobBiotechnicaTech
  supervisors: nc-job-supervisors-biotechnica-management
  weight: 50
  salary: 200
  setPreference: false
  startingGear: BiotechnicaTechGear
  icon: JobIconBiotechnicaTech
  accessGroups: [ BiotechBasic ]
  access: [ Biotech_Tech ]

- type: startingGear
  id: BiotechnicaTechGear
  equipment:
    jumpsuit: ClothingUniformBiotech
    back: ClothingBackpackBiotechnica
    shoes: ClothingShoesBiotechnica
    head: ClothingHeadHatBiotechCap
    eyes: ClothingEyesGogglesBiotechnicaTech
    gloves: ClothingHandsGlovesBiotechnica
    id: BiotechnicaTechPDA
    belt: ClothingBeltUtilityEngineering
  storage:
    back:
    - LogProbeCartridge
    - AstroNavCartridge

- type: jobIcon
  parent: JobIcon
  id: JobIconBiotechnicaTech
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: biotech_engineer
  jobName: job-name-biotechnica-tech

- type: entity
  parent: BasePDA
  id: BiotechnicaTechPDA
  name: Biotechnica technician PDA
  description: Half the buttons are labeled in marker.
  components:
  - type: Pda
    id: BiotechnicaTechIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-engineer
  - type: PdaBorderColor
    borderColor: "#949137"
    accentVColor: "#A32D26"
  - type: Icon
    state: pda-engineer
