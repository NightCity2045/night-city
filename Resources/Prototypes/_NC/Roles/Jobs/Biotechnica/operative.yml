- type: job
  id: BiotechnicaOperative
  name: job-name-biotechnica-operative
  description: job-description-biotechnica-operative
  playTimeTracker: NCJobBiotechnicaOperative
  supervisors: nc-job-supervisors-biotechnica-management
  weight: 70
  salary: 250
  setPreference: false
  startingGear: BiotechnicaOperativeGear
  icon: JobIconBiotechnicaOperative
  accessGroups: [ BiotechBasic ]
  access: [ Biotech_Operative ]

- type: startingGear
  id: BiotechnicaOperativeGear
  equipment:
    jumpsuit: ClothingUniformBiotech
    back: ClothingBackpackBiotechnica
    shoes: ClothingShoesBootsJack
    head: ClothingHeadHatBiotechCap
    eyes: ClothingEyesGlassesSecurity
    gloves: ClothingHandsGlovesBiotechnica
    id: BiotechnicaOperativePDA
    belt: ClothingBeltSecurity
    armor: ClothingOuterArmorBiotechBulletproof
  storage:
    belt:
    - Handcuffs
    - HoloprojectorSecurity
    - RadioHandheldSecurity

- type: jobIcon
  parent: JobIcon
  id: JobIconBiotechnicaOperative
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: biotech_operative
  jobName: job-name-biotechnica-operative

- type: entity
  parent: BaseSecurityPDA
  id: BiotechnicaOperativePDA
  name: security PDA
  description: Scuffed, dented, and still logged in.
  components:
  - type: Pda
    id: BiotechnicaOperativeIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-security
  - type: PdaBorderColor
    borderColor: "#949137"
    accentVColor: "#A32D26"
  - type: Icon
    state: pda-security
