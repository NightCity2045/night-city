- type: job
  id: BiotechnicaOperativeLead
  name: job-name-biotechnica-operative-lead
  description: job-description-biotechnica-operative-lead
  playTimeTracker: NCJobBiotechnicaOperativeLead
  supervisors: nc-job-supervisors-biotechnica-management
  weight: 80
  salary: 350
  setPreference: false
  startingGear: BiotechnicaOperativeLeadGear
  icon: JobIconBiotechnicaOperativeLead
  accessGroups: [ BiotechBasic ]
  access: [ Biotech_HeadOfDepartment, Biotech_Operative ]

- type: startingGear
  id: BiotechnicaOperativeLeadGear
  equipment:
    jumpsuit: ClothingUniformBiotech
    back: ClothingBackpackDuffelBiotechnica
    shoes: ClothingShoesBootsJack
    head: ClothingHeadHatBiotechCap
    eyes: ClothingEyesGlassesSecurity
    gloves: ClothingHandsGlovesBiotechnica
    id: BiotechnicaOperativeLeadPDA
    belt: ClothingBeltSecurity
    armor: ClothingOuterArmorBiotechBulletproof
  storage:
    belt:
    - Handcuffs
    - Handcuffs
    - HoloprojectorSecurity
    - RadioHandheldSecurity

- type: jobIcon
  parent: JobIcon
  id: JobIconBiotechnicaOperativeLead
  icon:
    sprite: /Textures/_NC/Interface/Misc/job_icons.rsi
    state: biotech_operative_lead
  jobName: job-name-biotechnica-operative-lead

- type: entity
  parent: BaseSecurityPDA
  id: BiotechnicaOperativeLeadPDA
  name: security PDA
  description: Carries more authority than its cracked screen suggests.
  components:
  - type: Pda
    id: BiotechnicaOperativeLeadIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-security
  - type: PdaBorderColor
    borderColor: "#949137"
    accentVColor: "#A32D26"
  - type: Icon
    state: pda-security
