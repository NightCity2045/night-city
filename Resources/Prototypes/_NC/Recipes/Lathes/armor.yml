# Body armor and helmets. Plates are steel and plasteel, the carrier is cloth; the hardsuit is the expensive line.
# Every vest in the armor slot is printable, gang colours included; Trauma Team hardsuits stay unprintable.
# Cost follows protection: light armorjacks (SP 11) are steel and cloth, plate carriers (SP 13) add plasteel,
# corporate carriers take more of it and the carapaces (SP 15) the most.

