- type: ncVehicleHandling
  parent: NCThortonColbyAutomaticAwd
  id: NCBiotechnicaFieldAutomaticAwd
  torqueCurve:
  - 0, 115
  - 850, 220
  - 2600, 390
  - 4800, 300
  - 6000, 0
  brakeTorque: 4200
  handbrakeTorque: 4400
  steeringRate: 5
  keyboardSteeringRate: 4.2
  friction: 1.02
  centerOfGravityHeight: 0.59
  antiLockBrakes: true
  tractionControl: true
  stabilityControl: true

- type: ncVehicleChassis
  parent: NCThortonColbyChassis
  id: NCBiotechnicaFieldChassis
  automaticAllWheelHandling: NCBiotechnicaFieldAutomaticAwd
  mass: 1650
  inertia: 3000
  stockPartOverrides:
    gearbox: NCVehicleAutomaticGearbox
    front-differential: NCVehicleFrontDifferential
    front-left-shaft: NCVehicleFrontLeftShaft
    front-right-shaft: NCVehicleFrontRightShaft
    transfer-case: NCVehicleTransferCase
  seats:
    rear-left:
      name: nc-vehicle-seat-passenger
      position: -0.4, -0.4
      exit: -1.3, -0.4
    rear-right:
      name: nc-vehicle-seat-passenger
      position: 0.4, -0.4
      exit: 1.3, -0.4

- type: entity
  parent: NCToyotaSupra1996
  id: NCVehicleBiotechnicaField2045
  name: Biotechnica field utility vehicle
  description: A sealed AWD field vehicle for research teams, samples and hazardous cargo.
  components:
  - type: NCVehicle
    chassis: NCBiotechnicaFieldChassis
  - type: NCVehicleDrive
    handling: NCBiotechnicaFieldAutomaticAwd
    fuel: 66
  - type: Storage
    grid:
    - 0,0,13,6
  - type: EntityStorage
    maxSize: 1.4
    capacity: 5
    enteringOffset: 0, -1.75
  - type: Sprite
    sprite: _NC/Vehicle/biotechnica_field_2045.rsi
  - type: Fixtures
    fixtures:
      chassis:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.88,-1.78,0.88,1.78"
        density: 201
        restitution: 0.04
        mask: [MobMask]
        layer: [LargeMobLayer]

