- type: reagent
  parent: Ethanol
  id: NCCHOOH2
  name: reagent-name-nc-chooh2
  desc: reagent-desc-nc-chooh2
  color: "#d9b566"

- type: entity
  parent: Solution
  id: NCVehicleFuelReservoir
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    id: fuel
    solution:
      maxVol: 70000
      canReact: false
      reagents:
      - ReagentId: NCCHOOH2
        Quantity: 35000

- type: entity
  parent: BaseItem
  id: NCCHOOH2Canister
  name: CHOOH2 fuel canister
  components:
