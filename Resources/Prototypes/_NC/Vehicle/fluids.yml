    sprite: Objects/Misc/stock_parts.rsi
    state: micro_mani
  - type: Solution
    id: tank
    solution:
      maxVol: 20000
      reagents:
      - ReagentId: NCCHOOH2
        Quantity: 20000
  - type: DrainableSolution
    solution: tank
  - type: RefillableSolution
    solution: tank
  - type: SolutionTransfer
    transferAmount: 1000
    maxTransferAmount: 20000
  - type: NCVehicleFluidBottle
    circuit: Fuel
    transferVolume: 1000
  - type: ExaminableSolution
    solution: tank
