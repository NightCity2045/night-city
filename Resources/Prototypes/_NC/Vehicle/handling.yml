  - position: 0.64, 1.1
    radius: 0.31
    inertia: 1.4
    driveWeight: 0.2
    brakeWeight: 0.6
    steered: true
  - position: -0.64, -1.1
    axle: 1
    radius: 0.31
    inertia: 1.4
    driveWeight: 0.3
    brakeWeight: 0.4
