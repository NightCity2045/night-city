- type: entity
  parent: NCBaseVehicleInfrastructure
  id: NCVehicleParkingBay
  name: parking bay terminal
  description: Marks a physical parking space. Park your stopped car beside it and reserve the bay from the dashboard.
  components:
  - type: NCVehicleParking
    radius: 3

- type: entity
  parent: NCBaseVehicleInfrastructure
  id: NCVehicleGarageEntrance
  name: garage entrance terminal
  description: Stop the engine and use the garage passage on your dashboard. The car and its contents move together.
  components:
  - type: NCVehicleGate
    gateId: garage-street
    destination: garage-interior
    arrivalOffset: 0, -3
    radius: 5

- type: entity
  parent: NCVehicleGarageEntrance
  id: NCVehicleGarageExit
  name: garage exit terminal
  components:
  - type: NCVehicleGate
    gateId: garage-interior
    destination: garage-street
