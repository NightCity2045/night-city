- type: ncVehiclePart
  id: NCVehicleHeadlamps
  mount: NCVehicleHeadlampsMount
  item: NCVehicleHeadlampsItem
  mass: 4
  inertia: 1
  repairCategory: Electrical
  minimumRepairCondition: 0.1

- type: entity
  parent: NCBaseVehiclePartItem
  id: NCVehicleHeadlampsItem
  name: headlamp assembly
  components:
  - type: NCVehiclePartItem
    part: NCVehicleHeadlamps
  - type: Sprite
    sprite: _NC/Vehicle/parts.rsi
    state: headlamps

