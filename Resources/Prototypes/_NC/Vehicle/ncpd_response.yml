- type: ncVehicleHandling
  parent: NCThortonGalenaAutomaticAwd
  id: NCNcpdResponseAutomaticAwd
  torqueCurve:
  - 0, 130
  - 850, 230
  - 2800, 410
  - 5200, 320
  - 6500, 0
  brakeTorque: 4700
  handbrakeTorque: 5000
  friction: 1.05
  centerOfGravityHeight: 0.58
  antiLockBrakes: true
  tractionControl: true
  stabilityControl: true

- type: ncVehicleChassis
  parent: NCThortonGalenaChassis
  id: NCNcpdResponseChassis
  automaticAllWheelHandling: NCNcpdResponseAutomaticAwd
  mass: 1780
  inertia: 3100
  stockPartOverrides:
    gearbox: NCVehicleAutomaticGearbox
    front-differential: NCVehicleFrontDifferential
    front-left-shaft: NCVehicleFrontLeftShaft
    front-right-shaft: NCVehicleFrontRightShaft
    transfer-case: NCVehicleTransferCase
  seats:
    rear-left:
      name: nc-vehicle-seat-passenger
      position: -0.4, -0.45
      exit: -1.3, -0.45
    rear-right:
      name: nc-vehicle-seat-passenger
      position: 0.4, -0.45
      exit: 1.3, -0.45

- type: entity
  parent: NCToyotaSupra1996
  id: NCVehicleNcpdResponse2045
  name: NCPD armored response vehicle
  description: A protected AWD response vehicle with room for a four-officer team and detained cargo.
  components:
  - type: NCVehicle
    chassis: NCNcpdResponseChassis
  - type: NCVehicleDrive
    handling: NCNcpdResponseAutomaticAwd
    fuel: 62
  - type: Storage
    grid:
    - 0,0,11,5
  - type: EntityStorage
    maxSize: 1.3
    capacity: 4
    enteringOffset: 0, -1.7
  - type: Sprite
    sprite: _NC/Vehicle/ncpd_response_2045.rsi
  - type: Fixtures
    fixtures:
      chassis:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.88,-1.75,0.88,1.75"
        density: 201
        restitution: 0.04
        mask: [MobMask]
        layer: [LargeMobLayer]

