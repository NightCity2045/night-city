- type: entity
  parent: NCVehicleRepairKit
  id: NCVehicleElectricalRepairKit
  name: electrical repair supplies
  components:
  - type: NCVehicleRepairKit
    category: Electrical
    maximumCondition: 0.85
    restoreAmount: 0.3
    seconds: 60
    uses: 1

- type: entity
  parent: NCVehicleRepairKit
  id: NCVehicleRunningGearRepairKit
  name: running gear rebuild supplies
  components:
  - type: NCVehicleRepairKit
    category: RunningGear
    maximumCondition: 0.85
    restoreAmount: 0.3
    seconds: 60
    uses: 1

- type: entity
  parent: NCVehicleRepairKit
  id: NCVehicleRubberRepairKit
  name: tyre patch kit
  components:
  - type: NCVehicleRepairKit
    category: Rubber
    maximumCondition: 0.85
    restoreAmount: 0.3
    seconds: 60
    uses: 1

- type: entity
  parent: NCVehicleRepairKit
  id: NCVehicleBodyworkRepairKit
  name: bodywork repair supplies
  components:
  - type: NCVehicleRepairKit
    category: Bodywork
    maximumCondition: 0.85
    restoreAmount: 0.3
    seconds: 60
    uses: 1

- type: entity
  parent: NCVehicleMechanicTool
  id: NCVehicleScanner
  name: vehicle electronic scanner
  components:
  - type: NCVehicleDiagnosticTool
    level: 2
    categories: [Electrical]
  - type: Sprite
    sprite: _NC/Vehicle/tools.rsi
    layers:
    - state: scanner

- type: entity
  parent: NCVehicleMechanicTool
  id: NCVehicleCompressionTester
  name: compression and pressure test kit
  components:
  - type: NCVehicleDiagnosticTool
    level: 2
    categories: [Mechanical]

- type: entity
  parent: NCVehicleMechanicTool
  id: NCVehicleAlignmentGauge
  name: chassis alignment and tread gauge
  components:
  - type: NCVehicleDiagnosticTool
    level: 2
    categories: [RunningGear, Rubber, Bodywork]
  - type: Sprite
    sprite: _NC/Vehicle/tools.rsi
    layers:
    - state: alignment

