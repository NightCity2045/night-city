- type: entity
  parent: NCToyotaSupra1996
  id: NCVehicleRecoveryTruck
  name: recovery truck
  description: A working flatbed with a cable winch and reusable tie-down straps. The crew does the recovery.
  components:
  - type: NCVehicle
    chassis: NCRecoveryTruckChassis
  - type: NCVehicleDrive
    handling: NCRecoveryTruckAutomaticHandling
  - type: Storage
    grid:
    - 0,0,15,7
  - type: EntityStorage
    maxSize: 1.5
    capacity: 6
    enteringOffset: 0, 2
  - type: NCVehicleRecovery
    maximumLoad: 2400
    deckPosition: 0, -1
    unloadPosition: 0, -6.5
    cargoHalfExtents: 1, 2.2
    loadingSeconds: 20
    securingSeconds: 15
    loadGap: 1
    winchRate: 0.3
  - type: NCVehicleBody
    zones:
      front-left:
        name: nc-vehicle-zone-front-left
        position: -1, 3.8
        energyCapacity: 20000
        moduleEnergyCapacity: 10000
        exterior: true
        protectedSlots: [engine, fl-tyre, fl-hub, fl-brake]
        cabinDamageTransfer: 0.1
        exposedSeats: [driver]
      front-center:
        name: nc-vehicle-zone-front-center
        position: 0, 3.95
        energyCapacity: 20000
        moduleEnergyCapacity: 10000
        exterior: true
        protectedSlots: [engine, radiator, front-bumper, hood, fuel-pump, headlamps]
        cabinDamageTransfer: 0.15
        exposedSeats: [driver, passenger]
      front-right:
        name: nc-vehicle-zone-front-right
        position: 1, 3.8
        energyCapacity: 20000
        moduleEnergyCapacity: 10000
        exterior: true
        protectedSlots: [engine, fr-tyre, fr-hub, fr-brake]
        cabinDamageTransfer: 0.1
        exposedSeats: [passenger]
      left-side:
        name: nc-vehicle-zone-left-side
        position: -1.1, 2.8
        energyCapacity: 20000
        moduleEnergyCapacity: 40000
        exterior: true
        protectedSlots: [gearbox]
        cabinDamageTransfer: 0.35
        exposedSeats: [driver]
      right-side:
        name: nc-vehicle-zone-right-side
        position: 1.1, 2.8
        energyCapacity: 20000
        moduleEnergyCapacity: 40000
        exterior: true
        protectedSlots: [gearbox]
        cabinDamageTransfer: 0.35
        exposedSeats: [passenger]
      rear-left:
        name: nc-vehicle-zone-rear-left
        position: -1, -3.8
        energyCapacity: 20000
        moduleEnergyCapacity: 40000
        exterior: true
        protectedSlots: [rl-tyre, rl-hub, rl-brake, fuel-tank]
      rear-center:
        name: nc-vehicle-zone-rear-center
        position: 0, -3.95
        energyCapacity: 20000
        moduleEnergyCapacity: 40000
        exterior: true
        protectedSlots: [rear-bumper, rear-differential, fuel-tank]
      rear-right:
        name: nc-vehicle-zone-rear-right
        position: 1, -3.8
        energyCapacity: 20000
        moduleEnergyCapacity: 40000
        exterior: true
        protectedSlots: [rr-tyre, rr-hub, rr-brake, fuel-tank]
      roof:
        name: nc-vehicle-zone-roof
        position: 0, 2.8
        energyCapacity: 10000
        moduleEnergyCapacity: 40000
        exterior: false
        protectedSlots: []
      underbody:
        name: nc-vehicle-zone-underbody
        position: 0, 0
        energyCapacity: 10000
        moduleEnergyCapacity: 40000
        exterior: false
        protectedSlots: [gearbox]
      cabin:
        name: nc-vehicle-zone-cabin
        position: 0, 2.8
        energyCapacity: 10000
        moduleEnergyCapacity: 40000
        exterior: false
        protectedSlots: []
      cargo:
        name: nc-vehicle-zone-cargo
        position: 0, -1
        energyCapacity: 10000
        moduleEnergyCapacity: 40000
        exterior: false
        protectedSlots: []
  - type: PointLight
    offset: 0, 3.5
  - type: Sprite
    sprite: _NC/Vehicle/towtruck.rsi
    layers:
    - state: shadow
      map: ["enum.NCVehicleVisualLayers.Shadow"]
    - state: body
      map: ["enum.NCVehicleVisualLayers.Body"]
    - state: damage-light
      map: ["enum.NCVehicleVisualLayers.DamageLight"]
      visible: false
    - state: damage-heavy
      map: ["enum.NCVehicleVisualLayers.DamageHeavy"]
      visible: false
    - state: tuning-street
      map: ["enum.NCVehicleVisualLayers.Tuning"]
      visible: false
    - state: hood-open
      map: ["enum.NCVehicleVisualLayers.Hood"]
      visible: false
    - state: wheel-damage
      map: ["enum.NCVehicleVisualLayers.Wheels"]
      visible: false
    - state: headlights
      map: ["enum.NCVehicleVisualLayers.Headlights"]
      visible: false
      shader: unshaded
    - state: brakes
      map: ["enum.NCVehicleVisualLayers.Brakes"]
      visible: false
      shader: unshaded
    - state: reverse
      map: ["enum.NCVehicleVisualLayers.Reverse"]
      visible: false
      shader: unshaded
    - state: smoke
      map: ["enum.NCVehicleVisualLayers.Smoke"]
      visible: false
    # The shared 128px art density is doubled for the eight-metre recovery chassis.
    noRot: false
    scale: 2, 2
  - type: Fixtures
    fixtures:
      chassis:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.1,-3.95,1.1,3.95"
        density: 201
        restitution: 0.05
        mask:
        - MobMask
        layer:
        - LargeMobLayer
