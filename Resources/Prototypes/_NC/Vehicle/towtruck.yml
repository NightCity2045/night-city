- type: ncVehicleHandling
  parent: NCBaseSupraHandling
  id: NCRecoveryTruckHandling
  finalDrive: 5.5
  wheelbase: 4.6
  exitOffset: -1.5, 2.5
  brakeTorque: 16000
  handbrakeTorque: 9000
  handbrakeLateralGrip: 0.65
  wheels:
  - position: -0.9, 2.4
    radius: 0.4
    inertia: 4
    driveWeight: 0
    brakeWeight: 0.6
    steered: true
  - position: 0.9, 2.4
    radius: 0.4
    inertia: 4
    driveWeight: 0
    brakeWeight: 0.6
    steered: true
  - position: -0.9, -2.2
    axle: 1
    radius: 0.4
    inertia: 8
    driveWeight: 0.5
    brakeWeight: 0.4
    handbrake: true
  - position: 0.9, -2.2
    axle: 1
    radius: 0.4
    inertia: 8
    driveWeight: 0.5
    brakeWeight: 0.4
    handbrake: true

- type: ncVehicleHandling
  parent: NCRecoveryTruckHandling
  id: NCRecoveryTruckAutomaticHandling
  automatic: true
  gearRatios: [0, 2.8, 1.53, 1, 0.71, -2.39]
  manualPattern: [1, 2, 3, 4, 0, 0]

- type: ncVehicleHandling
  parent: NCRecoveryTruckHandling
  id: NCRecoveryTruckAwdHandling
  centerDifferentialCoupling: 10
  centerDifferentialTorqueLimit: 150
  stabilityControl: true
  tractionControl: true
  antiLockBrakes: true
  wheels:
  - position: -0.9, 2.4
    radius: 0.4
    inertia: 4
    driveWeight: 0.2
    brakeWeight: 0.6
    steered: true
  - position: 0.9, 2.4
    radius: 0.4
    inertia: 4
    driveWeight: 0.2
    brakeWeight: 0.6
    steered: true
  - position: -0.9, -2.2
    axle: 1
    radius: 0.4
    inertia: 8
    driveWeight: 0.3
    brakeWeight: 0.4
    handbrake: true
  - position: 0.9, -2.2
    axle: 1
    radius: 0.4
    inertia: 8
    driveWeight: 0.3
    brakeWeight: 0.4
    handbrake: true

- type: ncVehicleHandling
  parent: NCRecoveryTruckAwdHandling
  id: NCRecoveryTruckAutomaticAwdHandling
  automatic: true
  gearRatios: [0, 2.8, 1.53, 1, 0.71, -2.39]
  manualPattern: [1, 2, 3, 4, 0, 0]

