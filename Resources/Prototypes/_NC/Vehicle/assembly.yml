# Development assembly data, not a balanced or drivable release vehicle.
# Local axes: X right, Y forward. Distances use world units; masses use kilograms.
- type: ncVehiclePart
  id: NCVehicleDevelopmentEngine
  item: NCVehicleEngineItem
  mount: NCVehicleInlineEngineMount
  mass: 145
  inertia: 12
  powerDependsOnCondition: true
  engineWearShare: 1

- type: ncVehiclePart
  id: NCVehicleDevelopmentGearbox
  item: NCVehicleGearboxItem
  mount: NCVehicleLongitudinalGearboxMount
  mass: 55
  inertia: 4
  powerDependsOnCondition: true
  gearboxWearShare: 1

- type: ncVehicleChassis
