- type: ncVehicleHandling
  parent: NCThortonColbyAutomaticRwd
  id: NCBiotechnicaLabVanAutomaticRwd
  torqueCurve:
  - 0, 120
  - 750, 230
  - 2400, 410
  - 4200, 320
  - 5500, 0
  finalDrive: 4.35
  brakeTorque: 4500
  handbrakeTorque: 4200
  steeringRate: 4.2
  keyboardSteeringRate: 3.8
  centerOfGravityHeight: 0.67
  aerodynamicDrag: 0.58
  rollingResistance: 14
  antiLockBrakes: true
  tractionControl: true
  stabilityControl: true

- type: ncVehicleChassis
  parent: NCThortonColbyChassis
  id: NCBiotechnicaLabVanChassis
  automaticHandling: NCBiotechnicaLabVanAutomaticRwd
  mass: 2350
  inertia: 5100
  stockPartOverrides:
    gearbox: NCVehicleAutomaticGearbox
  seats:
    lab-left:
      name: nc-vehicle-seat-passenger
      position: -0.4, -0.55
      exit: -1.3, -0.55
    lab-right:
      name: nc-vehicle-seat-passenger
      position: 0.4, -0.55
      exit: 1.3, -0.55

- type: entity
  parent: NCToyotaSupra1996
  id: NCVehicleBiotechnicaLabVan2045
  name: Biotechnica mobile laboratory
  description: A heavy laboratory van with sealed sample storage and four crew positions.
  components:
  - type: NCVehicle
    chassis: NCBiotechnicaLabVanChassis
  - type: NCVehicleDrive
    handling: NCBiotechnicaLabVanAutomaticRwd
    fuel: 74
  - type: Storage
    grid:
    - 0,0,17,8
  - type: EntityStorage
    maxSize: 1.55
    capacity: 7
    enteringOffset: 0, -1.9
  - type: Sprite
    sprite: _NC/Vehicle/biotechnica_lab_van_2045.rsi
  - type: Fixtures
    fixtures:
      chassis:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.9,-1.92,0.9,1.92"
        density: 201
        restitution: 0.04
        mask: [MobMask]
        layer: [LargeMobLayer]

