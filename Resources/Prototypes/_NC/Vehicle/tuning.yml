- type: ncVehicleTuning
  id: NCVehicleStreetCalibration
  name: nc-vehicle-calibration-street
  seconds: 30

- type: ncVehicleTuning
  id: NCVehicleEconomyCalibration
  name: nc-vehicle-calibration-economy
  engineMultiplier: 0.85
  fuelMultiplier: 0.8
  heatMultiplier: 0.75
  steeringMultiplier: 0.9
  frontBrakeMultiplier: 1.05
  rearBrakeMultiplier: 0.925
  seconds: 45

- type: ncVehicleTuning
  id: NCVehicleSportCalibration
  name: nc-vehicle-calibration-sport
  engineMultiplier: 1.1
  fuelMultiplier: 1.2
  heatMultiplier: 1.3
  steeringMultiplier: 1.05
  differentialMultiplier: 1.4
  frontBrakeMultiplier: 0.95
  rearBrakeMultiplier: 1.075
  seconds: 60
