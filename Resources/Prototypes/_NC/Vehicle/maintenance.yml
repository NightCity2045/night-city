- type: reagent
  parent: Water
  id: NCEngineOil
  name: reagent-name-nc-vehicle-oil
  desc: reagent-desc-nc-vehicle-oil
  color: "#879969"

- type: entity
  parent: Solution
  id: NCVehicleOilReservoir
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    id: oil
    solution:
      maxVol: 5000
      canReact: false
      reagents:
      - ReagentId: NCEngineOil
        Quantity: 5000

- type: entity
  parent: BaseItem
  id: NCVehicleOilBottle
  name: vehicle engine oil bottle
  components:
  - type: Sprite
    sprite: Objects/Misc/stock_parts.rsi
    state: micro_mani
  - type: NCVehicleFluidBottle
    circuit: Oil
    transferVolume: 1000
  - type: Solution
    id: tank
    solution:
      maxVol: 1000
      reagents:
      - ReagentId: NCEngineOil
        Quantity: 1000
  - type: DrainableSolution
    solution: tank
  - type: RefillableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank

- type: entity
  parent: BaseItem
  id: NCVehicleFluidDrainPan
  name: nc-vehicle-fluid-drain-pan-name
  description: nc-vehicle-fluid-drain-pan-desc
  components:
  - type: Sprite
    sprite: _NC/Vehicle/tools.rsi
    state: drainpan
  - type: NCVehicleFluidDrainPan
    transferVolume: 1000
  - type: Solution
    id: tank
    solution:
      maxVol: 12000
  - type: DrainableSolution
    solution: tank
  - type: RefillableSolution
    solution: tank
  - type: SolutionTransfer
    transferAmount: 1000
    maxTransferAmount: 12000
  - type: ExaminableSolution
    solution: tank

