- type: ncVehiclePart
  id: NCVehicleAutomaticGearbox
  item: NCVehicleAutomaticGearboxItem
  mount: NCVehicleLongitudinalGearboxMount
  mass: 68
  inertia: 3
  automaticTransmission: true
  powerDependsOnCondition: true
  gearboxWearShare: 1

- type: entity
  parent: NCBaseVehiclePartItem
  id: NCVehicleAutomaticGearboxItem
  name: automatic gearbox
  components:
  - type: NCVehiclePartItem
    part: NCVehicleAutomaticGearbox
  - type: Sprite
    sprite: _NC/Vehicle/parts.rsi
    state: gearbox

