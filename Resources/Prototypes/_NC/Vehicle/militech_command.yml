- type: ncVehicleHandling
  parent: NCQuadraType66AutomaticAwd
  id: NCMilitechCommandAutomaticAwd
  torqueCurve:
  - 0, 170
  - 800, 330
  - 2600, 580
  - 5200, 470
  - 6500, 0
  brakeTorque: 5800
  handbrakeTorque: 6100
  friction: 1.08
  centerOfGravityHeight: 0.55
  antiLockBrakes: true
  tractionControl: true
  stabilityControl: true

- type: ncVehicleChassis
  parent: NCQuadraType66Chassis
  id: NCMilitechCommandChassis
  automaticAllWheelHandling: NCMilitechCommandAutomaticAwd
  mass: 2050
  inertia: 3900
  stockPartOverrides:
    gearbox: NCVehicleAutomaticGearbox
    front-differential: NCVehicleFrontDifferential
    front-left-shaft: NCVehicleFrontLeftShaft
    front-right-shaft: NCVehicleFrontRightShaft
    transfer-case: NCVehicleTransferCase
  seats:
    rear-left:
      name: nc-vehicle-seat-passenger
      position: -0.4, -0.45
      exit: -1.3, -0.45
    rear-right:
      name: nc-vehicle-seat-passenger
      position: 0.4, -0.45
      exit: 1.3, -0.45

- type: entity
  parent: NCToyotaSupra1996
  id: NCVehicleMilitechCommand2045
  name: Militech command SUV
  description: An armored AWD command vehicle carrying four personnel and field equipment.
  components:
  - type: NCVehicle
    chassis: NCMilitechCommandChassis
  - type: NCVehicleDrive
    handling: NCMilitechCommandAutomaticAwd
    fuel: 72
  - type: Storage
    grid:
    - 0,0,12,6
  - type: EntityStorage
    maxSize: 1.35
    capacity: 4
    enteringOffset: 0, -1.7
  - type: Sprite
    sprite: _NC/Vehicle/militech_command_2045.rsi
  - type: Fixtures
    fixtures:
      chassis:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.9,-1.75,0.9,1.75"
        density: 201
        restitution: 0.03
        mask: [MobMask]
        layer: [LargeMobLayer]

