- type: reagent
  parent: Water
  id: NCVehicleTransmissionFluid
  name: reagent-name-nc-vehicle-transmission
  desc: reagent-desc-nc-vehicle-transmission
  color: "#7899a8"

- type: entity
  parent: Solution
  id: NCVehicleTransmissionReservoir
  categories: [HideSpawnMenu]
  components:
  - type: Solution
    id: transmission
    solution:
      maxVol: 2500
      canReact: false
      reagents:
      - ReagentId: NCVehicleTransmissionFluid
        Quantity: 2500

- type: entity
  parent: NCVehicleOilBottle
  id: NCVehicleTransmissionBottle
  name: transmission oil bottle
  components:
  - type: NCVehicleFluidBottle
    circuit: Transmission
    transferVolume: 1000
  - type: Solution
    id: tank
    solution:
      maxVol: 1000
      reagents:
      - ReagentId: NCVehicleTransmissionFluid
        Quantity: 1000

