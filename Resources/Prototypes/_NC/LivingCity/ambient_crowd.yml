- type: ncAmbientCrowdPolicy
  id: NCDefaultAmbientCrowdPolicy
  profiles:
  - NCDecorativePedestrian
  - NCInteractivePedestrian
  evaluationInterval: 2s
  decorativePerCluster: 8
  decorativePerPlayer: 4
  maximumDecorativePerClient: 48
  interactivePerCluster: 2
  interactivePerPlayer: 1
  maximumInteractivePerCluster: 8
  maximumInteractiveGlobal: 48
  elevatedDensityMultiplier: 0.5
  criticalDensityMultiplier: 0
  maximumSpawnsPerEvaluation: 3
  maximumDespawnsPerEvaluation: 6
  maximumCandidateChecks: 32
  spawnVisibilityExclusionRadius: 7
  despawnVisibilityExclusionRadius: 9
  occupancyExclusionRadius: 0.75
  clusterRetentionRadius: 34
  movementReachRange: 0.55
  maximumWitnessQueryResults: 32

- type: ncAmbientCrowdProfile
  id: NCDecorativePedestrian
  kind: Decorative
  spawnCandidateProfile: NCPedestrianSpawnCandidates
  weight: 1
  silhouetteColor: "#526B7396"
  silhouetteScale: 1
  silhouetteMotionRadius: 0.35
  silhouetteMotionSpeed: 0.6

- type: ncAmbientCrowdProfile
  id: NCInteractivePedestrian
  kind: Interactive
  spawnCandidateProfile: NCPedestrianSpawnCandidates
  entityPrototype: NCAmbientInteractivePedestrian
  weight: 1
  minimumLifetime: 2m
  maximumLifetime: 5m
  minimumDecisionInterval: 5s
  maximumDecisionInterval: 12s
  interactWithDoors: true

- type: entity
  id: NCAmbientInteractivePedestrian
  name: pedestrian
  description: One of Night City's countless temporary passers-by.
  parent: MobHuman
  components:
  - type: InputMover
  - type: MobMover
  - type: RandomHumanoidAppearance
  - type: NpcFactionMember
    factions:
    - NanoTrasen
