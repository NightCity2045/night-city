- type: ncNcpdUseOfForcePolicy
  id: NCDefaultNcpdUseOfForce
  verbalOrderThreat: 50
  restraintThreat: 150
  nonLethalThreat: 350
  lethalThreat: 800
  stopForceOnSurrender: true
  stopForceOnIncapacitation: true

- type: ncNcpdDutyPolicy
  id: NCDefaultNcpdDutyPolicy
  stationZone: a9c069f8-8558-493c-844b-b7bfe8775521
  preferredPatrolSize: 2
  maximumPatrolSize: 4
  reserveActors: 2
  maximumTransitionsPerEvent: 32
  requiredAnchors: [Muster, Dispatch, PatrolExit, Booking, Holding, Evidence, Armory, ReportDesk]

- type: ncNcpdPatrolPolicy
  id: NCDefaultNcpdPatrolPolicy
  maximumStreetZones: 8
  minimumStreetDwell: 2m
  maximumStreetDwell: 6m
  maximumReplans: 3
  replanBackoff: 5s
  followSpacing: 1.5

- type: ncNcpdDispatchPolicy
  id: NCDefaultNcpdDispatchPolicy
  maximumAssignmentsPerEvaluation: 8
  cadetMaximumSeverity: 300
  inspectorMinimumSeverity: 500
  assignmentTimeout: 2m

- type: ncNcpdDetentionPolicy
  id: NCDefaultNcpdDetentionPolicy
  requirePoliceBasis: true
  requireRestraintsForEscort: true
  confiscateDangerousWeapons: true
  bookingTimeout: 5m

- type: ncNcpdInvestigationPolicy
  id: NCDefaultNcpdInvestigationPolicy
  maximumEvidencePerIncident: 128
  maximumWitnessesPerIncident: 64
  unresolvedCaseRetention: 24h

- type: ncNcpdCommandPolicy
  id: NCDefaultNcpdCommandPolicy
  maximumActiveCommands: 64
  retainedHistory: 100
  maximumVisibleZones: 512
  maximumReasonLength: 512

- type: ncNcpdCommandAuthority
  id: NCNcpdChiefCommandAuthority
  job: NCPDChief
  allowedCommands: [PatrolZone, CoverZone, HoldZone, RespondToIncident, SearchZone, InvestigateZone, ReturnToStation, StandDown]
  allowedZoneSlots: [District, Sector, Street, Building]
  maximumPriority: 1000
  canCommandAllUnits: true
  canCommandEqualRank: true
  canCancelOthers: true

- type: ncNcpdCommandAuthority
  id: NCNcpdCommanderCommandAuthority
  job: NCPDCommander
  allowedCommands: [PatrolZone, CoverZone, HoldZone, RespondToIncident, SearchZone, InvestigateZone, ReturnToStation, StandDown]
  allowedZoneSlots: [District, Sector, Street, Building]
  maximumPriority: 1000
  canCommandAllUnits: true
  canCommandEqualRank: true
  canCancelOthers: true

- type: ncNcpdCommandAuthority
  id: NCNcpdLieutenantCommandAuthority
  job: NCPDLieutenant
  allowedCommands: [PatrolZone, CoverZone, HoldZone, RespondToIncident, SearchZone, InvestigateZone, ReturnToStation, StandDown]
  allowedZoneSlots: [District, Sector, Street, Building]
  maximumPriority: 900
  canCommandAllUnits: true
  canCommandEqualRank: true
  canCancelOthers: true

- type: ncNcpdCommandAuthority
