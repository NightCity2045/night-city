# Mapper-facing station anchors. Stable keys are intentionally explicit on each placed instance.
- type: entity
  abstract: true
  id: NCNcpdWorkAnchorBase
  parent: MarkerBase
  name: NCPD work anchor
  suffix: NC, NCPD, Mapping
  components:
  - type: Sprite
    layers:
    - state: pink

- type: entity
  id: NCNcpdMusterAnchor
  parent: NCNcpdWorkAnchorBase
  name: NCPD muster anchor
  components:
  - type: NCNcpdWorkAnchor
    stableKey: ncpd-glen-muster
    kind: Muster

