  lifetime: 720h

- type: ncRumorTopic
  id: NCRumorBetrayal
  stableKey: betrayal
  defaultConfidence: 900
  defaultPrivacy: Secret
  lifetime: 0s
  critical: true

- type: ncRumorTopic
  id: NCRumorContractOutcome
  stableKey: contract-outcome
  defaultConfidence: 900
  defaultPrivacy: Restricted
  lifetime: 0s
  critical: true

