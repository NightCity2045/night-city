- type: ncRumorPolicy
  id: Default
  maximumKnowledgePerOwner: 128
  targetKnowledgeAfterPrune: 96
  maximumSourceEvents: 8
  maximumQueryCount: 32
  maximumHopCount: 8
  confidenceRetentionPermille: 850
  distortionPerHop: 100
  minimumPropagationConfidence: 100

- type: ncRumorTopic
