# Narrative Actors are rare authored people. These policies grant freedom to propose intentions, never authority
# to mutate the world; every proposal still passes through the server capability and action allowlists.
- type: ncNeuralAutonomyPolicy
  id: NCProfessionalActorAutonomy
  stableKey: professional-actor
  allowedKinds: [SocialCognition, StrategicDecision, DialogueContinuation, MemorySummary]
  minimumIntentConfidence: 450
  maximumIntentPriority: 850
  targetedIntentsAllowed: true

- type: ncNeuralAutonomyPolicy
  id: NCFactionActorAutonomy
  stableKey: faction-actor
  allowedKinds: [SocialCognition, StrategicDecision, DialogueContinuation, MemorySummary]
  minimumIntentConfidence: 400
  maximumIntentPriority: 900
  targetedIntentsAllowed: true

- type: ncNeuralAutonomyPolicy
  id: NCFixerActorAutonomy
  stableKey: fixer-actor
  allowedKinds: [SocialCognition, StrategicDecision, DialogueContinuation, MemorySummary, NarrativeRender]
  minimumIntentConfidence: 350
  maximumIntentPriority: 900
  targetedIntentsAllowed: true

