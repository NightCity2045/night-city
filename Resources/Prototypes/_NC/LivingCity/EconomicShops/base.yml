# Catalog parents keep the large retail assortment data-driven without repeating economy policy fields.

- type: ncEconomicShopCatalog
  id: NCShopCatalogGun

- type: ncEconomicShopCatalog
  id: NCShopCatalogClothing

- type: ncEconomicShopCatalog
  id: NCShopCatalogFurniture

- type: ncEconomicShopCatalog
  id: NCShopCatalogConstruction

- type: ncEconomicShopCatalog
  id: NCShopCatalogPharmacy

- type: ncEconomicShopCatalog
  id: NCShopCatalogAuto

# Add a product by inheriting the matching base below. Keep its entity, basePrice and any
# shopInitialQuantity override in the same block; the storefront discovers it automatically.

- type: ncItemDefinition
  abstract: true
  id: NCShopWeaponDefinitionBase
  domain: WeaponAssembly
  defaultCondition: 1000
  legalStatus: Restricted
  serialRequired: true
  shopCatalog: NCShopCatalogGun
  shopInitialQuantity: 8
  catalogCategory: nc-economic-shop-category-weapons
  catalogDescription: nc-economic-shop-description-generic

- type: ncItemDefinition
  abstract: true
  id: NCShopAmmoDefinitionBase
  domain: WeaponAssembly
  defaultCondition: 1000
  legalStatus: Restricted
  shopCatalog: NCShopCatalogGun
  shopInitialQuantity: 8
  catalogCategory: nc-economic-shop-category-ammunition
  catalogDescription: nc-economic-shop-description-pistol-magazine

- type: ncItemDefinition
