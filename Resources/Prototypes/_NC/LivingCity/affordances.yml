- type: ncCityZoneAffordanceSource
  id: NCStreetPatrolAffordances
  requiredContext: Street
  candidateProfile: NCPedestrianSpawnCandidates
  affordances: [NCStreetPatrolArea]
  maximumCandidates: 512

- type: ncCityZoneAffordanceSource
  id: NCCityBuildingAffordances
  requiredContext: Building
  candidateProfile: NCPedestrianSpawnCandidates
  # A navigation sample is only the safe fallback. Real Room/Portal boundaries own entrances and exits.
  affordances: [NCCityRestArea]
  boundaryAffordances: [NCCityPublicEntrance, NCCityBuildingExit]
  maximumCandidates: 1024

- type: ncCityZoneAffordanceSource
  id: NCCityApartmentAffordances
  requiredContext: Apartment
  candidateProfile: NCPedestrianSpawnCandidates
  affordances: [NCCityResidence, NCCityRestArea]
  maximumCandidates: 2048

- type: ncCityZoneAffordanceSource
  id: NCNcpdStationAffordances
  zone: a9c069f8-8558-493c-844b-b7bfe8775521
  requiredContext: Building
  candidateProfile: NCPedestrianSpawnCandidates
  affordances: [NCCityWorkplace, NCNcpdMuster, NCNcpdDispatch, NCNcpdBooking, NCNcpdHolding, NCNcpdEvidenceStorage, NCNcpdArmory, NCNcpdReportDesk]
  maximumCandidates: 16

