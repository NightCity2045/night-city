- type: ncMemoryPolicy
  id: Default
  maximumEpisodesPerOwner: 256
  targetEpisodesAfterConsolidation: 192
  maximumSummariesPerOwner: 64
  maximumSourceMemoriesPerSummary: 32
  maximumSourceEventsPerEpisode: 8
  maximumSourceEventsPerSummary: 256
  maximumParticipantsPerEpisode: 16
  maximumParticipantsPerSummary: 64
  maximumEmotionalTagsPerEpisode: 8
  maximumEmotionalTagsPerSummary: 32
  minimumConsolidationGroupSize: 2
  summaryLifetime: 2160h
  maximumQueryCount: 50
  participantMatchBonus: 2000
  eventTypeMatchBonus: 1500
  emotionalTagMatchBonus: 1000
  salienceWeight: 4
  confidenceWeight: 2
  recentMemoryBonus: 1000
  recentMemoryWindow: 6h

- type: ncMemoryEmotion
  id: MemoryEmotionFear
  stableKey: fear

- type: ncMemoryEmotion
  id: MemoryEmotionAnger
  stableKey: anger

- type: ncMemoryEmotion
  id: MemoryEmotionGratitude
  stableKey: gratitude

- type: ncMemoryEmotion
  id: MemoryEmotionGrief
  stableKey: grief

- type: ncMemoryEmotion
  id: MemoryEmotionShame
  stableKey: shame

- type: ncMemoryRetention
  id: MemoryRetentionTransient
  stableKey: transient
  class: Transient
  lifetime: 6h
  canConsolidate: false

- type: ncMemoryRetention
  id: MemoryRetentionStandard
  stableKey: standard
  class: Standard
  lifetime: 72h
  canConsolidate: true

- type: ncMemoryRetention
  id: MemoryRetentionDurable
  stableKey: durable
  class: Durable
  lifetime: 720h
  canConsolidate: true

- type: ncMemoryRetention
  id: MemoryRetentionPermanent
  stableKey: permanent
  class: Permanent
  lifetime: 0s
  canConsolidate: false

- type: ncMemoryEvent
  id: MemoryRoutineInteraction
  stableKey: routine-interaction
  consolidationKey: routine-social
  retention: MemoryRetentionStandard
  defaultSalience: 200
  defaultConfidence: 900
  defaultPrivacy: Personal

- type: ncMemoryEvent
  id: MemoryDirectiveAccepted
  stableKey: directive-accepted
  consolidationKey: accepted-directives
  retention: MemoryRetentionDurable
  defaultSalience: 700
  defaultConfidence: 1000
  defaultPrivacy: Restricted

- type: ncMemoryEvent
  id: MemoryAssistanceReceived
  stableKey: assistance-received
  consolidationKey: social-assistance
  retention: MemoryRetentionDurable
  emotionalTags:
  - MemoryEmotionGratitude
  defaultSalience: 650
  defaultConfidence: 1000
  defaultPrivacy: Personal

- type: ncMemoryEvent
  id: MemoryViolenceWitnessed
  stableKey: violence-witnessed
  consolidationKey: witnessed-violence
  retention: MemoryRetentionDurable
  emotionalTags:
  - MemoryEmotionFear
  defaultSalience: 800
  defaultConfidence: 950
  defaultPrivacy: Restricted

- type: ncMemoryEvent
  id: MemoryBetrayal
  stableKey: betrayal
  consolidationKey: betrayal
  retention: MemoryRetentionPermanent
  emotionalTags:
  - MemoryEmotionAnger
  defaultSalience: 1000
  defaultConfidence: 1000
  defaultPrivacy: Secret
  critical: true

- type: ncMemoryEvent
  id: MemoryContractOutcome
  stableKey: contract-outcome
  consolidationKey: contract-outcome
  retention: MemoryRetentionPermanent
  defaultSalience: 900
  defaultConfidence: 1000
  defaultPrivacy: Restricted
  critical: true

- type: ncMemoryEvent
  id: MemoryIncidentOutcome
  stableKey: incident-outcome
  consolidationKey: incident-outcome
  retention: MemoryRetentionDurable
  defaultSalience: 700
  defaultConfidence: 1000
  defaultPrivacy: Restricted

- type: ncMemoryEvent
  id: MemoryDeathWitnessed
  stableKey: death-witnessed
  consolidationKey: death-witnessed
  retention: MemoryRetentionPermanent
  emotionalTags:
  - MemoryEmotionGrief
  - MemoryEmotionFear
  defaultSalience: 1000
  defaultConfidence: 1000
  defaultPrivacy: Restricted
  critical: true

- type: ncMemoryEvent
  id: MemoryObligationCreated
  stableKey: obligation-created
  consolidationKey: social-obligation
  retention: MemoryRetentionPermanent
  defaultSalience: 800
  defaultConfidence: 1000
  defaultPrivacy: Restricted
  critical: true

- type: ncMemoryEvent
  id: MemoryObligationFulfilled
  stableKey: obligation-fulfilled
  consolidationKey: social-obligation
  retention: MemoryRetentionPermanent
  emotionalTags: [MemoryEmotionGratitude]
  defaultSalience: 850
  defaultConfidence: 1000
  defaultPrivacy: Restricted
  critical: true
