# Every physical resident retains only safe reflex procedures. GPT supplies individual intentions through the typed
# command executor; HTN handles combat and idle execution rather than acting as a second normal brain.
- type: htnCompound
  id: NCLivingHumanCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: RangedCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: MeleeCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound
