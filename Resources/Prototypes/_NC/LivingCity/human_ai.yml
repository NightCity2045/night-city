# Every physical Living City human starts from this root. The compounds below are reusable physical abilities;
# employment, personality, BDI and Neural cognition choose goals without replacing the actor's base brain.
- type: ncHumanDirectivePolicy
  id: NCDefaultHumanDirectivePolicy
  defaultDuration: 4h
  maximumPriority: 900
  maximumOrderLength: 128
  allowEqualRank: false
  applyToCurrentGroup: true
  factionRoleRanks:
    leader: 100
    organizer: 80
    custodian: 60
    operative: 60
    lookout: 40
    member: 30
    scavenger: 30
    performer: 30
    contractor: 25
    resident: 20
    associate: 15
    contact: 5

- type: htnCompound
  id: NCLivingHumanCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: RangedCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: MeleeCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound
