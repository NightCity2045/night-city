  scarcityWeightBasisPoints: 4000
  demandWeightBasisPoints: 2500
  dangerWeightBasisPoints: 1500
  relationshipWeightBasisPoints: -2000
  legalityWeightBasisPoints: 2000
  urgencyWeightBasisPoints: 2000
  feeBasisPoints: 0
  taxBasisPoints: 0
  feeReceiverServiceId: ""
  taxReceiverServiceId: ""
  maximumQuoteTotal: 1000000000

