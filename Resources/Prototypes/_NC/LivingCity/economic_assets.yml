- type: ncEconomicAssetPolicy
  id: Default
  maximumBatchesPerStockNode: 512
  maximumItemsPerStockNode: 512
  maximumSourceEvents: 16
  maximumStableKeyLength: 128
  maximumSerialLength: 128
  maximumQueryCount: 100

- type: ncEconomicPricingPolicy
  id: Default
  currencyId: eb
  maximumQuoteLifetime: 10m
  maximumReservationLifetime: 5m
  minimumMultiplierBasisPoints: 2500
  maximumMultiplierBasisPoints: 40000
  scarcityWeightBasisPoints: 4000
  demandWeightBasisPoints: 2500
  dangerWeightBasisPoints: 1500
  relationshipWeightBasisPoints: -2000
  legalityWeightBasisPoints: 2000
  urgencyWeightBasisPoints: 2000
  feeBasisPoints: 0
  taxBasisPoints: 0
  feeReceiverServiceId: ""
  taxReceiverServiceId: ""
  maximumQuoteTotal: 1000000000

