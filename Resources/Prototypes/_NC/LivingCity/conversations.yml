- type: ncConversationPolicy
  id: Default
  maximumActiveSessions: 512
  maximumRecentSessions: 256
  maximumSessionsPerParticipant: 4
  maximumParticipants: 16
  maximumTopics: 16
  maximumRelevantFacts: 32
  maximumTurns: 64
  idleTimeout: 3m
  maximumLifetime: 30m
  expirySweepInterval: 1s

