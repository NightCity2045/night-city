# One physical body prototype for the initial Living City population. Residents have no authored profession,
# organization, home, work location, or abstract population slot.
- type: entity
  id: NCLivingCityCivilian
  name: city resident
  description: A resident trying to make it through another day in Night City.
  parent: MobHuman
  components:
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: NCLivingHumanCompound
    planCooldown: 1
    blackboard:
      IdleRange: !type:Single
        4
      MinimumIdleTime: !type:Single
        3
      MaximumIdleTime: !type:Single
        8
  - type: Loadout
    prototypes: [LimitedPassengerGear]
  - type: NpcFactionMember
    factions: [Passive]
  - type: FactionException
  - type: NCNeuralConversationTarget
    maximumUtteranceLength: 2048
    initiateAmbientConversations: true
    # The active world runs twelve times faster than wall time: roughly one attempt every 10-20 real minutes.
    minimumAmbientConversationInterval: 2h
    maximumAmbientConversationInterval: 4h

- type: ncCityActorArchetype
  id: NCLivingCityResident
  entityPrototype: NCLivingCityCivilian
  spawnCandidateProfile: NCPedestrianSpawnCandidates
  travelMode: Pedestrian

- type: ncRandomResidentGenerationProfile
  id: NCDefaultRandomResidentGeneration
  archetype: NCLivingCityResident
  species: Human
  personas:
  - NCResidentPersonaCautious
  - NCResidentPersonaHardboiled
  - NCResidentPersonaCompassionate
  - NCResidentPersonaRestless
  - NCResidentPersonaProud
  - NCResidentPersonaPragmatic
