# This allocation keeps most Glen residents abstract while using mapper-authored apartments for a visible minority.
- type: ncCityResidenceAllocationPolicy
  id: NCDefaultResidenceAllocationPolicy
  snapshotPageSize: 250
  maximumActorsPerRun: 20000
  maximumConcurrentMutations: 8
  physicalResidentsPerApartment: 2
  # Most residents remain coordinate-free; mapped apartments are reserved for a visible minority.
  physicalResidentShare: 0.25

