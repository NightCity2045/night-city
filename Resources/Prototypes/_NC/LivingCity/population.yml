# One physical body prototype for the initial Living City population. Residents have no authored profession,
# organization, home, work location, or abstract population slot.
- type: entity
  id: NCLivingCityCivilian
  name: city resident
  description: A resident trying to make it through another day in Night City.
  parent: MobHuman
  components:
  - type: InputMover
  - type: MobMover
  - type: HTN
    # GPT owns ordinary intent selection. HTN is enabled only as a bounded combat/reflex executor.
    enabled: false
    rootTask:
      task: NCLivingHumanCompound
    planCooldown: 1
    blackboard:
      IdleRange: !type:Single
        4
      MinimumIdleTime: !type:Single
        3
      MaximumIdleTime: !type:Single
        8
  - type: Loadout
    prototypes: [LimitedPassengerGear]
  - type: NpcFactionMember
    factions: [Passive]
  - type: FactionException
  - type: NCNeuralConversationTarget
    maximumUtteranceLength: 2048
    maximumNpcConversationTurns: 16

- type: ncCityActorArchetype
  id: NCLivingCityResident
  entityPrototype: NCLivingCityCivilian
  spawnCandidateProfile: NCPedestrianSpawnCandidates
  travelMode: Pedestrian

- type: ncRandomResidentGenerationProfile
  id: NCDefaultRandomResidentGeneration
  archetype: NCLivingCityResident
  species: Human
  personas:
  - NCResidentPersonaCautious
  - NCResidentPersonaHardboiled
  - NCResidentPersonaCompassionate
  - NCResidentPersonaRestless
  - NCResidentPersonaProud
  - NCResidentPersonaPragmatic
  backgroundKeys:
  - raised-by-neighbors
  - former-street-vendor
  - displaced-after-fire
  - learned-to-survive-alone
  - supports-distant-family
  - grew-up-around-gangs
  - lost-a-small-business
  - new-to-this-district
  pressureKeys:
  - short-on-cash
  - owes-a-personal-favor
  - worried-about-someone-close
  - needs-stable-work
  - hiding-a-recent-mistake
  - trying-to-rebuild-reputation
  - exhausted-and-overworked
  - looking-for-a-safe-place
  fearKeys:
  - abandonment
  - public-humiliation
  - police-attention
  - helplessness
  - betrayal
  - losing-control
  - debt-collectors
  - being-trapped
  goalKeys:
  - earn-enough-to-feel-secure
  - protect-someone-close
  - make-a-useful-connection
  - find-steady-work
  - regain-respect
  - leave-a-bad-situation
  - learn-who-can-be-trusted
  - get-through-today-unhurt
  socialHabitKeys:
  - watches-before-speaking
  - helps-before-asking-payment
  - trades-favors
