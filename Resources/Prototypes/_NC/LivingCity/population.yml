# Persistent Living City actors deliberately do not receive the station's NanoTrasen NPC faction.
- type: entity
  id: NCLivingCityCivilian
  name: city resident
  description: A resident trying to make it through another day in Night City.
  parent: MobHuman
  components:
  - type: InputMover
  - type: MobMover
  - type: RandomHumanoidAppearance
  - type: Loadout
    prototypes: [LimitedPassengerGear]
  - type: NpcFactionMember
    factions: [Passive]

- type: ncCityActorArchetype
  id: NCLivingCityUtilityResident
  entityPrototype: NCLivingCityCivilian
  spawnCandidateProfile: NCPedestrianSpawnCandidates
  travelMode: Pedestrian
  cognitionTier: Utility
  allowedHomeContexts: [District, Sector, Street, Building, Apartment]
  allowedWorkContexts: [District, Sector, Street, Building, Apartment, MissionSlot]
  routineProfile: NCDefaultCivilianRoutine

- type: ncCityActorArchetype
