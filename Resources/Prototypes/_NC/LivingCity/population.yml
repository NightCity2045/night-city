  allowedHomeContexts: [District, Sector, Street, Building, Apartment]
  allowedWorkContexts: [District, Sector, Street, Building, Apartment, MissionSlot]
  routineProfile: NCDefaultCivilianRoutine

- type: ncCityActorArchetype
