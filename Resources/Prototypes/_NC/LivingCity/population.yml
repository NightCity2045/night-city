# This is the single physical foundation for every persistent human NPC. Jobs add capabilities and equipment;
# they do not replace this HTN root with profession-specific brains.
# Persistent Living City actors deliberately do not receive the station's NanoTrasen NPC faction.
- type: entity
  id: NCLivingCityCivilian
  name: city resident
  description: A resident trying to make it through another day in Night City.
  parent: MobHuman
  components:
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: NCLivingHumanCompound
    planCooldown: 1
    blackboard:
      IdleRange: !type:Single
        4
      MinimumIdleTime: !type:Single
        3
      MaximumIdleTime: !type:Single
        8
  - type: RandomHumanoidAppearance
  - type: Loadout
    prototypes: [LimitedPassengerGear]
  - type: NpcFactionMember
    factions: [Passive]
  - type: FactionException
  - type: NPCRetaliation
    attackMemoryLength: 30s
  - type: NCNeuralConversationTarget
    maximumUtteranceLength: 2048

- type: ncCityActorArchetype
  id: NCLivingCityUtilityResident
  entityPrototype: NCLivingCityCivilian
  spawnCandidateProfile: NCPedestrianSpawnCandidates
