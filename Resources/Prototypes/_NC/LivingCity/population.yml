# Coordinate-free housing profiles. They describe persistent social/economic circumstances only and never map to a
# room, marker, entity, or mapper-authored apartment.
- type: ncAbstractResidenceProfile
  id: NCSquatResidence
  kind: Squat
  quality: Precarious
  weeklyCost: 0
  selectionWeight: 15

- type: ncAbstractResidenceProfile
  id: NCCubeResidence
  kind: Cube
  quality: Basic
  weeklyCost: 200
  selectionWeight: 35

- type: ncAbstractResidenceProfile
  id: NCSharedApartmentResidence
  kind: SharedApartment
  quality: Basic
  weeklyCost: 350
  selectionWeight: 35

- type: ncAbstractResidenceProfile
  id: NCRentedApartmentResidence
  kind: Apartment
  quality: Standard
  weeklyCost: 600
  selectionWeight: 15

# Canonical initialization and legacy migration policy. All homes remain coordinate-free.
- type: ncCityResidenceAllocationPolicy
  id: NCDefaultResidenceAllocationPolicy
  snapshotPageSize: 250
  maximumActorsPerRun: 20000
  maximumConcurrentMutations: 8
  residenceProfiles:
  - NCSquatResidence
  - NCCubeResidence
  - NCSharedApartmentResidence
  - NCRentedApartmentResidence
  storageRetryCount: 3
  storageRetryDelay: 1s

