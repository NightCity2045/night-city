    dependsOn: [wanted-after-restraint]
  - id: seize-dangerous-items
    action: ncpd-seize-dangerous-items
    dependsOn: [search-restrained]
  - id: interview-witnesses
    action: ncpd-interview-witnesses
    dependsOn: [seize-dangerous-items]
