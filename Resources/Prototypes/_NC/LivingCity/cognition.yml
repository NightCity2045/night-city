  - id: await-compliance
    action: ncpd-await-compliance
    dependsOn: [issue-order]
  - id: pursue
    action: ncpd-pursue-suspect
    dependsOn: [report-incident, await-compliance]
  - id: wanted-after-pursuit
    action: ncpd-create-wanted-record
