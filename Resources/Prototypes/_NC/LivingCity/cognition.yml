# Closed execution inventory. These entries point at existing ECS/vanilla authorities; they contain no gameplay
# formulas and do not implement a second item, combat, movement or medical system.

- type: ncHumanAction
  id: yield-to-combat-authority
  executor: VanillaCombat
  operation: CombatAuthority
  targetKind: Person
  completion: AuthorityReleased
  timeout: 2m
  requiresPhysicalEntity: true
  interrupts: [PlanChanged, EntityUnbound, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-approach-person
  executor: VanillaMovement
  operation: ApproachTarget
  targetKind: Person
  completion: RangeConfirmed
  timeout: 1m
  requiresPhysicalEntity: true
  maximumRange: 40
  completionRange: 2
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

# Physical actions available to validated GPT command procedures.

- type: ncHumanAction
  id: human-follow-person
  executor: VanillaMovement
  operation: FollowTarget
  targetKind: Person
  completion: RangeConfirmed
  timeout: 30m
  requiresPhysicalEntity: true
  maximumRange: 40
  completionRange: 2
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-hold-position
  executor: VanillaMovement
  operation: HoldPosition
  targetKind: None
  completion: AuthorityReleased
  timeout: 4h
  requiresPhysicalEntity: true
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-patrol-zone
  executor: VanillaMovement
  operation: PatrolZone
  targetKind: Zone
  completion: AuthorityReleased
  timeout: 4h
  requiresPhysicalEntity: true
  completionRange: 1.25
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-flee-from-threat
  executor: VanillaMovement
  operation: FleeFromTarget
  targetKind: Person
  completion: RangeConfirmed
  timeout: 1m
  requiresPhysicalEntity: true
  maximumRange: 40
  completionRange: 12
  steeringRefreshInterval: 1s
  steeringRetargetDistance: 2
  interrupts: [PlanChanged, EntityUnbound, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-activate-target
  executor: VanillaInteraction
  operation: ActivateTarget
  targetKind: Entity
  completion: InteractionConfirmed
  timeout: 10s
  requiresPhysicalEntity: true
  maximumRange: 2
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-alt-interact-target
  executor: VanillaInteraction
  operation: AltInteractTarget
  targetKind: Entity
  completion: InteractionConfirmed
  timeout: 10s
  requiresPhysicalEntity: true
  maximumRange: 2
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-pickup-item
  executor: VanillaHands
  operation: PickupTarget
  targetKind: Item
  completion: WorldStateChanged
  timeout: 10s
  requiresPhysicalEntity: true
  maximumRange: 2
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-drop-item
  executor: VanillaHands
  operation: DropTarget
  targetKind: Item
  completion: WorldStateChanged
  timeout: 10s
  requiresPhysicalEntity: true
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-equip-item
  executor: VanillaHands
  operation: EquipTarget
  targetKind: Item
  completion: WorldStateChanged
  timeout: 30s
  requiresPhysicalEntity: true
  maximumRange: 2
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-unequip-item
  executor: VanillaHands
  operation: UnequipTarget
  targetKind: Item
  completion: WorldStateChanged
  timeout: 30s
  requiresPhysicalEntity: true
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-use-held-item
  executor: VanillaHands
  operation: UseHeldTarget
  targetKind: Item
  completion: InteractionConfirmed
  timeout: 10s
  requiresPhysicalEntity: true
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-speak-acknowledgement
  executor: VanillaSpeech
  operation: Speak
  targetKind: None
  completion: InteractionConfirmed
  timeout: 10s
  requiresPhysicalEntity: true
  speechLocId: nc-human-action-speak-acknowledgement
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-start-pulling
  executor: VanillaInteraction
  operation: StartPullingTarget
  targetKind: Person
  completion: WorldStateChanged
  timeout: 15s
  requiresPhysicalEntity: true
  maximumRange: 2
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

- type: ncHumanAction
  id: human-stop-pulling
  executor: VanillaInteraction
  operation: StopPulling
  targetKind: None
  completion: WorldStateChanged
  timeout: 10s
  requiresPhysicalEntity: true
  interrupts: [PlanChanged, EntityUnbound, Combat, Incapacitated, Detained, RoundEnded]

- type: ncCognitionCapability
  id: NCCognitionRespondToThreat
  domain: Safety
  taskKind: ImmediateReaction
  procedureSteps:
  - id: flee-danger
    action: human-flee-from-threat

- type: ncCognitionCapability
  id: NCCognitionDefendAgainstThreat
  domain: Safety
  taskKind: ImmediateReaction
  procedureSteps:
  - id: yield-combat
    action: yield-to-combat-authority

- type: ncCognitionCapability
  id: NCCognitionApproachPerson
  domain: Social
  taskKind: SocialConversation
  procedureSteps:
  - id: approach-person
    action: human-approach-person

- type: ncCognitionCapability
  id: NCCognitionFollowPerson
  domain: Social
  taskKind: KnownProcedure
  procedureSteps:
  - id: follow-person
    action: human-follow-person

- type: ncCognitionCapabilityProfile
  id: NCDefaultCivilianCapabilities
  capabilities:
  - NCCognitionRespondToThreat
  - NCCognitionDefendAgainstThreat
  - NCCognitionApproachPerson
  - NCCognitionFollowPerson
