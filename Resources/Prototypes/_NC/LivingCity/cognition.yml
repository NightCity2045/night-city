  - id: book-detainee
    action: ncpd-book-detainee
    dependsOn: [deliver-booking]
  - id: place-holding
    action: ncpd-place-in-holding
    dependsOn: [book-detainee]
  - id: deliver-evidence
    action: ncpd-deliver-evidence-storage
    dependsOn: [place-holding]
  - id: submit-evidence
    action: ncpd-submit-evidence
    dependsOn: [deliver-evidence]

