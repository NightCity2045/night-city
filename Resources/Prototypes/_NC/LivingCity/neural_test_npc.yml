  name: neural NCPD API test officer
  description: A command-only patrol officer used to verify the Neural Cognition Service.
  parent: NCLivingCityCivilian
  components:
  - type: Loadout
    prototypes: []
  - type: NCNeuralConversationTarget
    interactionRange: 2.5
    maximumUtteranceLength: 512
