- type: ncFixerPolicy
  id: Default
  maximumContacts: 512
  maximumDealLegs: 16
  maximumEvidence: 32
  maximumActiveDealsPerNetwork: 256
  quoteLifetime: 15m
  reservationLifetime: 10m
  defaultExecutionDuration: 12h
  maximumExecutionDuration: 168h
  maximumBrokerFeeBasisPoints: 2500
  maximumRiskBasisPoints: 10000
  dealBoardBrokerFeeBasisPoints: 500
  dealBoardListingLifetime: 168h
  dealBoardServiceOffers:
  - NCEconomicServiceMedicalAftercare
  - NCEconomicServicePropertyRepair
  maximumLifecycleAdvancesPerTick: 8
  successRelationshipEffectId: KeptPromise
  breachRelationshipEffectId: BrokePromise
  successReputationEffectId: ReputationReliableAction
  breachReputationEffectId: ReputationBetrayal
  reputationDomainId: GeneralProfessional

- type: ncNightMarketPolicy
  id: Default
  maximumVendors: 64
  minimumAssemblyLead: 10m
  maximumDuration: 8h
  maximumIncidents: 64
  allowedVenueAffordances: [Shop, Warehouse]
  attendancePriority: 700
  automaticSchedulingEnabled: true
  automaticOpenDelay: 1h
  automaticDuration: 4h
  automaticVendorItems:
  - NCItemWeaponBudgetPistolMk1
  - NCItemCyberwareNeuralLinkMk1

- type: entity
  id: NCFixerDeadDrop
  name: dead drop
  description: A concealed handoff point whose access is controlled by a persistent fixer deal.
  components:
  - type: Transform
  - type: MetaData
  - type: NCFixerHandoff

- type: entity
  id: NCNightMarketVenueController
  name: night market venue controller
  description: Round-local controller for a persistent Night Market event.
  components:
  - type: Transform
  - type: MetaData
  - type: NCNightMarketVenue

- type: entity
  parent: NCComputerEconomicShopBase
  id: NCNightMarketVendorStall
  name: night market stall
  components:
  - type: NCNightMarketVendorStall
  - type: NCEconomicShop
    shopId: night-market-runtime-stall
    displayName: nc-economic-shop-night-market-stall
    sellerOrganizationId: night-market-runtime
    semanticLocationKey: city.night-market.runtime-stall
    externalStock: true
