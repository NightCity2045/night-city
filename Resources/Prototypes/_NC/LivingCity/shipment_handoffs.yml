# The mapper places only the endpoint. Its district/building/floor identity comes from city_zone.yml at runtime.
- type: entity
  parent: LockerSteel
  id: NCShipmentParcelLocker
  name: CitiNet parcel locker
  description: A hardened last-mile locker registered in the Living City logistics network.
  components:
  - type: NCShipmentHandoffPoint
    stableKey: city.parcel-locker
    handoffKind: ParcelLocker
    maximumActiveParcels: 8

- type: entity
  parent: CrateGenericSteel
  id: NCShipmentWarehouseHandoff
  name: logistics intake point
  description: A mapped warehouse handoff point for persistent shipments.
  components:
  - type: NCShipmentHandoffPoint
    stableKey: city.warehouse-handoff
    handoffKind: Warehouse
    maximumActiveParcels: 16

- type: entity
  parent: CrateGenericSteel
  id: NCShipmentCargoParcel
  name: sealed shipment cargo
  description: A physical projection of a persistent, audited shipment manifest.
  components:
  - type: NCShipmentCargo
