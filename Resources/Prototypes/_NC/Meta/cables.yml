# Data cable laid tile by tile under the floor, like the vanilla power wires. The coil is the material cost; every laid
# piece spends one unit. Ports attach to the pieces on their own tile or on a neighbouring tile.
- type: stack
  parent: BaseMediumStack
  id: NCMetaDataCable
  name: stack-nc-meta-data-cable
  icon: { sprite: "/Textures/Objects/Tools/cable-coils.rsi", state: coil-30 }
  spawn: NCMetaDataCableStack1

- type: entity
  parent: CableStack
  id: NCMetaDataCableStack
  name: META data cable coil
  suffix: Full
  description: A coil of data cable. Pry up a floor tile and lay it under the floor to link META devices.
  components:
  - type: Stack
    stackType: NCMetaDataCable
    baseLayer: base
    layerStates:
    - coil-10
    - coil-20
    - coil-30
  - type: Sprite
    state: coil-30
    color: DeepSkyBlue
    layers:
    - state: coil-30
      map: ["base"]
  - type: Item
    heldPrefix: coillv
  - type: CablePlacer
    cablePrototypeID: NCMetaDataCable
    blockingWireType: NCData

- type: entity
  parent: NCMetaDataCableStack
  id: NCMetaDataCableStack10
  suffix: 10
  components:
  - type: Sprite
    state: coil-10
  - type: Stack
    count: 10

- type: entity
  parent: NCMetaDataCableStack
  id: NCMetaDataCableStack1
  suffix: 1
  components:
  - type: Sprite
    state: coil-10
  - type: Stack
    count: 1

- type: entity
  parent: CablePhysBase
  id: NCMetaDataCable
  name: META data cable
  description: A data cable laid under the floor. Cutting it breaks every link that runs through it.
  components:
  - type: Sprite
    sprite: Structures/Power/Cables/lv_cable.rsi
    state: lvcable_0
    color: DeepSkyBlue
    drawdepth: ThinWire
    visible: false
  - type: Icon
    sprite: Structures/Power/Cables/lv_cable.rsi
    state: lvcable_4
  - type: SubFloorHide
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Cable
    cableDroppedOnCutPrototype: NCMetaDataCableStack1
    cableType: NCData
  - type: NCMetaDataCable
  - type: CableVisualizer
    statePrefix: lvcable_
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          NCMetaDataCableStack1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
