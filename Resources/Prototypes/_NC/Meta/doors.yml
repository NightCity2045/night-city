- type: entity
  parent: Airlock
  id: NCMetaDoor
  components:
  - type: AccessReader
    enabled: false
  - type: NCMetaDoorAccess
  - type: NCMetaDevice
    interfaces: [meta.doors.Door]
    allowClaim: true
    # An approved program may open and close this door without anyone attending it.
    allowServiceControl: true
  - type: NCMetaPort
    networkId: LOCAL
  - type: NCMetaHost
    profile: NCMetaEmbedded
    allowClaim: true
  - type: NCMetaStorage
  - type: NCMetaTerminal
    allowEditor: false
  - type: ItemSlots
    slots:
      nc_meta_chip:
        name: nc-meta-chip-slot
        whitelist:
          tags:
          - NCMetaChip
  - type: UserInterface
    interfaces:
      enum.NCMetaUiKey.Workspace:
        type: NCMetaWorkspaceBoundUserInterface

- type: entity
  parent: BaseWallmountMetallic
  id: NCMetaDoorPanel
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/switch.rsi
    state: dead
  - type: NCMetaDevice
    interfaces: [meta.doors.DoorPanel]
    allowClaim: true
  - type: NCMetaPort
    networkId: LOCAL
  - type: NCMetaDoorPanel
