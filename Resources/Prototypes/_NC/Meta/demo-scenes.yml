- type: ncMetaDemoScene
  id: NCMetaDoorScene
  name: nc-meta-scene-door
  templates: [meta-example-doorpanel, meta-stock-device-control, meta-stock-security-journal, meta-tutorial-threshold, meta-tutorial-hysteresis, meta-tutorial-file, meta-tutorial-panel, meta-tutorial-installation]
  objects:
  - key: host
    prototype: NCMetaTerminal
    offset: 0, 0
  - key: door
    prototype: NCMetaDoor
    offset: 2, 0
  - key: panel
    prototype: NCMetaDoorPanel
    offset: 1, 1
  - key: sensor
    prototype: NCMetaTemperatureSensor
    offset: -1, 0
  - key: heater
    prototype: SpaceHeater
    offset: -2, 0
  - key: wrench
    prototype: Wrench
    offset: -2, -1
  - key: alarm
    prototype: NCMetaAlarm
    offset: 0, 2
  - key: camera
    prototype: NCMetaCamera
    offset: -1, 1
  - key: tool
    prototype: NCMetaCommissioningTool
    offset: -1, -1
  - key: manual
    prototype: NCMetaProgrammingManual
    offset: 1, -1
  - key: vendor
    prototype: NCMetaDevelopmentVendor
    offset: -3, 3
  cables:
  - from: host
    to: door
  - from: host
    to: panel
  - from: host
    to: sensor
  - from: host
    to: alarm
  - from: host
    to: camera

- type: ncMetaDemoScene
