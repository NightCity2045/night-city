- type: entity
  parent: [BaseHandheldComputer, PowerCellSlotMediumItem]
  id: NCMetaServiceTablet
  name: META service tablet
  description: A battery powered host for ready applications, native installation tools and device diagnostics.
  components:
  - type: Sprite
    sprite: Objects/Tools/multitool.rsi
    state: icon
  - type: NCMetaHost
    profile: NCMetaComputer
    allowClaim: true
  - type: NCMetaDevice
    allowClaim: true
  - type: NCMetaTerminal
  - type: NCMetaStorage
    capacityBytes: 67108864
  - type: NCMetaPort
    networkId: LOCAL
  - type: PowerCellDraw
    enabled: true
    drawRate: 1
  - type: UserInterface
    interfaces:
      enum.NCMetaUiKey.Workspace:
        type: NCMetaWorkspaceBoundUserInterface
      enum.NCMetaUiKey.Application:
        type: NCMetaApplicationBoundUserInterface

