- type: entity
  parent: Autolathe
  id: NCMetaFabricator
  suffix: META production controller
  components:
  - type: NCMetaMachine
    fabricator: true
  - type: NCMetaHost
    profile: NCMetaIndustrial
    allowClaim: true
  - type: NCMetaDevice
    allowClaim: true
    interfaces: [meta.industrial.Fabricator, meta.files.FileStore]
  - type: NCMetaTerminal
  - type: NCMetaStorage
    capacityBytes: 33554432
  - type: NCMetaPort
    networkId: LOCAL
  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
      enum.NCMetaUiKey.Workspace:
        type: NCMetaWorkspaceBoundUserInterface

