# Long-acting, low-potency stand-in for the trauma analgesic. It has no dependence of its own and, while it is
# active, suppresses withdrawal and speeds the fade of dependence: a controlled taper.
- type: ncDrugProfile
  id: NCDrugMaintenanceAnalgesic
  category: Analgesic
  maximumConcentration: 30
  removalConcentration: 0.05
  minimumEffectiveConcentration: 1
  therapeuticConcentration: 6
  toxicConcentration: 14
  clearancePerSecond: 0.02
  baselineClearanceFraction: 0.1
  liverClearanceFraction: 0.6
  kidneyClearanceFraction: 0.3
  analgesiaAtTherapeutic: 0.4
  overdoseBurdenPerSecondAtMaximum: 0.8

