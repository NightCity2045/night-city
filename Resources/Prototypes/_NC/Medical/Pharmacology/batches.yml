- type: reagent
  id: NCReactorFumes
  name: nc-reagent-name-reactor-fumes
  group: Toxins
  desc: nc-reagent-desc-reactor-fumes
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#9aa86a"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.5
      effects:
      - !type:NCApplyMedicalDrug
        profile: NCDrugReactorFumes

- type: ncDrugProfile
  id: NCDrugReactorFumes
  category: Toxicant
  maximumConcentration: 25
  removalConcentration: 0.05
  minimumEffectiveConcentration: 0.2
  therapeuticConcentration: 2
  toxicConcentration: 3
  clearancePerSecond: 0.04
  baselineClearanceFraction: 0.4
  liverClearanceFraction: 0.4
  kidneyClearanceFraction: 0.2
  respiratoryTransferMultiplierAtTherapeutic: 0.75
  oxygenationMultiplierAtTherapeutic: 0.9
  overdoseBurdenPerSecondAtMaximum: 2.2

