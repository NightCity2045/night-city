# Two parts of a substrate and one part of ethanol, kept warm, give a broth of the substrate's kind.
- type: reaction
  id: NCPharmaBrewNeuro
  minTemp: 330
  maxTemp: 380
  reactants:
    NCPharmaSubstrateNeuro:
      amount: 2
    Ethanol:
      amount: 1
  products:
    NCPharmaBrothNeuro: 3

- type: reaction
  id: NCPharmaBrewCardio
  minTemp: 330
  maxTemp: 380
  reactants:
    NCPharmaSubstrateCardio:
      amount: 2
    Ethanol:
      amount: 1
  products:
    NCPharmaBrothCardio: 3

- type: reaction
  id: NCPharmaBrewHemato
  minTemp: 330
  maxTemp: 380
  reactants:
    NCPharmaSubstrateHemato:
      amount: 2
    Ethanol:
      amount: 1
  products:
    NCPharmaBrothHemato: 3

- type: reaction
  id: NCPharmaBrewMicrobial
  minTemp: 330
  maxTemp: 380
  reactants:
    NCPharmaSubstrateMicrobial:
      amount: 2
    Ethanol:
      amount: 1
  products:
    NCPharmaBrothMicrobial: 3

- type: reaction
  id: NCPharmaBrewImmune
  minTemp: 330
  maxTemp: 380
  reactants:
    NCPharmaSubstrateImmune:
      amount: 2
    Ethanol:
      amount: 1
  products:
    NCPharmaBrothImmune: 3

# Overheat a broth and it spoils into sludge, which later ends up as contamination in the extract.
- type: reaction
  id: NCPharmaSpoilNeuro
  minTemp: 400
  reactants:
    NCPharmaBrothNeuro:
      amount: 1
  products:
    NCPharmaSludge: 1

- type: reaction
  id: NCPharmaSpoilCardio
  minTemp: 400
  reactants:
    NCPharmaBrothCardio:
      amount: 1
  products:
    NCPharmaSludge: 1

- type: reaction
  id: NCPharmaSpoilHemato
  minTemp: 400
  reactants:
    NCPharmaBrothHemato:
      amount: 1
  products:
    NCPharmaSludge: 1

- type: reaction
  id: NCPharmaSpoilMicrobial
  minTemp: 400
  reactants:
    NCPharmaBrothMicrobial:
      amount: 1
  products:
    NCPharmaSludge: 1

- type: reaction
  id: NCPharmaSpoilImmune
  minTemp: 400
  reactants:
    NCPharmaBrothImmune:
      amount: 1
  products:
    NCPharmaSludge: 1

