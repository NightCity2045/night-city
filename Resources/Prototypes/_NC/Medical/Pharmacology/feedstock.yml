# Raw material comes in kinds. Every compound is made from one main kind and, with a poorer yield, from a few others.
# Players can brew a kind themselves: a typed substrate warmed with ethanol from the chemical dispenser gives a broth of
# that kind, and the extractor turns the broth into a source canister of the same kind.

- type: ncPharmaFeedstock
  id: NCFeedstockNeuro
  name: nc-pharma-feedstock-neuro
  description: nc-pharma-feedstock-neuro-desc
  broth: NCPharmaBrothNeuro
  source: NCPharmaSourceNeuro
  substrate: NCPharmaSubstrateNeuro

- type: ncPharmaFeedstock
  id: NCFeedstockCardio
  name: nc-pharma-feedstock-cardio
  description: nc-pharma-feedstock-cardio-desc
  broth: NCPharmaBrothCardio
  source: NCPharmaSourceCardio
  substrate: NCPharmaSubstrateCardio

- type: ncPharmaFeedstock
  id: NCFeedstockHemato
  name: nc-pharma-feedstock-hemato
  description: nc-pharma-feedstock-hemato-desc
