# Two parts of a substrate and one part of ethanol, kept warm, give a broth of the substrate's kind and a little residue.
- type: reaction
  id: NCPharmaBrewNeuro
  minTemp: 330
  maxTemp: 380
  reactants:
    NCPharmaSubstrateNeuro:
      amount: 2
    Ethanol:
      amount: 1
  products:
    NCPharmaBrothNeuro: 2.7
    NCPharmaImpurity: 0.3

- type: reaction
  id: NCPharmaBrewCardio
  minTemp: 330
  maxTemp: 380
  reactants:
    NCPharmaSubstrateCardio:
      amount: 2
    Ethanol:
      amount: 1
  products:
    NCPharmaBrothCardio: 2.7
    NCPharmaImpurity: 0.3

- type: reaction
  id: NCPharmaBrewHemato
  minTemp: 330
  maxTemp: 380
  reactants:
    NCPharmaSubstrateHemato:
      amount: 2
    Ethanol:
      amount: 1
  products:
    NCPharmaBrothHemato: 2.7
    NCPharmaImpurity: 0.3

- type: reaction
  id: NCPharmaBrewMicrobial
  minTemp: 330
  maxTemp: 380
  reactants:
    NCPharmaSubstrateMicrobial:
      amount: 2
    Ethanol:
      amount: 1
  products:
    NCPharmaBrothMicrobial: 2.7
    NCPharmaImpurity: 0.3

- type: reaction
  id: NCPharmaBrewImmune
  minTemp: 330
  maxTemp: 380
  reactants:
    NCPharmaSubstrateImmune:
      amount: 2
    Ethanol:
      amount: 1
  products:
    NCPharmaBrothImmune: 2.7
    NCPharmaImpurity: 0.3

