# A neutral filler. It dilutes whatever it is mixed into and does nothing else.
- type: reagent
  id: NCPharmaImpurity
  name: reagent-name-nc-pharma-impurity
  group: Biological
  desc: reagent-desc-nc-pharma-impurity
  physicalDesc: reagent-physical-desc-murky
  flavor: bitter
  color: "#6B6F57"

# --- Substrate is made, not found: warm organic matter and one reagent of the kind's own chemistry -----------------

- type: reaction
  id: NCPharmaMakeSubstrateNeuro
  minTemp: 310
  maxTemp: 340
  reactants:
    Protein:
      amount: 2
    Lithium:
      amount: 1
    Phosphorus:
      amount: 1
  products:
    NCPharmaSubstrateNeuro: 4

- type: reaction
  id: NCPharmaMakeSubstrateCardio
  minTemp: 310
  maxTemp: 340
  reactants:
    Blood:
      amount: 2
    Potassium:
      amount: 1
    Sugar:
      amount: 1
  products:
    NCPharmaSubstrateCardio: 4

- type: reaction
  id: NCPharmaMakeSubstrateHemato
  minTemp: 310
  maxTemp: 340
  reactants:
    Blood:
      amount: 2
    Iron:
      amount: 1
    Protein:
      amount: 1
  products:
    NCPharmaSubstrateHemato: 4

- type: reaction
  id: NCPharmaMakeSubstrateMicrobial
  minTemp: 310
  maxTemp: 340
  reactants:
    Nutriment:
      amount: 2
    Sugar:
      amount: 1
    Ammonia:
      amount: 1
  products:
    NCPharmaSubstrateMicrobial: 4

- type: reaction
  id: NCPharmaMakeSubstrateImmune
  minTemp: 310
  maxTemp: 340
  reactants:
    Protein:
      amount: 2
    Nutriment:
      amount: 1
    Sodium:
      amount: 1
  products:
    NCPharmaSubstrateImmune: 4

# Overheat a broth and it spoils into sludge, which later ends up as contamination in the extract.
- type: reaction
  id: NCPharmaSpoilNeuro
  minTemp: 400
  reactants:
    NCPharmaBrothNeuro:
      amount: 1
  products:
    NCPharmaSludge: 1

- type: reaction
  id: NCPharmaSpoilCardio
  minTemp: 400
  reactants:
    NCPharmaBrothCardio:
      amount: 1
  products:
    NCPharmaSludge: 1

- type: reaction
  id: NCPharmaSpoilHemato
  minTemp: 400
  reactants:
    NCPharmaBrothHemato:
      amount: 1
  products:
    NCPharmaSludge: 1

- type: reaction
  id: NCPharmaSpoilMicrobial
  minTemp: 400
  reactants:
    NCPharmaBrothMicrobial:
      amount: 1
  products:
    NCPharmaSludge: 1

- type: reaction
  id: NCPharmaSpoilImmune
  minTemp: 400
  reactants:
    NCPharmaBrothImmune:
      amount: 1
  products:
    NCPharmaSludge: 1

