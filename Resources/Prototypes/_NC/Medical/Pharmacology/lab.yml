# --- An unidentified compound: a stolen corporate prototype --------------------------------------------------
- type: ncDependenceProfile
  id: NCDependenceX17
  toleranceGainPerConcentration: 0.012
  maximumTolerance: 0.5
  dependenceGainPerConcentration: 0.008
  withdrawalCompound: NCDrugWithdrawalFatigue
  withdrawalConcentrationAtFull: 3
  psychoactive: true
  effects:
  - Stimulation
  comedownCompound: NCDrugComedownFatigue
  comedownPerConcentration: 0.4
  maximumComedown: 4

- type: ncDrugProfile
  id: NCDrugX17
  category: Stimulant
  codename: nc-lab-codename-x17
  dependence: NCDependenceX17
  interactionsCharted: false
  maximumConcentration: 20
  removalConcentration: 0.05
  minimumEffectiveConcentration: 1
  therapeuticConcentration: 4
  toxicConcentration: 6.5
  clearancePerSecond: 0.03
  baselineClearanceFraction: 0.1
  liverClearanceFraction: 0.7
  kidneyClearanceFraction: 0.2
  arousalAtTherapeutic: 0.6
  cardiacOutputMultiplierAtTherapeutic: 1.18
  rhythmInstabilityAtTherapeutic: 0.06
  overdoseBurdenPerSecondAtMaximum: 1.2
  interactions:
    NCDrugStimulantReversal:
      therapeuticMultiplier: 0.45
      toxicityMultiplier: 0.7

