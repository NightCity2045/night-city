# Ready-made kits of laboratory consumables. The stations themselves are placed one by one.

- type: entity
  parent: CrateMedical
  id: NCPharmaKitStreetLab
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: NCPharmaSourceCanisterStreet
          amount: 2
        - id: NCPharmaRawBiomass
          amount: 2
        - id: NCPharmaFilterCartridge
          amount: 2
        - id: NCPharmaWasteCanister
          amount: 4
        - id: NCLabSampleVial
          amount: 4

- type: entity
  parent: CrateMedical
  id: NCPharmaKitClinicalLab
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: NCPharmaSourceCanisterClinical
          amount: 2
        - id: NCPharmaRawCorporateStock
          amount: 2
        - id: NCPharmaFilterCartridge
          amount: 2
        - id: NCPharmaWasteCanister
          amount: 4
        - id: NCLabSampleVial
          amount: 4

- type: entity
  parent: BoxCardboard
  id: NCPharmaKitSampling
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: NCLabBloodSampler
          amount: 2
        - id: NCLabWoundSwabKit
          amount: 2
        - id: NCLabSampleVial
          amount: 6

- type: entity
  parent: BoxCardboard
  id: NCPharmaKitBloodBank
  components:
