    containers:
      storagebase: !type:AllSelector
        children:
        - id: NCBloodBagEmpty
          amount: 6

- type: entity
  parent: BoxCardboard
  id: NCPharmaKitImplantPrep
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: NCLabTissueSeedCoating
        - id: NCLabTissueSeedAntibacterial
        - id: NCLabTissueSeedInterface
        - id: NCLabTissueSeedGel
        - id: NCLabTissueSeedMatrix

- type: entity
  parent: BoxCardboard
  id: NCPharmaKitUnknownSamples
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: NCPharmaRawSeizedSample
          amount: 2
