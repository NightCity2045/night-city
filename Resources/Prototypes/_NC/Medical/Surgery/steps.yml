- type: ncSurgeryStep
  id: NCSurgeryStepPrepareField
  name: prepare surgical field
  duration: 3s
  optionalAtDirectStart: true
  requiredAccessDepth: Closed
  tools:
  - capability: NCSurgeryToolDisinfection
    minimumQuality: 0.5
    minimumSterility: 0.5
  environment:
    required: true
    minimumLighting: 0.4
    maximumMotion: 0.4
    maximumContamination: 0.65
  outcomeRules:
  - outcome: Compromised
    maximumToolSterility: 0.74
  - outcome: Compromised
    maximumEnvironmentSterility: 0.59
  - outcome: Compromised
    minimumEnvironmentContamination: 0.35
  successEffects:
  - kind: AddSiteContamination
    amount: -0.35
  compromisedEffects:
  - kind: AddSiteContamination
    amount: 0.2

- type: ncSurgeryStep
  id: NCSurgeryStepIncise
  name: make controlled incision
  duration: 4s
  requiredAccessDepth: Closed
  tools:
  - capability: NCSurgeryToolIncision
    minimumQuality: 0.55
    minimumSterility: 0.5
  patient:
    minimumAnesthesia: 0.35
    maximumMovement: 0.3
    requireRestraintWhenConscious: true
  outcomeRules:
  - outcome: Compromised
    maximumToolQuality: 0.74
  - outcome: Compromised
    maximumToolSterility: 0.74
  - outcome: Compromised
    minimumPatientMovement: 0.15
  successEffects:
  - kind: SetAccessDepth
    accessDepth: Incised
  compromisedEffects:
  - kind: AddSiteContamination
    amount: 0.12

- type: ncSurgeryStep
