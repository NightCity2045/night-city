    minimumQuality: 0.6
    minimumSterility: 0.55
  facility:
    required: true
    capabilities:
    - NCSurgeryFacilityStableSurface
    minimumQuality: 0.45
    requireStableSurface: true
  environment:
    required: true
    minimumSterility: 0.35
    minimumLighting: 0.5
    maximumMotion: 0.25
    maximumContamination: 0.6
  outcomeRules:
  - outcome: Compromised
    maximumToolQuality: 0.74
  - outcome: Compromised
    maximumEnvironmentSterility: 0.64
  successEffects:
  - kind: AddWoundTreatmentFlags
    treatmentFlags: Debrided
  - kind: AdjustWoundContamination
    amount: -0.75
  - kind: SetAccessDepth
    accessDepth: ReadyForClosure
  compromisedEffects:
  - kind: AdjustWoundContamination
    amount: 0.25
  - kind: AddSiteContamination
    amount: 0.15

