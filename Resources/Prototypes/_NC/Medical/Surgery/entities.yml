- type: entity
  id: NCScalpel
  parent: Scalpel
  name: Night City surgical scalpel
  components:
  - type: NCSurgeryTool
    capabilities:
      NCSurgeryToolIncision: 1
      NCSurgeryToolDebridement: 0.8
      NCSurgeryToolOrganRepair: 0.65
      NCSurgeryToolForeignBodyExtraction: 0.8
      NCSurgeryToolOrganSeparation: 0.75
      NCSurgeryToolOphthalmicRepair: 0.7
      NCSurgeryToolAutopsy: 0.8
    sterility: 1
  - type: NCSurgeryAuthorizationProvider
    authorizations:
    - NCSurgeryAuthorizationGeneral
    - NCSurgeryAuthorizationVascular
    - NCSurgeryAuthorizationOrthopedic
    - NCSurgeryAuthorizationOrgan

- type: entity
  id: NCHemostat
  parent: Hemostat
  name: Night City hemostat
  components:
  - type: NCSurgeryTool
    capabilities:
      NCSurgeryToolHemostasis: 1
      NCSurgeryToolVascularRepair: 0.9
      NCSurgeryToolBoneReduction: 0.55
      NCSurgeryToolForeignBodyExtraction: 0.9
      NCSurgeryToolOrganSeparation: 0.8
    sterility: 1
  - type: NCSurgeryAuthorizationProvider
    authorizations:
    - NCSurgeryAuthorizationGeneral
    - NCSurgeryAuthorizationVascular
    - NCSurgeryAuthorizationOrthopedic
    - NCSurgeryAuthorizationOrgan

- type: entity
  id: NCRetractor
  parent: Retractor
  name: Night City surgical retractor
  components:
  - type: NCSurgeryTool
    capabilities:
      NCSurgeryToolRetraction: 1
    sterility: 1
  - type: NCSurgeryAuthorizationProvider
    authorizations:
    - NCSurgeryAuthorizationGeneral
    - NCSurgeryAuthorizationVascular
    - NCSurgeryAuthorizationOrthopedic
    - NCSurgeryAuthorizationOrgan

- type: entity
  id: NCCautery
  parent: Cautery
  name: Night City cautery
  components:
  - type: NCSurgeryTool
    capabilities:
      NCSurgeryToolDisinfection: 0.8
      NCSurgeryToolHemostasis: 0.9
      NCSurgeryToolOrganRepair: 0.75
    sterility: 1
    startingProcedures:
    - NCSurgeryDeepWoundTreatment
    - NCSurgeryVascularRepair
    - NCSurgeryFractureFixation
    - NCSurgeryExposeOrgan
    - NCSurgeryOrganRepair
    - NCSurgeryWoundIrrigation
    - NCSurgeryForeignBodyExtraction
    - NCSurgeryTendonRepair
    - NCSurgeryPeripheralNerveRepair
    - NCSurgeryCranialDecompression
    - NCSurgeryBrainRepair
    - NCSurgeryEyeRepair
    - NCSurgeryOrganRemoval
    - NCSurgeryEyeRemoval
    - NCSurgeryOrganTransplant
    - NCSurgeryEyeTransplant
    - NCSurgeryLimbAmputation
    - NCSurgeryLimbReattachment
  - type: NCSurgeryAuthorizationProvider
    authorizations:
    - NCSurgeryAuthorizationGeneral
    - NCSurgeryAuthorizationVascular
    - NCSurgeryAuthorizationOrthopedic
    - NCSurgeryAuthorizationOrgan
    - NCSurgeryAuthorizationNeural
    - NCSurgeryAuthorizationTransplant
    - NCSurgeryAuthorizationForensic

- type: entity
  id: NCSurgicalSuture
  parent: MedicatedSuture
  name: Night City surgical suture
  components:
  - type: NCSurgeryTool
    capabilities:
      NCSurgeryToolSuturing: 1
      NCSurgeryToolVascularRepair: 0.75
      NCSurgeryToolOrganRepair: 0.75
      NCSurgeryToolTendonRepair: 0.85
      NCSurgeryToolNerveRepair: 0.8
      NCSurgeryToolTransplant: 0.8
      NCSurgeryToolOphthalmicRepair: 0.85
    sterility: 1
    usesRemaining: 4
  - type: NCSurgeryAuthorizationProvider
    authorizations:
    - NCSurgeryAuthorizationGeneral
    - NCSurgeryAuthorizationVascular
    - NCSurgeryAuthorizationOrthopedic
    - NCSurgeryAuthorizationOrgan

- type: entity
  id: NCSurgicalIrrigator
  parent: Cautery
  name: sterile surgical irrigator
  components:
  - type: NCSurgeryTool
    capabilities:
      NCSurgeryToolDisinfection: 0.9
      NCSurgeryToolIrrigation: 1
    sterility: 1
    usesRemaining: 8
  - type: NCSurgeryAuthorizationProvider
    authorizations:
    - NCSurgeryAuthorizationGeneral
    - NCSurgeryAuthorizationNeural

- type: entity
  id: NCMicrosurgeryKit
  parent: MedicatedSuture
  name: microsurgery instrument cassette
  components:
  - type: NCSurgeryTool
    capabilities:
      NCSurgeryToolTendonRepair: 1
      NCSurgeryToolNerveRepair: 1
      NCSurgeryToolOphthalmicRepair: 1
      NCSurgeryToolTransplant: 1
      NCSurgeryToolOrganRepair: 0.9
    sterility: 1
    usesRemaining: 8
  - type: NCSurgeryAuthorizationProvider
    authorizations:
    - NCSurgeryAuthorizationOrthopedic
    - NCSurgeryAuthorizationOrgan
    - NCSurgeryAuthorizationNeural
    - NCSurgeryAuthorizationTransplant

- type: entity
  id: NCCranialDrill
  parent: Drill
