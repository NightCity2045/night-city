  components:
  - type: NCSurgeryTool
    capabilities:
      NCSurgeryToolCranialAccess: 1
      NCSurgeryToolBoneReduction: 0.8
      NCSurgeryToolBoneFixation: 0.8
    sterility: 1
    usesRemaining: 6
  - type: NCSurgeryAuthorizationProvider
    authorizations:
    - NCSurgeryAuthorizationOrthopedic
    - NCSurgeryAuthorizationNeural

- type: entity
  id: NCSurgicalSaw
  parent: Saw
