  components:
  - type: NCSurgeryTool
    capabilities:
      NCSurgeryToolAmputation: 1
      NCSurgeryToolOrganSeparation: 0.85
      NCSurgeryToolBoneReduction: 0.8
    sterility: 1
  - type: NCSurgeryAuthorizationProvider
    authorizations:
    - NCSurgeryAuthorizationVascular
    - NCSurgeryAuthorizationOrthopedic
    - NCSurgeryAuthorizationOrgan

- type: entity
  id: NCForensicAutopsyKit
  parent: Scalpel
  name: forensic autopsy kit
  components:
  - type: NCSurgeryTool
    capabilities:
      NCSurgeryToolAutopsy: 1
      NCSurgeryToolSuturing: 0.7
    sterility: 0.6
    startingProcedures:
    - NCSurgeryRegionalAutopsy
  - type: NCSurgeryAuthorizationProvider
    authorizations:
    - NCSurgeryAuthorizationForensic

- type: entity
  id: NCBoneFixator
  parent: Hemostat
  name: compact bone fixator
  components:
  - type: NCSurgeryTool
    capabilities:
      NCSurgeryToolBoneReduction: 0.9
      NCSurgeryToolBoneFixation: 1
    sterility: 1
    usesRemaining: 3
  - type: NCSurgeryAuthorizationProvider
    authorizations:
    - NCSurgeryAuthorizationGeneral
    - NCSurgeryAuthorizationVascular
    - NCSurgeryAuthorizationOrthopedic
    - NCSurgeryAuthorizationOrgan

- type: entity
  id: NCOperatingTable
  parent: OperatingTable
  name: Night City operating table
  components:
  - type: NCSurgeryFacility
    capabilities:
    - NCSurgeryFacilityStableSurface
    - NCSurgeryFacilitySterileField
    - NCSurgeryFacilityMonitoring
    - NCSurgeryFacilityVentilation
    - NCSurgeryFacilityBoneFixation
    quality: 1
    sterility: 0.95
    powered: true
    stableSurface: true
  - type: NCSurgeryEnvironment
    sterility: 0.9
    lighting: 1
    motion: 0
    contamination: 0.05
  - type: NCSurgeryPreparationProvider
    movement: 0
    restrained: true
    airwayMonitored: true
