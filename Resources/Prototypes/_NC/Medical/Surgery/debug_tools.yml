# Admin-spawned test instrument. It deliberately reuses the vanilla multitool entity and sprite,
# while covering every data-driven instrument capability in the NC surgery catalogue.
- type: entity
  id: NCSurgeryDebugMultitool
  parent: Multitool
  name: surgical debug multitool
  description: An admin-only medical multitool for exercising every instrument stage of an NC surgical procedure.
  suffix: DEBUG
  components:
  - type: NCSurgeryTool
    capabilities:
      NCSurgeryToolDisinfection: 1
      NCSurgeryToolIncision: 1
      NCSurgeryToolHemostasis: 1
      NCSurgeryToolRetraction: 1
      NCSurgeryToolSuturing: 1
      NCSurgeryToolDebridement: 1
      NCSurgeryToolVascularRepair: 1
      NCSurgeryToolBoneReduction: 1
      NCSurgeryToolBoneFixation: 1
      NCSurgeryToolOrganRepair: 1
      NCSurgeryToolIrrigation: 1
      NCSurgeryToolForeignBodyExtraction: 1
      NCSurgeryToolTendonRepair: 1
      NCSurgeryToolNerveRepair: 1
      NCSurgeryToolOrganSeparation: 1
      NCSurgeryToolTransplant: 1
      NCSurgeryToolCranialAccess: 1
      NCSurgeryToolOphthalmicRepair: 1
      NCSurgeryToolAmputation: 1
      NCSurgeryToolAutopsy: 1
      NCSurgeryToolCyberware: 1
    sterility: 1
    usesRemaining: -1
    startingProcedures:
    - NCSurgeryDeepWoundTreatment
    - NCSurgeryVascularRepair
    - NCSurgeryFractureFixation
    - NCSurgeryExposeOrgan
    - NCSurgeryOrganRepair
    - NCSurgeryWoundIrrigation
    - NCSurgeryForeignBodyExtraction
    - NCSurgeryTendonRepair
    - NCSurgeryPeripheralNerveRepair
    - NCSurgeryCranialDecompression
    - NCSurgeryBrainRepair
    - NCSurgeryEyeRepair
    - NCSurgeryOrganRemoval
    - NCSurgeryEyeRemoval
    - NCSurgeryOrganTransplant
    - NCSurgeryEyeTransplant
    - NCSurgeryLimbAmputation
    - NCSurgeryLimbReattachment
    - NCSurgeryRegionalAutopsy
    - NCSurgeryCyberwareInstallation
    - NCSurgeryCyberwareRemoval
  - type: NCSurgeryAuthorizationProvider
    authorizations:
    - NCSurgeryAuthorizationGeneral
    - NCSurgeryAuthorizationVascular
    - NCSurgeryAuthorizationOrthopedic
    - NCSurgeryAuthorizationOrgan
    - NCSurgeryAuthorizationNeural
    - NCSurgeryAuthorizationTransplant
    - NCSurgeryAuthorizationForensic
