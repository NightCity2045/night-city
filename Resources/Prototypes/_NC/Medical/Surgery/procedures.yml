- type: ncSurgeryProcedure
  id: NCSurgeryDeepWoundTreatment
  name: deep wound treatment
  description: Debrides and closes one explicitly selected deep wound.
  compatibleBodyProfiles: [ Human ]
  requiredAuthorizations: [ NCSurgeryAuthorizationGeneral ]
  targetRequirements: Integrity
  requiresTargetWound: true
  compatibleWoundTypes: [ Ballistic, Slash, Pierce, Thermal, Blast ]
  facility:
    required: true
    capabilities: [ NCSurgeryFacilityStableSurface ]
    minimumQuality: 0.45
    requireStableSurface: true
  environment:
    required: true
    minimumLighting: 0.5
    maximumMotion: 0.25
    maximumContamination: 0.6
  patient:
    minimumOxygenation: 0.25
    maximumShockStage: Severe
    minimumAnalgesia: 0.3
    minimumSedation: 0.25
    minimumAnesthesia: 0.35
  steps:
  - NCSurgeryStepPrepareField
  - NCSurgeryStepIncise
  - NCSurgeryStepControlBleeders
  - NCSurgeryStepRetractTissue
  - NCSurgeryStepDebrideWound
  - NCSurgeryStepSutureClosure
  abortEffects:
  - kind: AddSiteContamination
    amount: 0.08

