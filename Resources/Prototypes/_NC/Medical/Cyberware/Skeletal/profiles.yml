- type: ncCyberware
  id: NCGraftedMuscleBoneLace
  skeletalSurgery:
  - stage: Torso
    name: nc-skeletal-step-graft-torso
    zone: NCZoneChest
    structure: Thorax
    action: ConnectSkeletal
    minimumDepth: 0.68
  - stage: ArmLeft
    name: nc-skeletal-step-graft-armleft
    zone: NCZoneArmLeft
    structure: ArmBoneLeft
    action: ConnectSkeletal
    prerequisites: Torso
    minimumDepth: 0.58
  - stage: ArmRight
    name: nc-skeletal-step-graft-armright
    zone: NCZoneArmRight
    structure: ArmBoneRight
    action: ConnectSkeletal
    prerequisites: Torso
    minimumDepth: 0.58
  - stage: LegLeft
    name: nc-skeletal-step-graft-legleft
    zone: NCZoneLegLeft
    structure: LegBoneLeft
    action: ConnectSkeletal
    prerequisites: Torso
    minimumDepth: 0.58
  - stage: LegRight
    name: nc-skeletal-step-graft-legright
    zone: NCZoneLegRight
    structure: LegBoneRight
    action: ConnectSkeletal
    prerequisites: Torso
    minimumDepth: 0.58
  material: Hybrid
  name: muscle bone lace
  nameId: nc-skeletal-profile-muscle-bone-lace
  manufacturer: Night City 2045 clinical adaptation
  icon:
    sprite: _NC/Objects/Cyberware/skeletal.rsi
    state: muscle_bone_lace
  form: Implant
  compatibleSlots: [ NCSlotMuscleBoneLacePrimary, NCSlotMuscleBoneLaceSecondary ]
  size: 1
  maximumIntegrity: 100
  repairProfile: NCRepairProfileClinicalCyberware
  humanityPackages: [ NCHumanityProfessionalMotor ]
  skeletalEnhancement: true
  requiresFactoryPreparation: true
  hardsuitPenaltyAllowance: 0.15
  boneTraumaMultiplier: 0.75
  requiresPower: false
  vulnerableToEmp: false
  requiresSeparateCalibration: false
  idlePowerPerSecond: 0
  loadedPowerPerSecond: 0
  heatCapacity: 120
  idleHeatPerSecond: 0
  loadedHeatPerSecond: 0
  passiveCoolingPerSecond: 0.4
  heatDeratingThreshold: 80
  heatShutdownThreshold: 100
  heatDamageThreshold: 110
  heatDamagePerSecond: 1
  neuralRequirement: None
  updateInterval: 0.5s
  capabilities: []

