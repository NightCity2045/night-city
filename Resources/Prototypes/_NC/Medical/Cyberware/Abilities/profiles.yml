- type: ncCyberwareAbilityPolicy
  id: NCCyberwareAbilityPolicy
  maximumMotorBonus: 0.25
  minimumManualDurationFactor: 0.8
  maximumPenaltyReduction: 0.25
  maximumWalkSpeed: 4.5
  maximumSprintSpeed: 6
  manualMotorQualities: [ Screwing, Anchoring, Prying ]

- type: ncCyberwareSlot
  id: NCSlotMotorBurst
  name: motor burst controller bay
  nameId: nc-cyberware-slot-motor-burst
