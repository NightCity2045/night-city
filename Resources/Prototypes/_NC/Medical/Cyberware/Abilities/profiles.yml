      volume: -10
  kind: Tool
  action: NCToolHandAction
  integralItem: NCIntegralScrewdriver
  startupEnergy: 0
  cooldownSeconds: 0

- type: ncCyberware
  id: NCToolHand
  name: NCToolHand
  nameId: nc-cyberware-profile-nctoolhand
  manufacturer: Night City adaptation
  icon:
    sprite: _NC/Objects/Cyberware/implants.rsi
    state: cyberarm_right
  form: Implant
  compatibleSlots: [ NCSlotArmUtilityLeft, NCSlotArmUtilityRight ]
  size: 1
  maximumIntegrity: 80
  repairProfile: NCRepairProfileClinicalCyberware
