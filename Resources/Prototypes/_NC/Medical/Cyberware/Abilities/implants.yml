- type: entity
  parent: NCCyberwareAbilityImplantBase
  id: NCToolHandImplant
  components:
  - type: Sprite
    sprite: _NC/Objects/Cyberware/arms.rsi
    state: tool
  - type: Item
    sprite: _NC/Objects/Cyberware/arms.rsi
  - type: NCCyberware
    profile: NCToolHand
    factoryPrepared: true
  - type: NCArmModule
    kind: Tool
    volume: 1
    visualState: tool
    requiresHeavyFrame: false
    deploySeconds: 0.6
  - type: NCCyberwareAbility
    profile: NCToolHandAbility
- type: entity
  parent: BaseAction
  id: NCToolHandAction
  components:
  - type: Action
    useDelay: 0.3
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _NC/Objects/Cyberware/arms.rsi
    layers:
    - state: tool
      map: ["enum.ActionVisuals.Icon"]
    - state: tool
      map: ["enum.ActionVisuals.IconToggled"]
      color: "#70FFFF"
      visible: false
  - type: InstantAction
    event: !type:NCActivateCyberwareAbilityEvent

