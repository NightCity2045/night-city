- type: entity
  parent: BaseAction
  id: NCArmImpactAction
  components:
  - type: Action
    useDelay: 0.5
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _NC/Objects/Cyberware/arms.rsi
    layers:
    - state: impact
      map: ["enum.ActionVisuals.Icon"]
    - state: impact
      map: ["enum.ActionVisuals.IconToggled"]
      color: "#70FFFF"
      visible: false
  - type: InstantAction
    event: !type:NCActivateCyberwareAbilityEvent {}
