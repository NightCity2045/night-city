- type: entity
  parent: NCOrganHumanCyberEyes
  id: NCCyberEyeLeftStandard
  suffix: Standard
  components:
  - type: Sprite
    sprite: _NC/Objects/Cyberware/optics.rsi
    state: eye_left
  - type: Item
    sprite: _NC/Objects/Cyberware/optics.rsi
  - type: Organ
    category: Eyes
  - type: NCOrganFunction
    functionType: Vision
    baseCapacity: 0.5
  - type: NCCyberware
    profile: NCCyberEyeLeftProfile
    factoryPrepared: true
    quality: NCCyberwareQualityStandard
    qualityParts:
      NCOpticControllerSlot: NCOpticControllerBasicStandard
      NCOpticMatrixSlot: NCOpticMatrixStandard
      NCOpticNeuralSlot: NCOpticNeuralStandard
      NCOpticPowerSlot: NCOpticPowerStandard
  - type: NCCyberEye
    right: false
  - type: NCMetaOptics
    supportsLowLight: true
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Eyes
    data:
      sprite: _NC/Objects/Cyberware/optics.rsi
      state: worn_left
      color: '#44E6DA'

