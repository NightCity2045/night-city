- type: ncCyberwarePartSlot
  id: NCOpticControllerSlot
  name: nc-optics-slot-controller

- type: ncCyberwarePartSlot
  id: NCOpticMatrixSlot
  name: nc-optics-slot-matrix

- type: ncCyberwarePartSlot
  id: NCOpticNeuralSlot
  name: nc-optics-slot-neural

- type: ncCyberwarePartSlot
  id: NCOpticPowerSlot
  name: nc-optics-slot-power

- type: ncCyberwarePartSlot
  id: NCOpticModule1Slot
  name: nc-optics-slot-module1

- type: ncCyberwarePartSlot
  id: NCOpticModule2Slot
  name: nc-optics-slot-module2

- type: ncCyberwarePartSlot
