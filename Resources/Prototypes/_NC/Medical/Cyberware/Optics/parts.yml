  name: nc-optics-slot-module3

- type: ncCyberwarePartSlot
  id: NCOpticCosmeticSlot
  name: nc-optics-slot-cosmetic

- type: ncMetaHardware
  id: NCMetaOpticController
  memoryBytes: 262144
  storageBytes: 1048576
  maxProcesses: 1
  gasPerWindow: 25000
  idleWatts: 0
  activeWatts: 1
  interfaces:
  - meta.implants.CyberEye

- type: ncCyberwarePart
  id: NCOpticControllerStandardPart
  slot: NCOpticControllerSlot
  maximumIntegrity: 60

- type: entity
  parent: NCBaseCyberwarePart
  id: NCOpticControllerStandard
  components:
  - type: Sprite
    sprite: _NC/Objects/Cyberware/optics.rsi
    state: controller
  - type: NCCyberwarePart
    profile: NCOpticControllerStandardPart
  - type: NCOpticController
  - type: NCMetaHost
    profile: NCMetaOpticController
    allowClaim: true
  - type: NCMetaDevice
    allowClaim: true
    interfaces:
    - meta.implants.CyberEye
  - type: NCMetaTerminal
  - type: NCMetaPort
    networkId: LOCAL
  - type: UserInterface
    interfaces:
      enum.NCMetaUiKey.Workspace:
        type: NCMetaWorkspaceBoundUserInterface

- type: entity
  parent: NCOpticControllerStandard
  id: NCOpticControllerBasicStandard
  components:
  - type: NCOpticController
    factoryProgram: true

- type: ncCyberwarePart
  id: NCOpticMatrixStandardPart
  slot: NCOpticMatrixSlot
  maximumIntegrity: 60

- type: entity
  parent: NCBaseCyberwarePart
  id: NCOpticMatrixStandard
  components:
  - type: Sprite
    sprite: _NC/Objects/Cyberware/optics.rsi
    state: matrix
  - type: NCCyberwarePart
    profile: NCOpticMatrixStandardPart

- type: ncCyberwarePart
  id: NCOpticNeuralStandardPart
