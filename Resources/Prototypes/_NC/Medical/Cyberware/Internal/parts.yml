- type: ncCyberwarePartSlot
  id: NCMedicalControllerSlot
  name: nc-medical-slot-controller

- type: ncCyberwarePartSlot
  id: NCMedicalSensorSlot
  name: nc-medical-slot-sensor

- type: ncCyberwarePartSlot
  id: NCMedicalPumpSlot
  name: nc-medical-slot-pump

- type: ncCyberwarePart
  id: NCMedicalControllerStandardPart
  slot: NCMedicalControllerSlot
  maximumIntegrity: 60

- type: entity
  parent: NCBaseCyberwarePart
  id: NCMedicalControllerStandard
  components:
  - type: Sprite
    state: capacitor
  - type: NCCyberwarePart
    profile: NCMedicalControllerStandardPart
  - type: NCMedicalController

- type: ncCyberwarePart
  id: NCMedicalSensorStandardPart
  slot: NCMedicalSensorSlot
  maximumIntegrity: 60

- type: entity
  parent: NCBaseCyberwarePart
  id: NCMedicalSensorStandard
  components:
  - type: Sprite
    state: scan_module
  - type: NCCyberwarePart
    profile: NCMedicalSensorStandardPart

- type: ncCyberwarePart
  id: NCMedicalPumpStandardPart
  slot: NCMedicalPumpSlot
  maximumIntegrity: 60

- type: entity
  parent: NCBaseCyberwarePart
  id: NCMedicalPumpStandard
  components:
  - type: Sprite
    state: micro_mani
  - type: NCCyberwarePart
    profile: NCMedicalPumpStandardPart

- type: ncCyberwareFirmware
  id: NCMedicalFirmwareBasic
  name: nc-medical-firmware-basic
  inhibitActiveModes: true

- type: entity
  parent: NCMedicalControllerStandard
  id: NCMedicalControllerBasic
  components:
  - type: NCMedicalController
    firmware: NCMedicalFirmwareBasic

- type: ncCyberwareFirmware
  id: NCMedicalFirmwareBiomonitor
  name: nc-medical-firmware-biomonitor
  inhibitActiveModes: false

- type: entity
  parent: NCMedicalControllerStandard
  id: NCMedicalControllerBiomonitor
  components:
  - type: NCMedicalController
    firmware: NCMedicalFirmwareBiomonitor

- type: ncCyberwareFirmware
  id: NCMedicalFirmwareInjector
  name: nc-medical-firmware-injector
  inhibitActiveModes: false

- type: entity
  parent: NCMedicalControllerStandard
  id: NCMedicalControllerInjector
  components:
  - type: NCMedicalController
    firmware: NCMedicalFirmwareInjector

- type: ncCyberwareAssembly
  id: NCBiomonitorAssembly
  defaultParts:
    NCMedicalControllerSlot: NCMedicalControllerBiomonitor
    NCMedicalSensorSlot: NCMedicalSensorStandard

- type: ncCyberwareAssembly
  id: NCAutoInjectorAssembly
  defaultParts:
    NCMedicalControllerSlot: NCMedicalControllerInjector
    NCMedicalPumpSlot: NCMedicalPumpStandard
