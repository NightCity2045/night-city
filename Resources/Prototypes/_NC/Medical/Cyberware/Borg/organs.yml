- type: entity
  parent: NCBorgMechanicalOrganBase
  id: NCBorgPodHead
  name: biopod casing
  components:
  - type: Organ
    category: Head
  - type: ParentOrgan
  - type: NCCyberwareSlotHost
    slots: [ NCSlotNeuralCore, NCSlotCranialUtility, NCSlotMotorBurst, NCSlotMotorStabilizer ]
  - type: NCCyberware
    profile: NCBorgSupportNode

- type: entity
  parent: NCBorgSupportOrganBase
  id: NCBorgPerfusionPump
  name: biopod life support node
  components:
  - type: Organ
    category: Heart
  - type: NCOrganFunction
    functionType: Circulation
  - type: Metabolizer
    metabolizerTypes: [ Human ]
    stages: [ Bloodstream ]

- type: entity
  parent: NCBorgSupportOrganBase
  id: NCBorgOxygenator
  name: biopod life support node
  components:
  - type: Organ
    category: Lungs
  - type: NCOrganFunction
    functionType: Respiration
  - type: Metabolizer
    stages: []

- type: entity
  parent: NCBorgSupportOrganBase
  id: NCBorgMetabolicFilter
  name: biopod life support node
  components:
  - type: Organ
    category: Liver
  - type: NCOrganFunction
    functionType: Metabolism
  - type: Metabolizer
    metabolizerTypes: [ Human ]
    stages: [ Metabolites ]

- type: entity
  parent: NCBorgSupportOrganBase
  id: NCBorgWasteFilter
  name: biopod life support node
  components:
  - type: Organ
    category: Kidneys
  - type: NCOrganFunction
    functionType: Filtration
  - type: Metabolizer
    stages: []

- type: entity
  parent: NCBorgSupportOrganBase
  id: NCBorgNutrientProcessor
  name: biopod life support node
  components:
  - type: Organ
    category: Stomach
  - type: NCOrganFunction
    functionType: Digestion
  - type: Metabolizer
    metabolizerTypes: [ Human ]
    stages: [ Digestion ]
  - type: Stomach
  - type: SolutionManager
    solutions:
    - SolutionStomach

- type: entity
  parent: NCBorgMechanicalOrganBase
  id: NCBorgFrameTorso
  name: standard civilian frame
  components:
  - type: Sprite
    sprite: _NC/Mobs/Cyberware/parts.rsi
    state: torso_m
    color: "#A8BAC9"
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Chest
    data:
      sprite: _NC/Mobs/Cyberware/parts.rsi
      state: torso_m
      color: "#A8BAC9"
  - type: Organ
    category: Torso
  - type: ParentOrgan
  - type: NCBorgStandardShell

- type: entity
  parent: NCBorgMechanicalOrganBase
  id: NCBorgFramePowerHolder
  name: civilian frame cell holder
  components:
  - type: Organ
    category: Thorax
  - type: NCCyberware
    profile: NCBorgFrameBus
  - type: NCCyberwarePowerBus
  - type: NCCyberwareSlotHost
    slots: [ NCSlotThoracicConverter, NCSlotSubdermalThorax ]
  - type: NCSurgicalSite
    accessDepth: OrganExposed
    tissuesRetracted: true
    boneCasingOpen: true
  - type: PowerCellSlot
    cellSlotId: nc_main_cell
    fitsInCharger: false
  - type: ItemSlots
    slots:
      nc_main_cell:
        name: nc-cyberware-power-main-cell
        locked: true
        disableEject: true
        insertOnInteract: false
        whitelist:
          components: [ PowerCell ]
      nc_reserve_cell:
        name: nc-cyberware-power-reserve-cell
        locked: true
        disableEject: true
        insertOnInteract: false
        whitelist:
          components: [ PowerCell ]

