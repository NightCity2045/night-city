# The only machine that prints implants, cyberlimbs and their parts.
- type: entity
  parent: BaseLatheLube
  id: NCImplantFabricator
  name: implant fabricator
  description: Prints implants, cyberlimbs and all of their parts.
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: med
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    idleState: icon
    runningState: icon
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - NCCyberMechanicalStatic
    - NCCyberElectronicsStatic
    - NCCyberRoboticsStatic
    - NCCyberMedicalStatic
  - type: Machine
    board: NCImplantFabricatorMachineCircuitboard
  - type: OreSiloClient

- type: entity
  parent: BaseMachineCircuitboard
  id: NCImplantFabricatorMachineCircuitboard
  name: implant fabricator machine board
  description: A machine printed circuit board for an implant fabricator.
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: NCImplantFabricator
    stackRequirements:
      Manipulator: 4

- type: latheRecipe
  parent: [ BaseCircuitboardRecipe, BaseGeneralMachineRecipeCategory ]
  id: NCImplantFabricatorMachineCircuitboard
  result: NCImplantFabricatorMachineCircuitboard

- type: latheRecipePack
  id: NCImplantBoardsStatic
  recipes:
  - NCImplantFabricatorMachineCircuitboard
