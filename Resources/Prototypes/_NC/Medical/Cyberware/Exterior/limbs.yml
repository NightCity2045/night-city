- type: ncCyberware
  id: NCClinicalCyberArm
  humanityPackages:
  - NCHumanityMedical
  requiresSeparateCalibration: true
  assembly: NCIndustrialArmAssembly
  name: clinical cyberarm
  manufacturer: Night City clinical adaptation
  icon:
    sprite: _NC/Objects/Cyberware/implants.rsi
    state: cyberarm_right
  hostIcons:
    ArmLeft:
      sprite: _NC/Objects/Cyberware/implants.rsi
      state: cyberarm_left
    ArmRight:
      sprite: _NC/Objects/Cyberware/implants.rsi
      state: cyberarm_right
  form: LimbReplacement
  size: 5
  maximumIntegrity: 160
  repairProfile: NCRepairProfileStreetCyberware
  auxiliaryServiceProfiles:
  - NCCoolantServiceAgent
  powerCapacity: 10800
  startingPowerFraction: 1
  minimumOperationalPower: 1
  idlePowerPerSecond: 0.5
  loadedPowerPerSecond: 5
  heatCapacity: 160
  idleHeatPerSecond: 0.2
  loadedHeatPerSecond: 2.5
  passiveCoolingPerSecond: 0.8
  heatDeratingThreshold: 95
  heatShutdownThreshold: 130
  heatDamageThreshold: 140
  heatDamagePerSecond: 2
  empResistance: 1200
  empSurgeDamagePerEnergy: 0.001
  maximumEmpSurgeDamage: 45
  empHeatPerEnergy: 0.002
  maximumEmpHeat: 90
  empDisableDurationMultiplier: 0.75
  neuralDamagePerEmpEnergy: 1.0e-05
  neuralRequirement: Required
  neuralDegradedThreshold: 0.65
  neuralMinimumOperationalIntegrity: 0.15
  updateInterval: 1s
  capabilities:
  - Movement
  - Grip
  - ServiceHatch
  nameId: nc-cyberware-profile-clinical-arm

