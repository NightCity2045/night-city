# Future artificial bones inherit one of these bases and supply Sprite and NCCyberware.
# Their cyberware profile must use form: OrganReplacement. No accessory slot is involved.
- type: entity
  abstract: true
  parent: NCOrganHumanStructureBase
  id: NCOrganHumanSkeletalReplacementBase
  components:
  - type: NCAnatomicalRegion
    tissueProfile: NCHumanMechanicalTissue
  - type: NCOrganIntegrity
    material: Mechanical
  - type: NCBone
  - type: NCDetachedOrganMedicalData
    sourceBodyProfile: Human
    woundProfile: NCHumanWoundSystem
    treatmentProfile: NCHumanFieldTreatment

- type: entity
  abstract: true
  parent: NCOrganHumanSkeletalReplacementBase
  id: NCOrganHumanCyberSkullBase
