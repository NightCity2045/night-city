    sprite: _NC/Objects/Cyberware/neural.rsi
    state: controller
  - type: NCCyberwarePart
    profile: NCNeuralControllerStandardPart
  - type: NCNeuralController
  - type: NCMetaHost
    profile: NCMetaNeuralController
    allowClaim: true
  - type: NCMetaDevice
    allowClaim: true
    interfaces:
    - meta.implants.NeuralController
