- type: ncMetaHardware
  id: NCMetaNeuralController
  memoryBytes: 262144
  storageBytes: 1048576
  maxProcesses: 1
  gasPerWindow: 25000
  idleWatts: 0
  activeWatts: 1
  interfaces:
  - meta.implants.NeuralController
  - meta.net.MessagePort

