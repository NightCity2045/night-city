# Mechanical anatomical replacements retain the normal organ categories, so existing detachment and
# AttachGraft surgery can install them without a parallel body graph.
- type: entity
  id: NCOrganHumanCyberArmLeft
  parent: NCOrganHumanDetachableParentRegionBase
  name: left industrial cyberarm
  components:
  - type: Sprite
    sprite: _NC/Objects/Cyberware/implants.rsi
    state: cyberarm_left
  - type: Item
    sprite: _NC/Objects/Cyberware/implants.rsi
  - type: Organ
    category: ArmLeft
  - type: NCAnatomicalRegion
    tissueProfile: NCHumanMechanicalTissue
    movementContribution: 0.5
    gripContribution: 0.35
    armorLocations: [ ArmLeft ]
  - type: NCJoint
  - type: NCNerve
    cyberprostheticInterface: true
  - type: NCCyberware
    profile: NCIndustrialCyberArm
