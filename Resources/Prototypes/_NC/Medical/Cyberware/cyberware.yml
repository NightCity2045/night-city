  - type: NCOrganIntegrity
    material: Mechanical
  - type: NCSurgicalSite

- type: entity
  id: NCImplantNeuralLinkMk1
  parent: NCCyberwareImplantBase
  name: neural link Mk.1
  description: A clinical cranial neural-interface module. It is inert until installed and calibrated.
  components:
