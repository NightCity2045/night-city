# Disclosure profiles are cumulative. Record limits and quantization are authoritative privacy bounds,
# not UI hints; the server clamps them again to defensive absolute maxima.
- type: ncDiagnosticCapability
  id: NCDiagnosticsSelfSensations
  tier: SelfSensations
  disclosures: [ SubjectiveSymptoms ]
  unassistedDefault: true
  selfOnly: true
  range: 0
  maxRegionRecords: 12
  maxWoundRecords: 0
  maxOrganRecords: 0
  bloodVolumeQuantum: 1000
  ratioQuantum: 0.2
  bleedRateQuantum: 1

- type: ncDiagnosticCapability
  id: NCDiagnosticsVisual
  tier: Visual
  disclosures: [ SubjectiveSymptoms, VisibleTrauma, ExternalBleeding ]
  unassistedDefault: true
  range: 4
  maxRegionRecords: 12
  maxWoundRecords: 8
  maxOrganRecords: 0
  bloodVolumeQuantum: 1000
  ratioQuantum: 0.2
  bleedRateQuantum: 1

- type: ncDiagnosticCapability
  id: NCDiagnosticsManual
  tier: Manual
  disclosures:
  - SubjectiveSymptoms
  - VisibleTrauma
  - ExternalBleeding
  - ManualVitals
  - StructuralInstability
  - ProbableRegions
  unassistedDefault: true
  range: 1.5
  maxRegionRecords: 12
  maxWoundRecords: 8
  maxOrganRecords: 0
  bloodVolumeQuantum: 1000
  ratioQuantum: 0.2
  bleedRateQuantum: 1

- type: ncDiagnosticCapability
  id: NCDiagnosticsHandheldApproximate
  tier: HandheldApproximate
  disclosures:
  - SubjectiveSymptoms
  - VisibleTrauma
  - ExternalBleeding
  - ManualVitals
  - StructuralInstability
  - ApproximateVitals
  - ProbableRegions
  requiresHeld: true
  range: 1.5
  maxRegionRecords: 12
  maxWoundRecords: 12
  maxOrganRecords: 0
  bloodVolumeQuantum: 500
  ratioQuantum: 0.1
  bleedRateQuantum: 0.5

- type: ncDiagnosticCapability
  id: NCDiagnosticsScannerInternal
  tier: ScannerInternal
  disclosures:
  - SubjectiveSymptoms
  - VisibleTrauma
  - ExternalBleeding
  - ManualVitals
  - StructuralInstability
  - ApproximateVitals
  - ProbableRegions
  - InternalBleeding
  - Fractures
  - DetailedWounds
  - Organs
  - Infection
  - ForeignBodies
  - Cyberware
  - Drugs
  requiresPower: true
  requiresHeld: true
  range: 3
  maxRegionRecords: 12
  maxWoundRecords: 24
  maxOrganRecords: 16
  maxCyberwareRecords: 16
  maxDrugRecords: 16
  bloodVolumeQuantum: 100
  ratioQuantum: 0.02
  bleedRateQuantum: 0.1
  drugConcentrationQuantum: 0.05

- type: ncDiagnosticCapability
  id: NCDiagnosticsSurgicalConsole
  tier: SurgicalConsole
  disclosures:
  - SubjectiveSymptoms
  - VisibleTrauma
  - ExternalBleeding
  - ManualVitals
  - StructuralInstability
  - ApproximateVitals
  - ProbableRegions
  - InternalBleeding
  - Fractures
  - DetailedWounds
  - Organs
  - Infection
  - ForeignBodies
  - SurgicalState
  - Cyberware
  - Drugs
  requiresPower: true
  range: 2.5
  maxRegionRecords: 12
  maxWoundRecords: 32
  maxOrganRecords: 32
  maxCyberwareRecords: 32
  maxDrugRecords: 32
  bloodVolumeQuantum: 50
  ratioQuantum: 0.01
  bleedRateQuantum: 0.05
  drugConcentrationQuantum: 0.025

# Spawnable devices reuse upstream art and physical behavior. Their NC capability is observed server-side;
# it never grants access merely because a client asks for its tier.
- type: entity
  parent: BaseItem
  id: NCDiagnosticHandheldAnalyzer
  name: trauma field analyzer
  description: A rugged analyzer that reports approximate vitals without revealing internal anatomy.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/healthanalyzer.rsi
    layers:
    - state: icon
    - state: analyzer
      shader: unshaded
  - type: Item
    heldPrefix: analyzer
    storedRotation: -90
  - type: NCDiagnosticCapability
    capability: NCDiagnosticsHandheldApproximate

- type: entity
  parent: BaseItem
  id: NCDiagnosticBodyScanner
  name: portable trauma body scanner
  description: A battery-powered held scanner for bounded internal trauma and organ summaries.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/healthanalyzer.rsi
    layers:
    - state: icon
    - state: analyzer
      shader: unshaded
  - type: Item
    heldPrefix: analyzer
    storedRotation: -90
  - type: NCDiagnosticCapability
    capability: NCDiagnosticsScannerInternal
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000

- type: entity
  parent: computerBodyScanner
  id: NCDiagnosticSurgicalConsole
  name: trauma surgical console
  description: A powered console for the currently exposed surgical region and procedure.
  components:
  - type: NCDiagnosticCapability
    capability: NCDiagnosticsSurgicalConsole
  - type: NCSurgeryConsole
    facilitySearchRange: 2.5
  - type: UserInterface
    interfaces:
      enum.NCSurgeryConsoleUiKey.Key:
        type: NCSurgeryConsoleBoundUserInterface
  - type: ActivatableUI
    key: enum.NCSurgeryConsoleUiKey.Key
    verbText: nc-medical-surgery-console-title
