# Dedicated ports keep the body-scanner console independent from vanilla cloning and medical-scanner links.
- type: sourcePort
  id: NCOperatingTableSender
  name: nc-signal-port-name-operating-table-sender
  description: nc-signal-port-description-operating-table-sender
  defaultLinks: [ NCOperatingTableReceiver ]

- type: sinkPort
  id: NCOperatingTableReceiver
  name: nc-signal-port-name-operating-table-receiver
