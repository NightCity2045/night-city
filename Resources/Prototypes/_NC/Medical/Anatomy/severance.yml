# Traumatic separation is deterministic. Ordinary sidearms cannot satisfy the per-impact energy gate even after
# repeated attacks. Pellets from one accepted shot may aggregate only inside one region, while repeated cutting
# must first leave the live limb structurally mangled before a later impact can finish the separation.
- type: ncTraumaticSeveranceProfile
  id: NCHumanTraumaticSeverance
  stumpTraumaProfile: TraumaticAmputationImpact
  mechanisms:
    Ballistic:
      impact:
        minimumSeverity: Catastrophic
        minimumTrauma: 28
        maximumIntegrityFraction: 0.8
        minimumBoneState: Shattered
        maximumTendonIntegrity: 0.45
      compoundAction:
        minimumSeverity: Severe
        minimumTrauma: 30
        maximumIntegrityFraction: 0.8
        minimumBoneState: BrokenStable
        maximumTendonIntegrity: 0.45
      mechanicalImpact:
        minimumSeverity: Catastrophic
        minimumTrauma: 45
        maximumIntegrityFraction: 0.55
    Slash:
      impact:
        minimumSeverity: Critical
        minimumTrauma: 20
        maximumIntegrityFraction: 0.8
        minimumBoneState: BrokenDisplaced
        maximumTendonIntegrity: 0.15
      mangledFinisher:
        minimumSeverity: Severe
        minimumTrauma: 10
        maximumIntegrityFraction: 0.3
        maximumTendonIntegrity: 0.05
      mechanicalImpact:
        minimumSeverity: Catastrophic
        minimumTrauma: 48
        maximumIntegrityFraction: 0.5
    Blast:
      impact:
        minimumSeverity: Catastrophic
        minimumTrauma: 25
        maximumIntegrityFraction: 0.7
        minimumBoneState: Shattered
        maximumTendonIntegrity: 0.3
      mechanicalImpact:
        minimumSeverity: Catastrophic
        minimumTrauma: 42
        maximumIntegrityFraction: 0.55
    Blunt:
      impact:
        minimumSeverity: Catastrophic
        minimumTrauma: 40
        maximumIntegrityFraction: 0.55
        minimumBoneState: Shattered
        maximumTendonIntegrity: 0.2
      mechanicalImpact:
        minimumSeverity: Catastrophic
        minimumTrauma: 55
        maximumIntegrityFraction: 0.4
  regions:
    ArmLeft:
      targetZone: NCZoneArmLeft
      boneCategory: ArmBoneLeft
      tendonCategory: TendonSetLeftArm
      stumpTrauma: 12
      mechanicalStumpTraumaMultiplier: 0.65
    ArmRight:
      targetZone: NCZoneArmRight
      boneCategory: ArmBoneRight
      tendonCategory: TendonSetRightArm
      stumpTrauma: 12
      mechanicalStumpTraumaMultiplier: 0.65
    HandLeft:
      targetZone: NCZoneHandLeft
      stumpTrauma: 8
      mechanicalStumpTraumaMultiplier: 0.5
    HandRight:
      targetZone: NCZoneHandRight
      stumpTrauma: 8
      mechanicalStumpTraumaMultiplier: 0.5
    LegLeft:
      targetZone: NCZoneLegLeft
      boneCategory: LegBoneLeft
      tendonCategory: TendonSetLeftLeg
      stumpTrauma: 14
      mechanicalStumpTraumaMultiplier: 0.65
    LegRight:
      targetZone: NCZoneLegRight
      boneCategory: LegBoneRight
      tendonCategory: TendonSetRightLeg
      stumpTrauma: 14
      mechanicalStumpTraumaMultiplier: 0.65
    FootLeft:
      targetZone: NCZoneFootLeft
      stumpTrauma: 8
      mechanicalStumpTraumaMultiplier: 0.5
    FootRight:
      targetZone: NCZoneFootRight
      stumpTrauma: 8
      mechanicalStumpTraumaMultiplier: 0.5
