- type: ncWoundProgressionProfile
  id: NCHumanWoundProgression
  healingDurationBySeverity:
    Minor: 20m
    Moderate: 2h
    Severe: 6h
    Critical: 12h
    Catastrophic: 24h
  closureHealingMultipliers:
    Open: 0.2
    TemporarilyClosed: 0.65
    Sutured: 1
    Sealed: 1.15
    Healed: 0
  reopenStressThresholds:
    Minor: 8
    Moderate: 12
    Severe: 18
    Critical: 24
    Catastrophic: 32
  impactReopenStressBySeverity:
    Minor: 4
    Moderate: 8
    Severe: 14
    Critical: 22
    Catastrophic: 32
  infectionSeverityMultipliers:
    Minor: 0.7
    Moderate: 1
    Severe: 1.25
    Critical: 1.5
    Catastrophic: 2
  scarContractureBySeverity:
    Minor: 0
    Moderate: 0.04
    Severe: 0.1
    Critical: 0.18
    Catastrophic: 0.3
  infectionStageThresholds: [ 0.08, 0.25, 0.45, 0.65, 0.85 ]
  freshToOpenDelay: 5s
  naturalClosureMaximumSeverity: Minor
  naturalClosureProgress: 0.25
  # An untreated open wound reaches the infection threshold in roughly 10 minutes of active simulation.
  openContaminationPerSecond: 0.00025
  # A fresh sterile dressing must overcome the residual exposure of an open wound instead of merely slowing it.
  sterileContaminationDecayPerSecond: 0.00002
  infectionContaminationThreshold: 0.15
  # Untreated moderate wounds progress to a localized infection on the scale of one round, not real-world days.
  infectionGrowthPerSecond: 0.0003
  debridementInfectionRecoveryPerSecond: 0.00002
  antibioticRecoveryPerPowerPerSecond: 0.00006
  immunosuppressionInfectionMultiplier: 1
  embeddedObjectInfectionMultiplier: 1.75
  closedInfectionMultiplier: 0.35
  healingBlockedAtInfectionStage: Localized
  necrosisStartsAtInfectionStage: Deep
  infectionNecrosisPerSecond: 0.000015
  necroticThreshold: 0.65
  healingBleedReductionFraction: 1
  healingPainReductionFraction: 0.8
  minimumHealingPerfusion: 0.35
  reopenHealingRetention: 0.35
  reopenBleedFraction: 0.75
  reopenContamination: 0.08
  reopenScarRisk: 0.12
  reopenStressDecayPerSecond: 0.0005
  movementStressPerTile: 1
  maximumPendingMovementDistance: 64
  persistenceCheckpointInterval: 30s
  scarCreationThreshold: 0.15
  guaranteedScarFromSeverity: Severe
  maximumScars: 64
  ischemiaIntegrityDamagePerSecond: 0.002
  criticalIschemiaIntegrityDamagePerSecond: 0.01
  ischemiaNerveDamagePerSecond: 0.00002
  criticalIschemiaNerveDamagePerSecond: 0.0001
  ischemiaNecrosisPerSecond: 0.00002
  criticalIschemiaNecrosisPerSecond: 0.0001
  sepsisSystemicProfile: NCSepsisSystemicDamage
  sepsisExposurePerSecondByStage:
    Systemic: 0.015
    Sepsis: 0.05
  sepsisAntibioticRecoveryPerPowerPerSecond: 0.08

- type: ncWoundSystemProfile
  id: NCHumanWoundSystem
  defaultForHumans: true
  progressionProfile: NCHumanWoundProgression
  impactBloodProfile: NCHumanImpactBlood
  severanceProfile: NCHumanTraumaticSeverance
  maxActiveWounds: 32
  processedImpactCapacity: 128
  mergeContaminationTolerance: 0.05
  boneStateBySeverity:
    Minor: Bruised
    Moderate: Cracked
    Severe: BrokenStable
    Critical: BrokenDisplaced
    Catastrophic: Shattered
  boneStabilityLossPerDamage: 0.01
  displacementFromState: BrokenDisplaced
  fixationFromState: BrokenStable
  # Standard 14-point handgun hits are severe, not immediately critical; catastrophic trauma is reserved
  # for high-energy weapons and explosions. These are inclusive upper bounds.
  severityThresholds: [ 4, 9, 16, 24 ]
  statusDamageThresholds: [ 1, 3, 5, 8, 12, 17, 24, 32 ]
  severityStatusLevels:
    Minor: 1
    Moderate: 3
    Severe: 5
    Critical: 7
    Catastrophic: 8
  wounds:
    Projectile: NCWoundBallistic
    Slash: NCWoundSlash
    Pierce: NCWoundPierce
    Blunt: NCWoundBlunt
    Heat: NCWoundThermal
    Cold: NCWoundCold
    Electrical: NCWoundElectrical
    Explosive: NCWoundBlast
    Pressure: NCWoundPressure
    Chemical: NCWoundChemical

# The pulse is real NC circulation loss. The upstream bloodstream bridge converts it to solution units and
# accumulates/spills it through vanilla puddles; droplets and cleanable decals are bounded visual feedback.
- type: ncImpactBloodProfile
  id: NCHumanImpactBlood
  woundTypes: [ Ballistic, Slash, Pierce, Blast ]
  bloodLossBySeverity:
    Minor: 0
    Moderate: 5
    Severe: 15
    Critical: 35
    Catastrophic: 75
  dropletsBySeverity:
    Minor: 0
    Moderate: 2
    Severe: 3
    Critical: 5
    Catastrophic: 7
  decalsBySeverity:
    Minor: 0
    Moderate: 1
    Severe: 1
    Critical: 2
    Catastrophic: 3
  patterns:
    Ballistic:
      kind: Directed
      splatDecals: [ NCBloodSplat0, NCBloodSplat1, NCBloodSplat2, NCBloodSplat3, NCBloodSplat4, NCBloodSplat5 ]
      streakDecals: [ NCBloodStreakShort, NCBloodStreakThin, NCBloodStreakSlash ]
      splatsBySeverity:
        Minor: 0
        Moderate: 1
        Severe: 1
        Critical: 2
        Catastrophic: 2
      streaksBySeverity:
        Minor: 0
        Moderate: 0
        Severe: 1
        Critical: 2
        Catastrophic: 3
      coneDegrees: 24
      distanceMultiplier: 1.15
      splatRadius: 0.18
      splatSize: 0.62
      streakLengthMultiplier: 1.35
      streakWidth: 0.24
      persistentStreakFraction: 0.55
    Slash:
      kind: Arc
      splatDecals: [ NCBloodSplat0, NCBloodSplat1, NCBloodSplat2, NCBloodSplat3, NCBloodSplat4, NCBloodSplat5 ]
      streakDecals: [ NCBloodStreakSlash, NCBloodStreakShort, NCBloodStreakThin ]
      splatsBySeverity:
        Minor: 0
        Moderate: 1
        Severe: 1
        Critical: 2
        Catastrophic: 2
      streaksBySeverity:
        Minor: 0
        Moderate: 1
        Severe: 1
        Critical: 2
        Catastrophic: 3
      coneDegrees: 58
      distanceMultiplier: 0.85
      splatRadius: 0.2
      splatSize: 0.58
      streakLengthMultiplier: 1.05
      streakWidth: 0.28
      persistentStreakFraction: 0.8
    Pierce:
      kind: Directed
      splatDecals: [ NCBloodSplat0, NCBloodSplat1, NCBloodSplat2, NCBloodSplat3, NCBloodSplat4, NCBloodSplat5 ]
      streakDecals: [ NCBloodStreakThin, NCBloodStreakSlash ]
      splatsBySeverity:
        Minor: 0
        Moderate: 1
        Severe: 1
        Critical: 1
        Catastrophic: 2
      streaksBySeverity:
        Minor: 0
        Moderate: 0
        Severe: 1
        Critical: 1
        Catastrophic: 2
      coneDegrees: 14
      distanceMultiplier: 0.9
      splatRadius: 0.12
      splatSize: 0.46
      streakLengthMultiplier: 1.15
      streakWidth: 0.17
      persistentStreakFraction: 0.4
    Blast:
      kind: Radial
      splatDecals: [ NCBloodSplat0, NCBloodSplat1, NCBloodSplat2, NCBloodSplat3, NCBloodSplat4, NCBloodSplat5 ]
      streakDecals: [ NCBloodStreakShort, NCBloodStreakSlash, NCBloodStreakThin ]
      splatsBySeverity:
        Minor: 0
        Moderate: 1
        Severe: 2
        Critical: 2
        Catastrophic: 3
      streaksBySeverity:
        Minor: 0
        Moderate: 1
        Severe: 2
        Critical: 3
        Catastrophic: 4
      coneDegrees: 360
      distanceMultiplier: 0.95
      splatRadius: 0.26
      splatSize: 0.72
      streakLengthMultiplier: 1.2
      streakWidth: 0.3
      persistentStreakFraction: 0.45
  decalColor: '#7E0F13E8'
  effectColor: '#BC181BEA'
  effectDuration: 0.48s
  sprayDistance: 1.55
  dropletSize: 0.045
  embeddedDistanceMultiplier: 0.55
  exitDistanceMultiplier: 1.4
  maximumDecalsPerImpact: 3
  maximumNearbyDecals: 8
  nearbyDecalRadius: 2
  maximumSurfaceStainsPerEntity: 10
  maximumActiveSurfaceEntities: 256
  surfaceStainScale: 0.72
  maximumClientBursts: 64
  # Ongoing external loss is aggregated into one cleanable mark per tile instead of a spreading solution puddle.
  poolStages:
  - minimumVolume: 1
    decal: NCBloodSplat0
  - minimumVolume: 10
    decal: NCBloodSplat2
  - minimumVolume: 30
    decal: NCBloodSplat3
  - minimumVolume: 70
    decal: NCBloodSplat5
  maximumPoolVolumePerTile: 90
  maximumPoolTilesPerGrid: 256
  poolTileMargin: 0.16

