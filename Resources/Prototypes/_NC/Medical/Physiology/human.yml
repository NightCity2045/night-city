- type: ncPhysiologyProfile
  id: NCHumanPhysiology
  defaultForHumans: true
  nominalBloodVolume: 5000
  defaultTransfusionCompatibility: NC-A-Positive
  criticalPerfusionThreshold: 0.5
  arrestPerfusionThreshold: 0.2
  brainInjuryPerfusionThreshold: 0.3
  brainDeathDelay: 180s
  brainRecoveryRate: 0.25
  dazedThreshold: 0.8
  confusedThreshold: 0.65
  stuporousThreshold: 0.5
  unconsciousThreshold: 0.35
  comatoseThreshold: 0.2
  painThresholds: [ 1, 5, 12, 24, 40 ]
  shockThresholds: [ 0.15, 0.35, 0.6, 0.85 ]
  painShockContribution: 0.35
  shockConsciousnessPenalty: 0.15
  criticalUpdateInterval: 0.25s
  activeBleedingUpdateInterval: 0.5s
  stableInjuredUpdateInterval: 1s
  maximumScheduledBodiesPerTick: 4
  maximumSchedulerWorkTime: 0.003s
  schedulingPhaseWindow: 0.1s
