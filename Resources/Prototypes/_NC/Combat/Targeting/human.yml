- type: ncTargetDoll
  id: NCHumanTargetDoll
  canvasSize: 32,32
  statusLayers:
  - id: head
    sprite: /Textures/_NC/Interface/Targeting/Status/head.rsi
    statePrefix: head
    sourceZones: [ NCZoneHead ]
  - id: torso
    sprite: /Textures/_NC/Interface/Targeting/Status/torso.rsi
    statePrefix: torso
    sourceZones: [ NCZoneChest, NCZoneAbdomen ]
  - id: groin
    sprite: /Textures/_NC/Interface/Targeting/Status/groin.rsi
    statePrefix: groin
    sourceZones: [ NCZoneGroin ]
  - id: rightarm
    sprite: /Textures/_NC/Interface/Targeting/Status/rightarm.rsi
    statePrefix: rightarm
    sourceZones: [ NCZoneArmRight ]
  - id: righthand
    sprite: /Textures/_NC/Interface/Targeting/Status/righthand.rsi
    statePrefix: righthand
    sourceZones: [ NCZoneHandRight ]
  - id: leftarm
    sprite: /Textures/_NC/Interface/Targeting/Status/leftarm.rsi
    statePrefix: leftarm
    sourceZones: [ NCZoneArmLeft ]
  - id: lefthand
    sprite: /Textures/_NC/Interface/Targeting/Status/lefthand.rsi
    statePrefix: lefthand
    sourceZones: [ NCZoneHandLeft ]
  - id: rightleg
    sprite: /Textures/_NC/Interface/Targeting/Status/rightleg.rsi
    statePrefix: rightleg
    sourceZones: [ NCZoneLegRight ]
  - id: rightfoot
    sprite: /Textures/_NC/Interface/Targeting/Status/rightfoot.rsi
    statePrefix: rightfoot
    sourceZones: [ NCZoneFootRight ]
  - id: leftleg
    sprite: /Textures/_NC/Interface/Targeting/Status/leftleg.rsi
    statePrefix: leftleg
    sourceZones: [ NCZoneLegLeft ]
  - id: leftfoot
    sprite: /Textures/_NC/Interface/Targeting/Status/leftfoot.rsi
    statePrefix: leftfoot
    sourceZones: [ NCZoneFootLeft ]
  zones:
  - zone: NCZoneHead
    position: 10,2
    selectedTexture: /Textures/_NC/Interface/Targeting/Doll/head.png
    hoverTexture: /Textures/_NC/Interface/Targeting/Doll/head_hover.png
  - zone: NCZoneChest
    position: 10,9
    selectedTexture: /Textures/_NC/Interface/Targeting/Doll/torso.png
    hoverTexture: /Textures/_NC/Interface/Targeting/Doll/torso_hover.png
    selectedRegion:
      position: 0,0
      size: 9,6
    hoverRegion:
      position: 0,0
      size: 11,7
  - zone: NCZoneAbdomen
    position: 10,15
    selectedTexture: /Textures/_NC/Interface/Targeting/Doll/torso.png
    hoverTexture: /Textures/_NC/Interface/Targeting/Doll/torso_hover.png
    selectedRegion:
      position: 0,6
      size: 9,4
    hoverRegion:
      position: 0,6
      size: 11,6
  - zone: NCZoneGroin
    position: 10,19
    selectedTexture: /Textures/_NC/Interface/Targeting/Doll/groin.png
    hoverTexture: /Textures/_NC/Interface/Targeting/Doll/groin_hover.png
  - zone: NCZoneArmRight
    position: 7,10
    displaySize: 5,6
    hitboxPadding: 1,1
    selectedTexture: /Textures/_NC/Interface/Targeting/Doll/rightarm.png
    hoverTexture: /Textures/_NC/Interface/Targeting/Doll/rightarm_hover.png
  - zone: NCZoneHandRight
