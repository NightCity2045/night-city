- type: ncBluntTransferProfile
  id: NCBallisticStoppedTransfer
  traumaProfile: BluntImpact
  rules:
  - minimumRawDamage: 18
    appliedTrauma: 1
  - minimumRawDamage: 28
    appliedTrauma: 3
  - minimumRawDamage: 40
    appliedTrauma: 6

- type: ncCombatDamageProfile
  id: NCBallisticStandard
  traumaProfile: BallisticProjectile
  armorDamageClass: Ballistic
  ablationAmount: 1
  bluntTransferProfile: NCBallisticStoppedTransfer
  traumaFlags: [ Penetrating, CanEmbed, CanExit ]
  embedMinimumPostArmorDamage: 1
  embeddedObjectEntityPrototype: NCExtractedBullet
  exitMinimumPostArmorDamage: 18
  exitTraumaMultiplier: 0.35
  canOverpenetrateBody: true

