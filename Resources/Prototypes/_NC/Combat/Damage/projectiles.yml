# Physical projectile prototypes without an exact ammunition override resolve from their actual positive payload.
# Radiation and other systemic types remain absent: their physiology adapters own those effects, never ballistics.
- type: ncProjectileDamageProfileMap
  id: NCProjectileDefaultDamageProfileMap
  defaultForHumans: true
  profiles:
    Blunt: NCProjectileBluntStandard
    Slash: NCProjectileSlashStandard
    Piercing: NCBallisticStandard
    Heat: NCProjectileThermalStandard
    Cold: NCProjectileColdStandard
    Shock: NCProjectileElectricalStandard
    Caustic: NCProjectileChemicalStandard
