# Systemic entries are semantically partitioned from local trauma. Shock intentionally exists in both maps:
# the same measured electrical scalar creates an electrical contact wound and rhythm instability exactly once.
- type: ncEnvironmentDamageProfileMap
  id: NCEnvironmentDefaultDamageProfileMap
  defaultForHumans: true
  profiles:
    Blunt: NCEnvironmentBluntStandard
    Slash: NCEnvironmentSlashStandard
    Piercing: NCEnvironmentPiercingStandard
    Heat: NCEnvironmentThermalStandard
    Cold: NCEnvironmentColdStandard
    Shock: NCEnvironmentElectricalStandard
    Caustic: NCEnvironmentChemicalStandard
    NCExplosive: NCEnvironmentExplosiveStandard
    NCPressure: NCEnvironmentPressureStandard
  systemicProfiles:
    Asphyxiation: NCHypoxiaSystemicDamage
    Poison: NCToxinSystemicDamage
    Radiation: NCRadiationSystemicDamage
    Cellular: NCCellularSystemicDamage
    Shock: NCElectricalSystemicDamage
  rejectedLocalHealing:
  - Blunt
  - Slash
  - Piercing
  - Heat
  - Cold
  - Shock
  - Caustic
  - NCExplosive
  - NCPressure
