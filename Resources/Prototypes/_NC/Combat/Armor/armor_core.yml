- type: ncArmorConditionProfile
  id: NCArmorConditionStandard
  stages:
  - stage: Intact
    minimumFraction: 0.76
  - stage: Worn
    minimumFraction: 0.51
  - stage: Damaged
    minimumFraction: 0.26
  - stage: Critical
    minimumFraction: 0.01
  - stage: Destroyed
    minimumFraction: 0

