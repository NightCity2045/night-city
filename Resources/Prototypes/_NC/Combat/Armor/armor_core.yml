# Consumable field service kit. It can patch common fabric, plate and composite sections to 75% of MaxSP.
- type: entity
  id: NCArmorRepairKit
  parent: BaseItem
  name: armor field repair kit
  description: A finite set of replacement fibers, resin and plate patches. It cannot restore workshop-grade protection.
  components:
  - type: Sprite
    sprite: Objects/Tools/rcd.rsi
    state: icon
  - type: Item
    size: Small
  - type: Appearance
  - type: LimitedCharges
    maxCharges: 4
  - type: NCArmorRepairTool
    capabilities: [ ArmorFabric, ArmorPlate, ArmorComposite ]
    repairDelay: 4
    interactionRange: 1.5
    chargeCost: 1
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Plastic: 100
  - type: StaticPrice
    price: 150

