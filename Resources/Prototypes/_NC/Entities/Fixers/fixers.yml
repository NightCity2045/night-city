# John "Insider" Doe never shows up in person: players talk to him through this net terminal.
- type: entity
  parent: NCFixerBase
  id: NCFixerInsider
  components:
  - type: Sprite
    sprite: _NC/Structures/Fixers/insider_terminal.rsi
    layers:
    - state: fixer
    - state: fixer-unshaded
      shader: unshaded
  - type: PointLight
    radius: 1.5
    energy: 0.6
    color: "#7affd8"
  - type: NCFixer
    fixer: NCFixerInsider

- type: entity
  parent: NCFixerBase
  id: NCFixerVlad
  components:
  - type: Sprite
    sprite: _NC/Structures/Fixers/fixer_vlad.rsi
    layers:
    - state: fixer
    - state: fixer-unshaded
      shader: unshaded
  - type: NCFixer
    fixer: NCFixerVlad

- type: entity
  parent: NCFixerDeadDropBase
  id: NCFixerDeadDropInsider
  suffix: NCFixerInsider
  components:
  - type: NCFixerDeadDrop
    fixer: NCFixerInsider

- type: entity
  parent: NCFixerDeadDropBase
  id: NCFixerDeadDropVlad
  suffix: NCFixerVlad
  components:
  - type: NCFixerDeadDrop
    fixer: NCFixerVlad

# Spawned at a dead drop marker for deliveries that do not end at the fixer; removed after the mission.
- type: entity
  parent: NCFixerDeadDropBase
  id: NCFixerMissionDeadDrop
  components:
  - type: NCFixerDeadDrop
