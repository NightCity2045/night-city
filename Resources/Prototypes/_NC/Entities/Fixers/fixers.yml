  - type: NCFixer
    fixer: NCFixerVlad

- type: entity
  parent: NCFixerDeadDropBase
  id: NCFixerDeadDropInsider
  suffix: NCFixerInsider
  components:
  - type: NCFixerDeadDrop
    fixer: NCFixerInsider

- type: entity
  parent: NCFixerDeadDropBase
  id: NCFixerDeadDropVlad
  suffix: NCFixerVlad
  components:
  - type: NCFixerDeadDrop
    fixer: NCFixerVlad

