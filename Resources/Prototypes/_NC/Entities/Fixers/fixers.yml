# John "Insider" Doe never shows up in person: players talk to him through this net terminal.
- type: entity
  parent: NCFixerBase
  id: NCFixerInsider
  components:
  - type: Sprite
    sprite: _NC/Structures/Fixers/insider_terminal.rsi
    layers:
    - state: fixer
    - state: fixer-unshaded
      shader: unshaded
  - type: PointLight
    radius: 1.5
    energy: 0.6
    color: "#7affd8"
  - type: NCFixer
    fixer: NCFixerInsider

- type: entity
  parent: NCFixerBase
  id: NCFixerVlad
  components:
  - type: Sprite
    sprite: _NC/Structures/Fixers/fixer_vlad.rsi
