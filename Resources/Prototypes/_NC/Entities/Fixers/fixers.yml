- type: entity
  parent: NCFixerBase
  id: NCFixerAlpha
  components:
  - type: Sprite
    sprite: _NC/Structures/Fixers/fixer_alpha.rsi
    layers:
    - state: fixer
    - state: fixer-unshaded
      shader: unshaded
  - type: NCFixer
    fixer: NCFixerAlpha

- type: entity
  parent: NCFixerBase
  id: NCFixerBeta
  components:
  - type: Sprite
    sprite: _NC/Structures/Fixers/fixer_beta.rsi
    layers:
    - state: fixer
    - state: fixer-unshaded
      shader: unshaded
  - type: NCFixer
    fixer: NCFixerBeta

- type: entity
  parent: NCFixerDeadDropBase
  id: NCFixerDeadDropAlpha
  suffix: NCFixerAlpha
  components:
  - type: NCFixerDeadDrop
    fixer: NCFixerAlpha

- type: entity
  parent: NCFixerDeadDropBase
  id: NCFixerDeadDropBeta
  suffix: NCFixerBeta
  components:
  - type: NCFixerDeadDrop
    fixer: NCFixerBeta

# Spawned at a dead drop marker for deliveries that do not end at the fixer; removed after the mission.
- type: entity
  parent: NCFixerDeadDropBase
  id: NCFixerMissionDeadDrop
  components:
  - type: NCFixerDeadDrop
