# A fixer is a fixed object players talk to: no damage, no pulling, no AI.
- type: entity
  abstract: true
  id: NCFixerBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 100
        mask:
        - MachineMask
        layer:
        - MidImpassable
  - type: Sprite
    noRot: false
  - type: ActivatableUI
    key: enum.NCFixerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.NCFixerUiKey.Key:
        type: NCFixerBoundUserInterface

- type: entity
  abstract: true
  parent: CrateGenericSteel
  id: NCFixerDeadDropBase
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _NC/Structures/Fixers/dead_drop.rsi
  - type: Icon
    sprite: _NC/Structures/Fixers/dead_drop.rsi

- type: entity
  abstract: true
  parent: MarkerBase
  id: NCMissionMarkerBase
  suffix: Mission marker
  components:
  - type: Sprite
    sprite: _NC/Markers/mission_markers.rsi
    state: objective
