- type: entity
  parent: BoxCardboard
  id: NCMissionPackage
  components:
  - type: Sprite
    sprite: _NC/Objects/Fixers/mission_package.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Item
    sprite: Objects/Storage/boxes.rsi

- type: entity
  parent: ResearchDisk
  id: NCMissionDataShard
  components:
  - type: Sprite
    sprite: _NC/Objects/Fixers/data_shard.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: StaticPrice
    price: 0

# Something to wreck: a rack of hardware that breaks apart under enough damage.
- type: entity
  parent: BaseStructure
  id: NCMissionSabotageTarget
  components:
  - type: Sprite
    sprite: Structures/Machines/server.rsi
    state: server
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Vlad's merchandise, handed to the courier for the buyer.
- type: entity
  parent: BaseItem
  id: NCMissionDrugBrick
  components:
  - type: Sprite
    sprite: _NC/Objects/Fixers/drug_brick.rsi
    state: icon
  - type: Item
    size: Small
  - type: StaticPrice
    price: 0

# A terminal spawned for a hacking job. Hacking it takes a while and gives the mission's data shard.
- type: entity
  parent: BaseStructure
  id: NCMissionIntelTerminal
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - state: computer
    - state: generic_keyboard
    - state: generic
      shader: unshaded
  - type: InteractionOutline
  - type: NCMissionTerminal

