# NCPD
# High rank (Lieutenant, Commander, Chief)
- type: entity
  parent: ClothingNeckBase
  id: NCPDWarrantCard
  name: NCPD warrant card
  description: A senior NCPD warrant card. It proves your authority to command. Not an access card.
  components:
  - type: Sprite
    scale: 0.6,0.6
    sprite: _NC/Objects/Misc/ncpd_warrant_card.rsi
  - type: Clothing
    sprite: _NC/Objects/Misc/ncpd_warrant_card.rsi
  - type: Item
    size: Small
    storedRotation: -90
  - type: Tag
    tags:
    - WhitelistChameleon

# Middle rank (Sergeant, Inspector)
- type: entity
  parent: NCPDWarrantCard
  id: NCPDBadgeSilverGold
  name: NCPD silver badge with gold trim
  description: A silver NCPD badge with gold lettering. A clear sign you've survived long enough to earn a desk.
  components:
  - type: Sprite
    sprite: _NC/Objects/Misc/ncpd_badge_silver_gold.rsi
  - type: Clothing
    sprite: _NC/Objects/Misc/ncpd_badge_silver_gold.rsi

# Low rank (Cadet, Officer)
- type: entity
  parent: NCPDWarrantCard
  id: NCPDBadgeSilver
  name: NCPD silver badge
  description: A standard silver NCPD badge. Polished to a shine, but still smells like cheap precinct coffee.
  components:
