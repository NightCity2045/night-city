    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Item
    sprite: _NC/Objects/Weapons/Guns/Pistol/Mallorian_Arms/tiny.rsi
  - type: Clothing
    sprite: _NC/Objects/Weapons/Guns/Pistol/Mallorian_Arms/tiny.rsi
