        name: Chamber
        priority: 1
        whitelist:
          tags: [ NCCartridge12mm ]

- type: entity
  id: NCWeaponPistolBurya
  parent: [ BaseWeaponRevolver, BaseGunWieldable ]
  name: Techtronika Burya
  description: A four-shot 14mm Tech revolver. Its armor-piercing discharge is slow, deafening and capable of breaking the shooter's hands.
  components:
  - type: Sprite
    sprite: _NC/Objects/Weapons/Guns/Pistol/BT_Burya.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Item
    sprite: _NC/Objects/Weapons/Guns/Pistol/BT_Burya.rsi
  - type: Clothing
    sprite: _NC/Objects/Weapons/Guns/Pistol/BT_Burya.rsi
  - type: Gun
    fireRate: 0.4
    cameraRecoilScalar: 4.5
    minAngle: 1
    maxAngle: 10
    angleIncrease: 10
    angleDecay: 2
    selectedMode: SemiAuto
    availableModes: [ SemiAuto ]
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: UseDelay
    delay: 2.5
  - type: RevolverAmmoProvider
    whitelist:
      tags: [ NCCartridge14mmBurya ]
    proto: NCCartridge14mmBurya
    capacity: 4
    chambers: [ true, true, true, true ]
    ammoSlots: [ null, null, null, null ]
  - type: NCHeavyWeaponRecoil
    additionalImpulse: 110
    wieldedHandDamage:
      types:
        Blunt: 12
    singleHandDamage:
      types:
        Blunt: 18
