- type: entity
  id: NCWeaponRifleNomadSniper
  parent: BaseWeaponRifle
  name: Nomad sniper rifle
  description: A long-range 7.62mm rifle rebuilt to survive the open road.
  components:
  - type: Sprite
    sprite: _NC/Objects/Weapons/Guns/Rifles/NomadSniperRifle/big.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    sprite: _NC/Objects/Weapons/Guns/Rifles/NomadSniperRifle/tiny.rsi
  - type: Clothing
    sprite: _NC/Objects/Weapons/Guns/Rifles/NomadSniperRifle/tiny.rsi
  - type: GunRequiresWield
  - type: Gun
    fireRate: 0.65
    selectedMode: SemiAuto
    availableModes: [ SemiAuto ]
    minAngle: 0.1
    maxAngle: 2
    angleIncrease: 3
    angleDecay: 5
    cameraRecoilScalar: 3
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: NCMagazine762Sniper
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags: [ NCMagazine762Sniper ]
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags: [ NCCartridge762 ]
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
