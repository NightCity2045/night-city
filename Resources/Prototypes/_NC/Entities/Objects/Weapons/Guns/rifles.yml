- type: entity
  abstract: true
  id: NCBaseWeaponRifle556
  parent: BaseWeaponRifle
  components:
  - type: GunRequiresWield
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: NCMagazine556Rifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags: [ NCMagazine556Rifle ]
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags: [ NCCartridge556 ]
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  id: NCWeaponRifleNowaki
  parent: NCBaseWeaponRifle556
  name: Arasaka Nowaki
  description: A controlled-burst 5.56mm corporate assault rifle.
  components:
  - type: Sprite
    sprite: _NC/Objects/Weapons/Guns/Rifles/ArasakaNOWAKI/big.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    sprite: _NC/Objects/Weapons/Guns/Rifles/ArasakaNOWAKI/tiny.rsi
  - type: Clothing
    sprite: _NC/Objects/Weapons/Guns/Rifles/ArasakaNOWAKI/tiny.rsi
  - type: Gun
    fireRate: 6
    burstFireRate: 9
    shotsPerBurst: 3
    selectedMode: Burst
    availableModes: [ SemiAuto, Burst ]
    cameraRecoilScalar: 1.5

