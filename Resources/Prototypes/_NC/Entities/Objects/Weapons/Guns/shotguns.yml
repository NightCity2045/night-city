- type: entity
  id: NCWeaponShotgunCrusher
  parent: WeaponShotgunBulldog
  name: Militech Crusher
  description: A compact magazine-fed 12 gauge shotgun with punishing close-range firepower.
  components:
  - type: Sprite
    sprite: _NC/Objects/Weapons/Guns/Shotguns/Militech_Crusher/big.rsi
    scale: "0.7, 0.7"
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: StaticPrice
    price: 1000 # NC: a street shotgun, not the syndicate Bulldog it is built on.
  - type: Item
    sprite: _NC/Objects/Weapons/Guns/Shotguns/Militech_Crusher/tiny.rsi
  - type: Clothing
    sprite: _NC/Objects/Weapons/Guns/Shotguns/Militech_Crusher/tiny.rsi
  - type: Gun
    fireRate: 1.5
    selectedMode: SemiAuto
    availableModes: [ SemiAuto ]
    cameraRecoilScalar: 2.5
    angleIncrease: 4
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: NCMagazine12GaugeCrusher
        priority: 2
        whitelist:
          tags: [ NCMagazine12GaugeCrusher ]
        whitelistFailPopup: gun-magazine-whitelist-fail
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg

- type: entity
  id: NCWeaponShotgunCarnage
  parent: [ BaseWeaponShotgun, BaseGunWieldable ]
  name: Budget Arms Carnage
  description: A pump-action 12 gauge with a short tube and a kick that rearranges shoulders. Cheap, crude and devastating up close.
  components:
  - type: Sprite
    sprite: _NC/Objects/Weapons/Guns/Shotguns/Budget_Arms_Carnage/big.rsi
    scale: "0.7, 0.7"
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Item
    sprite: _NC/Objects/Weapons/Guns/Shotguns/Budget_Arms_Carnage/tiny.rsi
  # The new art has no worn sprites yet; on the back it looks like the stock pump shotgun.
  - type: Clothing
    sprite: Objects/Weapons/Guns/Shotguns/pump.rsi
  - type: GunRequiresWield
  - type: Gun
    fireRate: 0.8
    cameraRecoilScalar: 3
    angleIncrease: 5
  - type: GunSpreadModifier
    spread: 0.8
  - type: BallisticAmmoProvider
    whitelist:
      tags: [ NCShell12Gauge ]
    proto: NCShell12Gauge
    capacity: 4
  - type: StaticPrice
    price: 800
