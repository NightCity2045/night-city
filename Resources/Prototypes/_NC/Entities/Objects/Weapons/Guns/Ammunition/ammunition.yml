# Cartridge bodies inherit stock casing behavior and art, but replace their compatibility tags and projectile.
- type: entity
  id: NCCartridge9x19
  parent: BaseCartridgePistol
  name: cartridge (9x19mm)
  components:
  - type: Tag
    tags: [ NCCartridge9x19 ]
  - type: CartridgeAmmo
    proto: NCBullet9x19

- type: entity
  id: NCCartridge11mm
  parent: BaseCartridgePistol
  name: cartridge (11mm)
  components:
  - type: Tag
    tags: [ NCCartridge11mm ]
  - type: CartridgeAmmo
    proto: NCBullet11mm

- type: entity
  id: NCCartridge12mm
  parent: BaseCartridgeMagnum
  name: cartridge (12mm)
  components:
  - type: Tag
    tags: [ NCCartridge12mm ]
  - type: CartridgeAmmo
    proto: NCBullet12mm

- type: entity
  id: NCCartridge12mmMallorian
  parent: BaseCartridgeMagnum
  name: Mallorian cartridge (12mm)
  description: A premium 12mm cartridge packaged for Mallorian Arms magazines.
  components:
  - type: Tag
    tags: [ NCCartridge12mm ]
  - type: CartridgeAmmo
    proto: NCBullet12mm
  - type: Sprite
    sprite: _NC/Objects/Weapons/Guns/Pistol/Mallorian_Arms/round.rsi
    layers:
    - state: round
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: SpentAmmoVisuals
    state: round

- type: entity
  id: NCCartridge14mmBurya
  parent: BaseCartridgeMagnum
  name: armor-piercing cartridge (14mm Burya)
  description: A proprietary high-pressure penetrator. Firing it from anything lighter than a Burya would be suicidal.
  components:
