# Projectile damage is centralized here so lethality can be balanced without touching weapon prototypes.
- type: entity
  id: NCBullet9x19
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  name: bullet (9x19mm)
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 14
  - type: NCProjectileDamageProfile
    profile: NCBallisticStandard

