# Medical Technologies limb farm equipment.

# A glass vat growing a replacement limb. Breakable dressing for the lab floors.
- type: entity
  parent: [ BaseMachine, BaseMachineDestructible ]
  id: NCMedTechGrowthVat
  components:
  - type: Sprite
    sprite: _NC/Structures/MedTech/growth_vat.rsi
    layers:
    - state: vat
    - state: vat-unshaded
      shader: unshaded
  - type: Icon
    sprite: _NC/Structures/MedTech/growth_vat.rsi
    state: vat
  - type: PointLight
    radius: 1.5
    energy: 0.8
    color: "#59ffd0"
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 2

# Runs the growth vats of a floor. The target of sabotage jobs against the limb farm.
- type: entity
  parent: [ BaseMachine, BaseMachineDestructible ]
  id: NCMedTechVatController
  components:
  - type: Sprite
    sprite: _NC/Structures/MedTech/vat_controller.rsi
    layers:
    - state: controller
    - state: controller-unshaded
      shader: unshaded
  - type: Icon
    sprite: _NC/Structures/MedTech/vat_controller.rsi
    state: controller
  - type: PointLight
    radius: 1.5
    energy: 0.6
    color: "#59ffd0"
