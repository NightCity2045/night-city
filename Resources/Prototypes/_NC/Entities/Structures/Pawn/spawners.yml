# Place the marker within four tiles of the matching pawn pallet on the same grid.
# Each marker creates exactly one merchant at its position and rotation, then deletes itself.
- type: entity
  parent: NCPawnShopkeeperSpawnerBase
  id: SpawnNCPawnShopkeeper30
  name: pawn broker spawner
  suffix: 30%
  components:
  - type: EntityTableSpawner
    offset: 0
    table: !type:EntSelector
      id: NCPawnShopkeeper30

- type: entity
  parent: NCPawnShopkeeperSpawnerBase
