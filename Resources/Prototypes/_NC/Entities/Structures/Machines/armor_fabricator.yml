# Prints body armor, helmets and the Militech combat hardsuit.
- type: entity
  parent: BaseLatheLube
  id: NCArmorFabricator
  name: armor fabricator
  description: Prints body armor, helmets and combat hardsuits.
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: cargo
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    idleState: icon
    runningState: icon
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - NCArmorStatic
  - type: Machine
    board: NCArmorFabricatorMachineCircuitboard
  - type: OreSiloClient

- type: entity
  parent: BaseMachineCircuitboard
  id: NCArmorFabricatorMachineCircuitboard
  name: armor fabricator machine board
  description: A machine printed circuit board for an armor fabricator.
  components:
  - type: Sprite
    state: security
  - type: MachineBoard
    prototype: NCArmorFabricator
    stackRequirements:
      Manipulator: 4
