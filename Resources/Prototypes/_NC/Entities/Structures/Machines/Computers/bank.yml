- type: entity
  parent: BaseComputer
  id: NCATM
  components:
  - type: NCAtm
  - type: Sprite
    sprite: _NC/Structures/Machines/Bank/atm.rsi
    layers:
    - map: [ "computerLayerBody" ]
      state: atm
    - map: [ "computerLayerScreen" ]
      state: atm-screen
    - map: [ "computerLayerKeys" ]
      state: atm-keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: atm-panel
  - type: PointLight
    color: "#3FF0FF"
  - type: NCNeonEmission
    size: 1, 0.9
    offset: 0, -0.6
    intensity: 0.35
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      board: !type:Container
      nc_bank_cash: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.NCBankUiKey.Atm
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.NCBankUiKey.Atm:
        type: NCAtmBoundUserInterface

- type: entity
  abstract: true
  parent: BaseComputer
  id: NCBankTerminalBase
  components:
  - type: Sprite
    layers:
    - map: [ "computerLayerBody" ]
      state: computer
    - map: [ "computerLayerKeyboard" ]
      state: generic_keyboard
    - map: [ "computerLayerScreen" ]
      sprite: _NC/Structures/Machines/Bank/finance_terminal.rsi
      state: finance
    - map: [ "computerLayerKeys" ]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    color: "#FFB21F"
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      board: !type:Container
      nc_bank_cash: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.NCBankUiKey.Terminal
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.NCBankUiKey.Terminal:
        type: NCBankTerminalBoundUserInterface

- type: entity
  parent: NCBankTerminalBase
  id: NCBankTerminalNCPD
  suffix: NCPD
  components:
  - type: NCBankTerminal
    department: NCPD

- type: entity
