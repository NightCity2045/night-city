- type: entity
  parent: BaseComputerAiAccess
  id: NCComputerOrganizationBudgetBase
  abstract: true
  components:
  - type: UserInterface
    interfaces:
      enum.NCOrganizationBudgetConsoleUiKey.Key:
        type: NCOrganizationBudgetConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ActivatableUI
    key: enum.NCOrganizationBudgetConsoleUiKey.Key
    singleUser: true
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: command
    - map: ["computerLayerKeys"]
      state: security_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 4.0

- type: entity
  parent: NCComputerOrganizationBudgetBase
  id: NCComputerNCPDBudget
  name: NCPD budget console
  description: A secured terminal for managing the persistent NCPD budget.
  components:
  - type: NCOrganizationBudgetConsole
    department: NCPD
  - type: PointLight
    color: "#4777C8"
  - type: Computer
    board: NCNCPDBudgetComputerCircuitboard
  - type: AccessReader
    access: [[NCPD_Command]]

- type: entity
  parent: BaseComputerCircuitboard
  id: NCNCPDBudgetComputerCircuitboard
  name: NCPD budget console board
  description: A computer board for an NCPD budget console.
  components:
  - type: Sprite
    state: cpu_command
  - type: ComputerBoard
    prototype: NCComputerNCPDBudget

