    shopId: retail-auto-store
    halfExtents: 2.5, 4
  - type: Sprite
    state: blue
    color: "#5FA8FF"

# These attendants are presentation-only physical fixtures. They have no AI, mind or Living City actor binding.
- type: entity
  parent: MobHumanBase
  id: NCShopkeeperDisplayBase
  abstract: true
  suffix: Static, Invulnerable
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: Godmode
  - type: Physics
    bodyType: Static

