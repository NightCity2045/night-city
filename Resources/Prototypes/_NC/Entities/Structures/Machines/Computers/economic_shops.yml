- type: entity
  parent: BaseComputer
  id: NCComputerEconomicShopBase
  abstract: true
  components:
  - type: UserInterface
    interfaces:
      enum.NCEconomicShopUiKey.Key:
        type: NCEconomicShopBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ActivatableUI
    key: enum.NCEconomicShopUiKey.Key
    singleUser: true
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: service
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open

# Preserve the original economic-system test storefront for maps and admin workflows that already use its ID.
- type: entity
  parent: NCComputerEconomicShopBase
  id: NCComputerStreetMedicalShop
  name: street medical storefront
  description: A hardwired storefront connected to a finite Night City stock ledger.
  components:
  - type: NCEconomicShop
    shopId: street-medical-demo
    displayName: Kabuki Street Medical
    sellerOrganizationId: kabuki-street-medical
    semanticLocationKey: city.shop.kabuki-street-medical
    maximumListings: 100
    initialCommodities:
    - commodity: NCCommodityTraumaAnalgesic
      quantity: 500
    - commodity: NCCommoditySyntheticOxygenCarrier
      quantity: 300
    initialItems:
    - definition: NCItemCyberwareNeuralLinkMk1
      quantity: 4
    - definition: NCItemWeaponBudgetPistolMk1
      quantity: 3
  - type: PointLight
    color: "#4DD0A7"

# Every storefront owns a finite persistent stock node. Stable shop IDs keep bootstrap idempotent across map reloads.
- type: entity
  parent: NCComputerEconomicShopBase
  id: NCComputerGunStore
  name: gun store catalog terminal
  description: A licensed terminal for pistols, ammunition and light civilian armor.
  components:
  - type: NCEconomicShop
    shopId: retail-gun-store
    displayName: nc-economic-shop-name-gun-store
    sellerOrganizationId: night-city-retail-gun-store
    semanticLocationKey: city.shop.gun-store
    maximumListings: 256
    catalog: NCShopCatalogGun
    initialItems:
    - definition: NCItemWeaponBudgetPistolMk1
      quantity: 12
    - definition: NCItemWeaponViperPistol
      quantity: 6
    - definition: NCItemPistolMagazine
      quantity: 40
    - definition: NCItemLightArmorVest
      quantity: 10
  - type: PointLight
    color: "#D86464"

