- type: entity
  parent: BaseComputerAiAccess
  id: NCComputerPersonnelBase
  abstract: true
  components:
  - type: UserInterface
    interfaces:
      enum.NCPersonnelConsoleUiKey.Key:
        type: NCPersonnelConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ActivatableUI
    key: enum.NCPersonnelConsoleUiKey.Key
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: id
    - map: ["computerLayerKeys"]
      state: security_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 4.0

- type: entity
  parent: NCComputerPersonnelBase
  id: NCComputerNCPDPersonnel
  name: NCPD personnel console
  description: A secured terminal for persistent NCPD personnel decisions.
  components:
  - type: NCPersonnelConsole
    department: NCPD
  - type: PointLight
    color: "#4777C8"
  - type: Computer
    board: NCNCPDPersonnelComputerCircuitboard
  - type: AccessReader
    access: [[NCPD_Command]]

- type: entity
  parent: BaseComputerCircuitboard
  id: NCNCPDPersonnelComputerCircuitboard
  name: NCPD personnel console board
  description: A computer board for an NCPD personnel console.
  components:
  - type: Sprite
    state: cpu_command
  - type: ComputerBoard
    prototype: NCComputerNCPDPersonnel

