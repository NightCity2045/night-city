# Shop vending machines: buy with the money on your bank account. Big goods appear at the nearest pickup point.
- type: entity
  abstract: true
  parent: BaseStructure
  id: NCShopVendomatBase
  components:
  - type: Sprite
    layers:
    - state: off
    - state: normal-unshaded
      shader: unshaded
  - type: InteractionOutline
  - type: ActivatableUI
    key: enum.NCShopUiKey.Key
  - type: UserInterface
    interfaces:
      enum.NCShopUiKey.Key:
        type: NCShopBoundUserInterface
  - type: PointLight
    radius: 1.5
    energy: 1.6

- type: entity
  parent: MarkerBase
  id: NCShopPickupPoint
  components:
  - type: Sprite
    sprite: _NC/Markers/shop_pickup.rsi
    state: pickup
  - type: NCShopPickupPoint

- type: entity
  parent: NCShopVendomatBase
  id: NCShopFurnitureVendomat
  components:
  - type: Sprite
    sprite: _NC/Structures/Machines/Shops/furniture.rsi
  - type: PointLight
    color: "#FFB21F"
  - type: NCShop
    catalog: NCShopFurniture

- type: entity
  parent: NCShopVendomatBase
  id: NCShopClothingVendomat
