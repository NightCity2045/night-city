# Prints every Night City firearm together with its magazines and ammunition boxes.
- type: entity
  parent: BaseLatheLube
  id: NCWeaponFabricator
  name: weapon fabricator
  description: Prints Night City firearms, their magazines and ammunition.
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: sec
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    idleState: icon
    runningState: icon
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - NCWeaponsStatic
    - NCAmmoStatic
  - type: Machine
    board: NCWeaponFabricatorMachineCircuitboard
  - type: OreSiloClient

- type: entity
  parent: BaseMachineCircuitboard
  id: NCWeaponFabricatorMachineCircuitboard
  name: weapon fabricator machine board
  description: A machine printed circuit board for a weapon fabricator.
  components:
  - type: Sprite
    state: security
  - type: MachineBoard
    prototype: NCWeaponFabricator
    stackRequirements:
      Manipulator: 4
