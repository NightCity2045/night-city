# Pawn buyers: hold an item (or a bag of them) and sell for cash on the counter. Each buyer pays its own share of
# the street value; every sale is written into the round log the NCPD records console can read.
- type: entity
  abstract: true
  parent: BaseStructure
  id: NCPawnShopBase
  components:
  - type: Sprite
    layers:
    - state: off
    - state: normal-unshaded
      shader: unshaded
  - type: InteractionOutline
  - type: ActivatableUI
    key: enum.NCPawnUiKey.Key
  - type: UserInterface
    interfaces:
      enum.NCPawnUiKey.Key:
        type: NCPawnShopBoundUserInterface
  - type: PointLight
    radius: 1.5
    energy: 1.6

- type: entity
  parent: NCPawnShopBase
  id: NCPawnShopGoldenEddie
  name: Golden Eddie pawnshop
  description: A licensed pawnbroker. Takes anything, pays little, keeps tidy books for the NCPD.
  components:
  - type: Sprite
    sprite: _NC/Structures/Machines/Pawn/golden_eddie.rsi
  - type: PointLight
    color: "#FFB21F"
  - type: NCPawnShop
    name: nc-pawn-shop-golden-eddie
    payout: 0.35

- type: entity
  parent: NCPawnShopBase
  id: NCPawnShopSecondChance
  name: Second Chance buyback
  description: A buyback kiosk. Fair-ish prices, no questions asked out loud.
  components:
  - type: Sprite
    sprite: _NC/Structures/Machines/Pawn/second_chance.rsi
  - type: PointLight
    color: "#3FF0FF"
  - type: NCPawnShop
    name: nc-pawn-shop-second-chance
    payout: 0.5

- type: entity
  parent: NCPawnShopBase
  id: NCPawnShopFence
  name: back-alley fence
  description: A battered machine in a bad part of town. The best prices in the city, if you live to collect.
  components:
  - type: Sprite
    sprite: _NC/Structures/Machines/Pawn/fence.rsi
  - type: PointLight
    color: "#FF3A3A"
  - type: NCPawnShop
    name: nc-pawn-shop-fence
    payout: 0.65
