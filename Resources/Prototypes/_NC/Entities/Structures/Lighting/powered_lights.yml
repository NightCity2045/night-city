# Palette from the Night City lighting reference.

- type: entity
  parent: Poweredlight
  id: NCPoweredlightPaleCyan
  suffix: NC, Pale Cyan
  components:
  - type: PoweredLight
    hasLampOnSpawn: NCLightTubePaleCyan
  - type: PointLight
    color: "#C3FFFF"
  - type: Sprite
    layers:
    - map: ["enum.PoweredLightLayers.Base"]
      state: base
    - map: ["enum.PoweredLightLayers.Glow"]
      state: glow
      shader: unshaded
      color: "#C3FFFF"

