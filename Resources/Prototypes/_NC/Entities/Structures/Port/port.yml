# Double mooring bollard for the pier edge.
- type: entity
  parent: NCPortStructureBase
  id: NCPortBollard
  components:
  - type: Sprite
    sprite: _NC/Structures/Port/bollard.rsi
    state: bollard
  - type: Icon
    sprite: _NC/Structures/Port/bollard.rsi
    state: bollard
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.2,0.35,0.15"
        density: 500
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

# Container gantry crane, 5 x 5 tiles centred on its tile. Only the four legs collide;
# the girders, trolley and cab are drawn over everyone walking underneath.
- type: entity
  parent: NCPortStructureBase
  id: NCPortGantryCrane
  components:
  - type: Sprite
    sprite: _NC/Structures/Port/gantry_crane.rsi
    drawdepth: Overdoors
    layers:
    - state: legs
    - state: top
    - state: lamp-unshaded
      shader: unshaded
  - type: Icon
    sprite: _NC/Structures/Port/gantry_crane.rsi
    state: top
  - type: Fixtures
    fixtures:
      legSouthWest:
        shape:
          !type:PhysShapeAabb
          bounds: "-2.35,-2.35,-1.8,-1.8"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - HighImpassable
      legSouthEast:
        shape:
          !type:PhysShapeAabb
          bounds: "1.8,-2.35,2.35,-1.8"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - HighImpassable
      legNorthWest:
        shape:
          !type:PhysShapeAabb
          bounds: "-2.35,1.8,-1.8,2.35"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - HighImpassable
      legNorthEast:
        shape:
          !type:PhysShapeAabb
          bounds: "1.8,1.8,2.35,2.35"
        density: 1000
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - HighImpassable
  - type: PointLight
    radius: 2
    energy: 1.2
    color: "#ff8a1f"
    offset: "0.42,1.7"
