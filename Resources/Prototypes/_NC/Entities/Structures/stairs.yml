# Entering a stair tile transfers the body directly to the adjacent Z-level.
- type: entity
  id: NCStairsUp
  parent: Stairs
  name: stairs up
  description: Stairs leading to the Z-level above.
  components:
  - type: NCZStairTransition
    levelOffset: 1

- type: entity
  id: NCStairsDown
  parent: Stairs
  name: stairs down
  description: Stairs leading to the Z-level below.
  components:
  - type: NCZStairTransition
    levelOffset: -1
