# Z-level stairs use the entity rotation as their uphill direction.
- type: entity
  id: NCStairsUp
  parent: Stairs
  name: stairs up
  description: Stairs leading to the Z-level above.
  components:
  - type: NCZLevelHighGround
    heightCurve:
    - 0
    - 1
    stick: true

- type: entity
  id: NCStairsDown
  parent: Stairs
  name: stairs down
  description: Stairs leading to the Z-level below.
  components:
  - type: NCZLevelHighGround
    heightCurve:
    - 1
    - 0
    stick: true
