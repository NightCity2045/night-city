# Rentable properties. A marker inside the premises gives its id, name and hourly rent; the floor and the doors
# are found from the walls. Put several markers with the same id to join rooms the fill would not reach.
- type: entity
  parent: MarkerBase
  id: NCPropertyMarker
  suffix: Property
  components:
  - type: Sprite
    sprite: _NC/Markers/property_marker.rsi
    state: property
  - type: NCPropertyMarker

- type: entity
  parent: BaseComputer
  id: NCRealEstateTerminal
  components:
  - type: NCRealEstateTerminal
  - type: Sprite
    layers:
    - map: [ "computerLayerBody" ]
      state: computer
    - map: [ "computerLayerKeyboard" ]
      state: generic_keyboard
    - map: [ "computerLayerScreen" ]
      sprite: _NC/Structures/Machines/RealEstate/real_estate_terminal.rsi
      state: realestate
    - map: [ "computerLayerKeys" ]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 3.0
    color: "#3FF0FF"
  - type: ActivatableUI
    key: enum.NCRealEstateUiKey.Key
  - type: UserInterface
    interfaces:
      enum.NCRealEstateUiKey.Key:
        type: NCRealEstateBoundUserInterface

# Issued by the agency, one per door. The agency names it after the property and the door.
- type: entity
  parent: BaseItem
  id: NCPropertyKeyCard
  components:
  - type: Sprite
    sprite: _NC/Objects/Housing/key_card.rsi
    state: icon
  - type: Item
    size: Tiny
    sprite: Objects/Misc/id_cards.rsi
    heldPrefix: default
  - type: NCPropertyCard
  - type: StaticPrice
    price: 0
