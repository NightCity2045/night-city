# Apply this mixin only to ballistic vests and rigid chestpieces. Coats and full-body suits remain outer clothing.
- type: entity
  abstract: true
  id: NCClothingArmorSlotBase
  components:
  - type: Clothing
    slots: [ armor ]
  # Flexible armor restricts sprinting more than ordinary movement.
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.90
