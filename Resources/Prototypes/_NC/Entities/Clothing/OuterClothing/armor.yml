- type: entity
  parent: [ ClothingOuterArmorBase, NCClothingArmorSlotBase ]
  id: ClothingOuterArmorBiotechBulletproof
  name: BioTechnica bulletproof vest
  description: A bulletproof armored vest customized for BioTechnica tactical security units.
  components:
  - type: Sprite
    sprite: _NC/Clothing/OuterClothing/Armor/biotech_bulletproof.rsi
  - type: Clothing
    sprite: _NC/Clothing/OuterClothing/Armor/biotech_bulletproof.rsi
    slots: [ armor ]
  - type: ClothingSpeedModifier
    walkModifier: 0.90
    sprintModifier: 0.80
  - type: NCArmor
    profile: NCArmorPlateCarrier

