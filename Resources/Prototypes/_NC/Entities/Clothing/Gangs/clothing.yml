# Gang wear: recoloured SS14 shapes with a glowing (unshaded) trim layer.

- type: entity
  parent: ClothingOuterBase
  id: NCGangTygerClawsOuter
  components:
  - type: Sprite
    sprite: _NC/Clothing/OuterClothing/Gangs/tyger_claws_jacket.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Clothing
    sprite: _NC/Clothing/OuterClothing/Gangs/tyger_claws_jacket.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      - state: equipped-OUTERCLOTHING-unshaded
        shader: unshaded

- type: entity
  parent: ClothingMaskBase
  id: NCGangTygerClawsMask
  components:
  - type: Sprite
    sprite: _NC/Clothing/Mask/Gangs/tyger_claws_mask.rsi
    state: icon
  - type: Clothing
    sprite: _NC/Clothing/Mask/Gangs/tyger_claws_mask.rsi
    clothingVisuals:
      mask:
      - state: equipped-MASK
      - state: equipped-MASK-unshaded
        shader: unshaded

