# Gang wear, one set per gang split over the NC slots: top (jumpsuit), pants, armor vest, jacket and mask.
# Only Maelstrom (red optics) and Tyger Claws (Japantown neon) wear glowing pieces: their sets carry a flickering
# unshaded layer. The other gangs' accents are painted into the base sprite.

- type: entity
  parent: ClothingOuterBase
  id: NCGangTygerClawsJacket
  components:
  - type: Sprite
    sprite: _NC/Clothing/Gangs/TygerClaws/jacket.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Clothing
    sprite: _NC/Clothing/Gangs/TygerClaws/jacket.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      - state: equipped-OUTERCLOTHING-unshaded
        shader: unshaded

- type: entity
  parent: UnsensoredClothingUniformBase
  id: NCGangTygerClawsTop
  components:
  - type: Sprite
    sprite: _NC/Clothing/Gangs/TygerClaws/top.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Clothing
    sprite: _NC/Clothing/Gangs/TygerClaws/top.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
      - state: equipped-INNERCLOTHING-unshaded
        shader: unshaded

- type: entity
  parent: UnsensoredClothingUniformBase
  id: NCGangTygerClawsPants
  components:
  - type: Sprite
    sprite: _NC/Clothing/Gangs/TygerClaws/pants.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Clothing
    sprite: _NC/Clothing/Gangs/TygerClaws/pants.rsi
    clothingVisuals:
      pants:
      - state: equipped-LEGS
      - state: equipped-LEGS-unshaded
        shader: unshaded
    slots:
    - legs

- type: entity
  parent:
  - ClothingOuterArmorBase
  - NCClothingArmorSlotBase
  id: NCGangTygerClawsVest
  components:
  - type: Sprite
    sprite: _NC/Clothing/Gangs/TygerClaws/vest.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Clothing
    sprite: _NC/Clothing/Gangs/TygerClaws/vest.rsi
    clothingVisuals:
      armor:
      - state: equipped-OUTERCLOTHING
      - state: equipped-OUTERCLOTHING-unshaded
        shader: unshaded
    slots:
    - armor
  - type: NCArmor
    profile: NCArmorLightArmorjack

- type: entity
  parent: ClothingMaskBase
  id: NCGangTygerClawsMask
  components:
  - type: Sprite
    sprite: _NC/Clothing/Gangs/TygerClaws/mask.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Clothing
