# Player-controlled event bodies. RandomHumanoidAppearance assigns a random human
# appearance and name when the body is spawned; no NPC or ghost-role logic is added.
- type: entity
  abstract: true
  parent: MobHuman
  id: NCEventArasakaMilitechPuppetBase
  components:
  - type: RandomHumanoidAppearance

# Militech defenders
- type: entity
  parent: NCEventArasakaMilitechPuppetBase
  id: NCEventMilitechCommander
  name: Militech detachment commander
  description: The officer responsible for securing the recovered technology.
  components:
  - type: Loadout
    prototypes: [ NCEventMilitechCommanderGear ]

- type: entity
  parent: NCEventArasakaMilitechPuppetBase
  id: NCEventMilitechOperative
  name: Militech operative
  description: A corporate infantry operative assigned to defend the local base.
  components:
  - type: Loadout
    prototypes: [ NCEventMilitechOperativeGear ]

- type: entity
  parent: NCEventArasakaMilitechPuppetBase
  id: NCEventMilitechBreacher
  name: Militech breacher
  description: A close-quarters specialist guarding the recovered technology.
  components:
  - type: Loadout
    prototypes: [ NCEventMilitechBreacherGear ]

- type: entity
  parent: NCEventArasakaMilitechPuppetBase
  id: NCEventMilitechCombatMedic
  name: Militech combat medic
  description: A combat medic assigned to keep the Militech detachment alive.
  components:
  - type: Loadout
    prototypes: [ NCEventMilitechCombatMedicGear ]

- type: entity
  parent: NCEventArasakaMilitechPuppetBase
  id: NCEventMilitechTechnician
  name: Militech field technician
  description: A field technician responsible for the base and the recovered technology.
  components:
  - type: Loadout
    prototypes: [ NCEventMilitechTechnicianGear ]

# Arasaka-funded proxy force. Neutral clothing preserves plausible deniability.
- type: entity
  parent: NCEventArasakaMilitechPuppetBase
  id: NCEventProxySquadLeader
  name: proxy security squad leader
  description: The leader of a deniable security team hired to steal the technology.
  components:
  - type: Loadout
    prototypes: [ NCEventProxySquadLeaderGear ]

- type: entity
  parent: NCEventArasakaMilitechPuppetBase
  id: NCEventProxyAssault
  name: proxy security assault operative
  description: A rifleman from a deniable security company.
  components:
  - type: Loadout
    prototypes: [ NCEventProxyAssaultGear ]

- type: entity
  parent: NCEventArasakaMilitechPuppetBase
  id: NCEventProxyBreacher
  name: proxy security breacher
  description: A close-quarters specialist from a deniable security company.
  components:
  - type: Loadout
    prototypes: [ NCEventProxyBreacherGear ]

- type: entity
  parent: NCEventArasakaMilitechPuppetBase
  id: NCEventProxyMarksman
  name: proxy security marksman
  description: A precision shooter covering the attempt to steal the technology.
  components:
  - type: Loadout
    prototypes: [ NCEventProxyMarksmanGear ]

- type: entity
  parent: NCEventArasakaMilitechPuppetBase
  id: NCEventProxyFieldMedic
  name: proxy security field medic
  description: A field medic attached to a deniable security team.
  components:
  - type: Loadout
    prototypes: [ NCEventProxyFieldMedicGear ]

