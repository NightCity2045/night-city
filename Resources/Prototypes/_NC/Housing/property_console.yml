- type: entity
  parent: BaseComputer
  id: NCPropertyConsole
  name: real-estate terminal
  description: A public terminal for renting furnished Night City apartments.
  components:
  - type: NCPropertyConsole
    pageSize: 20
    maximumSearchLength: 64
  - type: UserInterface
    interfaces:
      enum.NCPropertyConsoleUiKey.Key:
        type: NCPropertyConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ActivatableUI
    key: enum.NCPropertyConsoleUiKey.Key
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: id
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 3.0
    color: "#D3A54F"
  - type: Computer
    board: NCPropertyConsoleCircuitboard

- type: entity
  parent: BaseComputerCircuitboard
  id: NCPropertyConsoleCircuitboard
  name: real-estate terminal board
  description: A computer board for a Night City real-estate terminal.
  components:
  - type: Sprite
    state: cpu_supply
  - type: ComputerBoard
    prototype: NCPropertyConsole
