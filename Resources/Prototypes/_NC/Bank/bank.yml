- type: ncBankConfiguration
  id: Default
  startingBalance: 500
  accountPrefix: NC
  pinDigits: 4
  paydayIntervalSeconds: 1800
  currencyStack: Credit

- type: entity
  id: NCATM
  name: ent-NCATM
  description: ent-NCATM-desc
  parent: BaseComputer
  components:
  - type: NCAtm
    taxRate: 0.1
    maximumTransaction: 100000
  - type: ActivatableUI
    key: enum.NCAtmUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.NCAtmUiKey.Key:
        type: NCAtmBoundUserInterface
