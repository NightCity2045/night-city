# Fee rates are in basis points: 4000 = 40%. Admins change rates and the department managers change salaries in
# game; those changes are stored in the database and override the values here.
- type: ncBankConfiguration
  id: Default
  paydayInterval: 1800
  residentFeeBasisPoints: 4000
  characterOpeningBalance: 1000
  characterOpeningCash: 200

- type: ncBankDepartment
  id: NCPD
  department: NCPD
  managers: [ NCPDChief ]
  feeBasisPoints: 2000
  openingBalance: 50000
  salaries:
    NCPDChief: 800
    NCPDCommander: 500
    NCPDLieutenant: 500
    NCPDInspector: 350
    NCPDSergeant: 350
    NCPDOfficer: 250
    NCPDCadet: 100

