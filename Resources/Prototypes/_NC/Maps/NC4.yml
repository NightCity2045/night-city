- type: gameMap
  id: NC4ver
  mapName: NC4
  mapPath: /Maps/_NC/NC4/NC40.yml
  minPlayers: 0
  stations:
    Empty:
      stationProto: StandardStationArena
      components:
      - type: StationNameSetup
        mapNameTemplate: "NC4"
      - type: StationJobs
        availableJobs: # NC: vanilla roles; NC organizations and employment were removed.
          #Command (7)
          Captain: [ 1, 1 ]
          HeadOfPersonnel: [ 1, 1 ]
          HeadOfSecurity: [ 1, 1 ]
          ChiefMedicalOfficer: [ 1, 1 ]
          ChiefEngineer: [ 1, 1 ]
          ResearchDirector: [ 1, 1 ]
          Quartermaster: [ 1, 1 ]
          #Service (14)
          Bartender: [ 2, 2 ]
          Botanist: [ 3, 3 ]
          Chef: [ 2, 2 ]
          Janitor: [ 2, 2 ]
          Chaplain: [ 1, 1 ]
          Librarian: [ 1, 1 ]
          Reporter: [ 1, 1 ]
          ServiceWorker: [ 2, 2 ]
          #Engineering (8)
          AtmosphericTechnician: [ 3, 3 ]
          StationEngineer: [ 5, 5 ]
          TechnicalAssistant: [ 4, 4 ] #intern, exclude from dept count
          #Medical (8)
          Chemist: [ 2, 2 ]
          MedicalDoctor: [ 4, 4 ]
          Paramedic: [ 1, 1 ]
          MedicalIntern: [ 4, 4 ] #intern, exclude from dept count
          Psychologist: [ 1, 1 ]
          #Science (5)
          Scientist: [ 5, 5 ]
          ResearchAssistant: [ 4, 4 ] #intern, exclude from dept count
          #Security (9 - 11)
          Warden: [ 1, 1 ]
          SecurityOfficer: [ 5, 7 ]
          Detective: [ 1, 1 ]
          SecurityCadet: [ 2, 4 ] #intern, exclude from dept count
          Lawyer: [ 2, 2 ]
          #Supply (6)
          SalvageSpecialist: [ 3, 3 ]
          CargoTechnician: [ 3, 3 ]
          #Civilian (3+)
          Passenger: [ -1, -1 ] #infinite, not counted
          Clown: [ 1, 1 ]
          Mime: [ 1, 1 ]
          Musician: [ 1, 1 ]
      - type: NCStationZLevels
        networkId: f7466602-81be-4ad9-9338-9c181a31e552
        mapsAbove:
          - /Maps/_NC/NC4/NC41.yml
          - /Maps/_NC/NC4/NC42.yml
          - /Maps/_NC/NC4/NC43.yml
          - /Maps/_NC/NC4/NC44.yml
        mapsBelow:
          - /Maps/_NC/NC4/NC4-4.yml
          - /Maps/_NC/NC4/NC4-3.yml
          - /Maps/_NC/NC4/NC4-2.yml
          - /Maps/_NC/NC4/NC4-1.yml
        zLevelsComponentOverrides:
        # All nine Night City levels share infinite breathable air without pressure or gas simulation.
        - type: MapAtmosphere
          space: false
          mixture:
            volume: 2500
            immutable: true
            temperature: 293.15
            moles:
              Oxygen: 21.824879
              Nitrogen: 82.10312
        - type: NCUniformAir
        - type: MapLight
          ambientLightColor: "#D8B059FF"
        - type: NCDayNightCycle
          minimumDepth: 0
          roundStartHour: 8
          duration: 60m
          minLightLevel: 0.3
          maxLightLevel: 3
          clipLight: 1.25
          clipLevel: "#FFFFFF"
          minLevel: "#1A2680"
          maxLevel: "#FFFFFF"
        - type: NCZLevelRoof
        - type: Gravity
          enabled: true
        - type: NCAutoGridGravity
