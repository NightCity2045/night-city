- type: gameMap
  id: NC4ver
  mapName: NC4
  mapPath: /Maps/_NC/NC4/NC40.yml
  minPlayers: 0
  stations:
    Empty:
      stationProto: StandardStationArena
      components:
      - type: StationNameSetup
        mapNameTemplate: "NC4"
      - type: StationJobs
        availableJobs: # NC: Night City organizations; residents are Passenger.
          #NCPD
          NCPDChief: [ 1, 1 ]
          NCPDCommander: [ 2, 2 ]
          NCPDLieutenant: [ 4, 4 ]
          NCPDInspector: [ 6, 6 ]
          NCPDSergeant: [ 8, 8 ]
          NCPDOfficer: [ 20, 20 ]
          NCPDCadet: [ 20, 20 ]
          #MedCenter
          NCMedicalChief: [ 1, 1 ]
          NCMedicalDoctor: [ 12, 12 ]
          NCMedicalCoroner: [ 4, 4 ]
          NCMedicalPsychologist: [ 4, 4 ]
          NCMedicalTechnician: [ 6, 6 ]
          NCMedicalIntern: [ 12, 12 ]
          #Trauma Team
          TraumaTeamOperative: [ 10, 10 ]
          TraumaTeamParamedic: [ 20, 20 ]
          #Militech
          MilitechChief: [ 1, 1 ]
          MilitechOperativeLead: [ 4, 4 ]
          MilitechOperative: [ 20, 20 ]
          MilitechSecuritySpecialist: [ 12, 12 ]
          MilitechNetrunner: [ 6, 6 ]
          MilitechRigger: [ 8, 8 ]
          MilitechCombatMedic: [ 8, 8 ]
          MilitechTech: [ 8, 8 ]
          MilitechQuartermaster: [ 6, 6 ]
          #Biotechnica
          BiotechnicaChief: [ 1, 1 ]
          BiotechnicaOperativeLead: [ 4, 4 ]
          BiotechnicaOperative: [ 12, 12 ]
          BiotechnicaNetrunner: [ 6, 6 ]
          BiotechnicaRigger: [ 8, 8 ]
          BiotechnicaMedTech: [ 8, 8 ]
          BiotechnicaParamedic: [ 8, 8 ]
          BiotechnicaTech: [ 8, 8 ]
          BiotechnicaBotanist: [ 12, 12 ]
          #Zhirafa
          ZhirafaJanitor: [ 12, 12 ]
          #Residents
          Passenger: [ -1, -1 ] #infinite
      - type: NCStationZLevels
        networkId: f7466602-81be-4ad9-9338-9c181a31e552
        mapsAbove:
          - /Maps/_NC/NC4/NC41.yml
          - /Maps/_NC/NC4/NC42.yml
          - /Maps/_NC/NC4/NC43.yml
          - /Maps/_NC/NC4/NC44.yml
        mapsBelow:
          - /Maps/_NC/NC4/NC4-4.yml
          - /Maps/_NC/NC4/NC4-3.yml
          - /Maps/_NC/NC4/NC4-2.yml
          - /Maps/_NC/NC4/NC4-1.yml
        zLevelsComponentOverrides:
        # All nine Night City levels share infinite breathable air without pressure or gas simulation.
        - type: MapAtmosphere
          space: false
          mixture:
            volume: 2500
            immutable: true
            temperature: 293.15
            moles:
              Oxygen: 21.824879
              Nitrogen: 82.10312
        - type: NCUniformAir
        - type: MapLight
          ambientLightColor: "#D8B059FF"
        - type: NCDayNightCycle
          minimumDepth: 0
          roundStartHour: 8
          duration: 60m
          minLightLevel: 0.3
          maxLightLevel: 3
          clipLight: 1.25
          clipLevel: "#FFFFFF"
          minLevel: "#1A2680"
          maxLevel: "#FFFFFF"
        - type: NCZLevelRoof
        - type: Gravity
          enabled: true
        - type: NCAutoGridGravity
