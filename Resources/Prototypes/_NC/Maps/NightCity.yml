- type: gameMapPool
  id: NCNightCityMapPool
  maps:
  - NCALifeTest

- type: gameMap
  id: NCALifeTest
  mapName: NC ALife Test
  mapPath: /Maps/_NC/NightCity/NightCity0.yml
  minPlayers: 0
  stations:
    Empty:
      stationProto: StandardStationArena
      components:
      - type: StationNameSetup
        mapNameTemplate: "NC ALife Test"
      - type: StationJobs
        availableJobs:
          Passenger: [ -1, -1 ]
      - type: NCStationZLevels
        networkId: f7466602-81be-4ad9-9338-9c181a31e552
        mapsAbove:
          - /Maps/_NC/NightCity/NightCity1.yml
          - /Maps/_NC/NightCity/NightCity2.yml
          - /Maps/_NC/NightCity/NightCity3.yml
          - /Maps/_NC/NightCity/NightCity4.yml
        mapsBelow:
          - /Maps/_NC/NightCity/NightCity-4.yml
          - /Maps/_NC/NightCity/NightCity-3.yml
          - /Maps/_NC/NightCity/NightCity-2.yml
          - /Maps/_NC/NightCity/NightCity-1.yml
        zLevelsComponentOverrides:
        # All nine Night City levels share infinite breathable air without pressure or gas simulation.
        - type: MapAtmosphere
          space: false
          mixture:
            volume: 2500
            immutable: true
            temperature: 293.15
            moles:
              Oxygen: 21.824879
              Nitrogen: 82.10312
        - type: NCUniformAir
        # All devices on every Night City level operate independently of APC networks.
        - type: AlwaysPowered
        - type: MapLight
          ambientLightColor: "#D8B059FF"
        - type: NCDayNightCycle
          minimumDepth: 0
          roundStartHour: 8
          duration: 60m
          minLightLevel: 0.3
          maxLightLevel: 3
          clipLight: 1.25
          clipLevel: "#FFFFFF"
          minLevel: "#1A2680"
          maxLevel: "#FFFFFF"
        - type: NCZLevelRoof
        - type: Gravity
          enabled: true
        - type: NCAutoGridGravity
