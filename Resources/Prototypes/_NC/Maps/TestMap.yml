- type: gameMap
  id: NCGameTest
  mapName: Game Testing Map
  mapPath: /Maps/_NC/GameTestingMap/GameTestingMap0.yml
  minPlayers: 0
  stations:
    Empty:
      stationProto: StandardStationArena
      components:
      - type: StationNameSetup
        mapNameTemplate: "Game Testing Map"
      - type: StationJobs
        availableJobs:
          Passenger: [ -1, -1 ]
      - type: NCStationZLevels
        networkId: f7466602-81be-4ad9-9338-9c181a31e552
        mapsAbove:
          - /Maps/_NC/GameTestingMap/GameTestingMap1.yml
          - /Maps/_NC/GameTestingMap/GameTestingMap2.yml
          - /Maps/_NC/GameTestingMap/GameTestingMap3.yml
          - /Maps/_NC/GameTestingMap/GameTestingMap4.yml
        mapsBelow:
          - /Maps/_NC/GameTestingMap/GameTestingMap-4.yml
          - /Maps/_NC/GameTestingMap/GameTestingMap-3.yml
          - /Maps/_NC/GameTestingMap/GameTestingMap-2.yml
          - /Maps/_NC/GameTestingMap/GameTestingMap-1.yml
        zLevelsComponentOverrides:
        # All nine Night City levels share infinite breathable air without pressure or gas simulation.
        - type: MapAtmosphere
          space: false
          mixture:
            volume: 2500
            immutable: true
            temperature: 293.15
            moles:
              Oxygen: 21.824879
              Nitrogen: 82.10312
        - type: NCUniformAir
        - type: MapLight
          ambientLightColor: "#D8B059FF"
        - type: NCZLevelRoof
        - type: Gravity
          enabled: true
        - type: NCAutoGridGravity
