# Development-only map configuration for exercising station Z-level loading.
- type: gameMap
  id: NCZLevelsDev
  mapName: NC Z-Levels Dev
  mapPath: /Maps/Test/empty.yml
  minPlayers: 0
  stations:
    Empty:
      stationProto: StandardNanotrasenStation
      components:
      - type: StationNameSetup
        mapNameTemplate: "NC Z-Levels Dev"
      - type: StationJobs
        availableJobs:
          Passenger: [ -1, -1 ]
      - type: NCStationZLevels
        mapsBelow:
        - /Maps/Test/empty.yml
        mapsAbove:
        - /Maps/Test/empty.yml
        zLevelsComponentOverrides:
        - type: NCZLevelRoof
        - type: Gravity
          enabled: true
        - type: NCAutoGridGravity

# Mapping commands can use this prototype to create an isolated two-level network.
- type: zMap
  id: NCZLevelsEmptyTest
  maps:
  - /Maps/Test/empty.yml
  - /Maps/Test/empty.yml
  components:
  - type: NCZLevelRoof
  - type: Gravity
    enabled: true
  - type: NCAutoGridGravity
