- type: entity
  id: NCTemplateVerticalLinkMarker
  parent: MarkerBase
  name: template vertical link
  suffix: NC, Mapping
  components:
  - type: Sprite
    layers:
    - state: pink
  - type: NCTemplateVerticalLinkMarker
    linkId: LinkA
    targetLinkId: LinkB
    relativeZ: 0
    linkType: Stairs
    direction: Bidirectional
    required: true

- type: entity
  id: NCDungeonDynamicPointMarker
  parent: MarkerBase
  name: dungeon dynamic point
  suffix: NC, Mapping
  components:
  - type: Sprite
    layers:
    - state: red
  - type: NCDungeonDynamicPoint
    poolId: Default
    extractionPolicy: DeleteOnCleanup
