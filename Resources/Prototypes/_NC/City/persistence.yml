- type: ncPersistentOutboxPolicy
  id: NCDefaultPersistentOutboxPolicy
  fetchBatchSize: 16
  maximumConcurrentDeliveries: 8
  maximumAttempts: 8
  pollInterval: 0.25s
  initialRetryDelay: 1s
  maximumRetryDelay: 5m
  deliveryTimeout: 15s
  retryMultiplier: 2
