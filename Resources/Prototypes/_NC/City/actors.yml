- type: ncCityActorSummaryPolicy
  id: NCDefaultCityActorSummaryPolicy
  immobileMovementThreshold: 0.1
  impairedMovementThreshold: 0.75
  activeBleedingRateThreshold: 0.001
  failedCyberwareIntegrityRatio: 0.1
  degradedCyberwareIntegrityRatio: 0.75
  maximumInventoryItems: 512
  maximumContainerDepth: 8
  maximumCommodityBundles: 128

- type: ncCitySchedulePolicy
  id: NCDefaultCitySchedulePolicy
  snapshotPageSize: 250
  maximumDispatchesPerTick: 4
  maximumConcurrentMutations: 8
  mutationRetryDelay: 5s
  maximumMutationAttempts: 5
  initialEvaluationStagger: 25s
  reevaluateOnSessionStart: true

- type: ncCityCivilClockPolicy
  id: NCDefaultCityCivilClock
  civilDayDuration: 24h
  activeDayDuration: 2h
  initialTimeOfDay: 6h
  maximumManualAdvance: 24h

- type: ncCityPhysicalNavigationProfile
  id: NCDefaultPedestrianPhysicalNavigation
  interactWithDoors: true
  canClimb: false
  canPry: false
  canSmash: false

- type: ncCityPhysicalStateTree
  id: NCDefaultPhysicalStateTree
  maximumRules: 10
  blockedFallback: ReturnToPublicZone
  rules:
  - mode: Incapacitated
    priority: 900
    requiredAll: [ Incapacitated ]
    owner: None
    evaluationInterval: 1s
  - mode: Police
    priority: 800
    requiredAll: [ Detained ]
    owner: ExternalSystem
    evaluationInterval: 0.5s
  - mode: Scripted
    priority: 700
    requiredAll: [ ScriptedClaim ]
    owner: ExternalSystem
    evaluationInterval: 0.25s
  - mode: Medical
    priority: 600
    requiredAll: [ MedicalClaim ]
    owner: ExistingNpc
    evaluationInterval: 0.25s
  - mode: Police
    priority: 550
    requiredAll: [ PoliceClaim ]
    owner: ExistingNpc
    evaluationInterval: 0.25s
  - mode: Conversation
    priority: 500
    requiredAll: [ ConversationClaim ]
    owner: ExternalSystem
    evaluationInterval: 0.25s
  - mode: Combat
    priority: 450
    requiredAll: [ CombatActive ]
    owner: ExistingNpc
    evaluationInterval: 0.1s
  - mode: Combat
    priority: 400
    requiredAll: [ ThreatObserved ]
    owner: ExistingNpc
    evaluationInterval: 0.25s
  - mode: Traveling
    priority: 200
    requiredAll: [ TravelIntent ]
    owner: RouteExecutor
    evaluationInterval: 0.1s
  - mode: SafeIdle
    priority: 0
    owner: ExistingNpc
    evaluationInterval: 2s

- type: ncCityLocalPerceptionProfile
  id: NCDefaultLocalPerception
  radius: 10
  maximumObservedEntities: 32
  maximumLineOfSightChecks: 8
  # Active-world time runs twelve times faster than real time: 12s is one real second.
  evaluationInterval: 12s
  witnessedEventLifetime: 30s

- type: ncCityLocalPerceptionPolicy
  id: NCDefaultLocalPerceptionPolicy
  maximumUpdatesPerTick: 4
  maximumIncidentCorrelations: 1024

- type: ncHumanRoutineActivityPolicy
  id: NCDefaultHumanRoutineActivityPolicy
  maximumCatalogCandidates: 48
  arrivalRange: 1.25
  minimumDwellTime: 1m
  maximumDwellTime: 3m
  activities:
  - activity: prepare
    affordances: [BuildingExit, RestArea]
  - activity: work
    affordances: [Workplace, PublicEntrance]
    preferLivelihoodAffordance: true
  - activity: meal
    affordances: [RestArea, PublicEntrance]
  - activity: errands
    affordances: [PublicEntrance, RestArea]
  - activity: leisure
    affordances: [RestArea, PublicEntrance]
  - activity: socialize
    affordances: [RestArea, PublicEntrance]

- type: ncCityPhysicalExecutionPolicy
  id: NCDefaultCityPhysicalExecutionPolicy
  maximumQueuedIntentLoads: 256
  maximumIntentLoadsPerTick: 4
  maximumConcurrentIntentLoads: 8
  maximumExecutionUpdatesPerTick: 24
  maximumConcurrentMutations: 8
  maximumMutationAttempts: 5
  maximumWaypoints: 256
  maximumImmediateWaypointCompletions: 8
  maximumReplans: 4
  maximumTraceEntries: 64
  evaluationInterval: 0.1s
  intentLoadRetryDelay: 2s
  waypointTimeout: 20s
  portalTraversalTimeout: 8s
  portalInteractionRetryInterval: 0.5s
  replanBackoff: 1s
  minimumEquivalentReplanInterval: 2s
  topologyChangeCoalesceDelay: 0.25s
  blockedRetryInterval: 10s
  mutationRetryDelay: 2s
  htnResumeCooldown: 0.5s
  waypointReachRange: 0.4

- type: ncCityPopulationImportPolicy
  id: NCDefaultPopulationImportPolicy
  maximumActorsPerProfile: 10000
  maximumConcurrentCreates: 8
  storageRetryCount: 3
  storageRetryDelay: 1s

- type: ncCityZoneStatePolicy
  id: NCDefaultCityZoneStatePolicy
  snapshotPageSize: 250
  maximumWritesPerTick: 2
  maximumConcurrentWrites: 4
  coalesceDelay: 1s
  storageRetryDelay: 5s
  maximumArchetypesPerScope: 256
  archetypeOverflowBucketId: other
  districtActivitySaturation: 1000
  sectorActivitySaturation: 250
  activityStatusWeights:
    Active: 1
    Working: 1
    Traveling: 0.8
    Resting: 0.1
    Hiding: 0.25
    Injured: 0.2
    Hospitalized: 0.05
    Arrested: 0.05
    Imprisoned: 0.05
    Unconscious: 0
    Missing: 0
    Dead: 0
  activityAvailabilityWeights:
    Available: 1
    Busy: 0.8
    OnCall: 0.6
    Unavailable: 0

- type: ncCityMaterializationPolicy
  id: NCDefaultCityMaterializationPolicy
  maximumQueuedRequests: 1024
  maximumDispatchesPerTick: 2
  maximumConcurrentLoads: 4
  maximumCandidateChecks: 32
  maximumCompletedRequestHistory: 2048
  maximumPriority: 1000
  playerVisibilityExclusionRadius: 18
  playerSpawnExclusionRadius: 2
  adminPreferredSpawnRadius: 28
  actorOccupancyExclusionRadius: 1
  retryDelay: 2s
  defaultMaximumWait: 30s
  maximumWait: 5m

- type: ncCityRelevancePolicy
  id: NCDefaultCityRelevancePolicy
  evaluationInterval: 1s
  clusterMergeRadius: 40
  clusterSplitRadius: 52
  dematerializationRadius: 40
  materializationCooldown: 15s
  offscreenGracePeriod: 8s
  maximumAnchors: 128
  catalogPageSize: 250
  maximumCandidateInspectionsPerCluster: 128
  maximumMaterializationRequestsPerEvaluation: 4
  maximumDematerializationInspectionsPerEvaluation: 64
  maximumDematerializationRequestsPerEvaluation: 2
  playerRelevancePriority: 500
  maximumQueuedDematerializations: 256
  maximumDematerializationDispatchesPerTick: 2
  maximumConcurrentDematerializations: 4
  maximumCompletedDematerializationHistory: 1024
  dematerializationRetryDelay: 2s
  dematerializationMaximumWait: 2m

- type: ncAILoadGovernorPolicy
  id: NCDefaultAILoadGovernorPolicy
  sampleInterval: 1s
  frameTimeEwmaAlpha: 0.15
  degradeSamples: 3
  recoverSamples: 5
  # At 30 Hz, 33.33 ms is healthy. These thresholds react to real loop overruns, not the fixed simulation step.
  elevatedEnterFrameMilliseconds: 42
  elevatedExitFrameMilliseconds: 37
  criticalEnterFrameMilliseconds: 65
  criticalExitFrameMilliseconds: 50
  elevatedEnterWorkRatio: 0.12
  elevatedExitWorkRatio: 0.08
  criticalEnterWorkRatio: 0.18
  criticalExitWorkRatio: 0.13
  elevatedEnterQueueRatio: 0.6
  elevatedExitQueueRatio: 0.35
  criticalEnterQueueRatio: 0.85
  criticalExitQueueRatio: 0.6
  elevatedEnterMaterializedRatio: 0.75
  elevatedExitMaterializedRatio: 0.65
  criticalEnterMaterializedRatio: 0.95
  criticalExitMaterializedRatio: 0.82
  elevatedBacklogCount: 2
  criticalBacklogCount: 3
  criticalExitBacklogCount: 2
  elevatedEvaluationIntervalMultiplier: 2
  criticalEvaluationIntervalMultiplier: 4
  elevatedDispatchMultiplier: 0.5
  criticalDispatchMultiplier: 0.25
  elevatedSoftMaterializedBudgetMultiplier: 0.8
  criticalSoftMaterializedBudgetMultiplier: 0.6
  elevatedProtectedMaterializationPriority: 600
  criticalProtectedMaterializationPriority: 800

- type: ncCityAbstractTravelPolicy
  id: NCDefaultAbstractTravelPolicy
  snapshotPageSize: 250
  maximumDispatchesPerTick: 4
  maximumConcurrentMutations: 8
  retryDelay: 10s
  maximumMutationAttempts: 5
  minimumTravelDuration: 1s
  maximumTravelDuration: 6h
  durationMultiplier: 1

- type: ncCityGroupProfile
  id: NCDefaultStreetGroup
  maximumMembers: 16
  maximumSnapshotHistory: 128
  allowSplit: true
  allowMerge: true
  materializeTogether: true
  formationPolicy: Loose
  initialTransportCapacity: 0
  initialCargoUnits: 0
  initialSupplyUnits: 0
  initialMorale: 0.5

- type: ncCityGroupPhysicalizationPolicy
  id: NCDefaultCityGroupPhysicalizationPolicy
  catalogPageSize: 100
  maximumQueuedRequests: 128
  maximumDispatchesPerTick: 1
  maximumConcurrentLoads: 2
  maximumActiveRequestPollsPerTick: 8
  maximumMembersPerRequest: 32
  maximumCompletedRequestHistory: 512
  maximumPriority: 1000
  retryDelay: 2s
  defaultMaximumWait: 2m
  maximumWait: 5m
  rollbackMaximumWait: 2m
  looseSpacing: 2.25
  columnSpacing: 1.5
  wedgeSpacing: 1.75
  defensiveSpacing: 2

- type: ncCityRoutineProfile
  id: NCDefaultCivilianRoutine
  cycleDuration: 24h
  actorPhaseSpread: 2h
  entries:
  - at: 0s
    activity: sleep
    goal: recover-at-home
    target: Home
    availability: Unavailable
  - at: 7h
    activity: prepare
    goal: prepare-for-work
    target: Home
    availability: Busy
  - at: 8h
    activity: work
    goal: complete-work-shift
    target: Work
    availability: Busy
  - at: 12h
    activity: meal
    goal: eat-and-recover
    target: Work
    availability: Available
  - at: 13h
    activity: work
    goal: complete-work-shift
    target: Work
    availability: Busy
  - at: 17h
    activity: errands
    goal: handle-daily-needs
    target: Work
    availability: Available
  - at: 66600s # 18:30.
    activity: leisure
    goal: spend-free-time
    target: Work
    availability: Available
  - at: 20h
    activity: return-home
    goal: finish-daily-obligations
    target: Home
    availability: Available
  - at: 23h
    activity: sleep
    goal: recover-at-home
    target: Home
    availability: Unavailable
