- type: ncFixerContact
  id: NCStreetMissionFixer
  actorId: 7052d63b-a804-4ea7-8bfc-487c844a1045
  name: nc-fixer-street-name
  archetype: NCStreetMissionFixerActor
  persona: NCResidentPersonaPragmatic
  openingBudget: 50000
  organizerTrustThreshold: 50
  offerCooldown: 5m
  deliveryWindow: 60m
  presenceCheckInterval: 1s
  successEffect: ReputationReliableAction
  executorDomain: NCMissionExecutor
  organizerDomain: NCMissionOrganizer
  missions:
    NCAgentCombatEasy: 500
    NCAgentCombatMedium: 1000
    NCAgentCombatHard: 1800
    NCAgentCombatVeryHard: 2800
    NCAgentCombatExtreme: 4000

- type: ncCityActorArchetype
  id: NCStreetMissionFixerActor
  entityPrototype: NCStreetMissionFixerBody
  spawnCandidateProfile: NCPedestrianSpawnCandidates
  travelMode: Pedestrian

- type: entity
  parent: NCLivingCityCivilian
  id: NCStreetMissionFixerBody
  name: street fixer
  description: A local contact who finds crews for dangerous work.
  components:
  - type: NCFixerMission
    contact: NCStreetMissionFixer
  - type: UserInterface
    interfaces:
      enum.NCFixerMissionUiKey.Key:
        type: NCFixerMissionBoundUserInterface
  - type: ActivatableUI
    key: enum.NCFixerMissionUiKey.Key

- type: entity
  parent: MarkerBase
  id: NCFixerContactAnchor
  name: street fixer anchor
  components:
  - type: NCFixerContactAnchor
    contact: NCStreetMissionFixer
    spawnRadius: 2

- type: entity
  parent: EncryptionKey
  id: NCFixerMissionDataShard
  name: sealed mission data shard
  description: A sealed carrier recovered for a specific client's assignment. Hand it to the issuing fixer.
  components:
  - type: NCFixerMissionObjective

- type: ncReputationDomain
  id: NCMissionExecutor
  stableKey: mission-executor
  channel: Professional

- type: ncReputationDomain
  id: NCMissionOrganizer
  stableKey: mission-organizer
  channel: Professional
