# Mission-specific mapper points. The whole layout still binds directly to its target MissionSlot;
# these markers only describe semantic locations inside that deployed layout.
- type: entity
  id: NCMissionDynamicPointMarker
  parent: MarkerBase
  name: mission dynamic point
  suffix: NC, Mapping
  components:
  - type: Sprite
    layers:
    - state: red
  - type: NCMissionDynamicPoint
    poolId: Default
    extractionPolicy: DeleteOnCleanup

- type: entity
  id: NCMissionEvacuationPointMarker
  parent: MarkerBase
  name: mission evacuation point
  suffix: NC, Mapping
  components:
  - type: Sprite
    layers:
    - state: green
  - type: NCMissionEvacuationPoint
    exitOffset: 0,-1
