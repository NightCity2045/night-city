# A public mission is deployed directly onto two live Night City Z-levels. Its semantic markers
# describe stairs, dynamic content, and safe timed evacuation without hardcoded world coordinates.
- type: ncZoneTemplate
  id: NCMissionLayout8x8
  name: nc-zone-template-mission-layout-8x8
  targetZoneId: 8d7b2c44-9a31-4f67-b8e2-6c5d4a3f1808
  kind: MissionLayout
  revision: 1
  compatibleZoneKinds:
  - MissionSlot
  floors:
  - relativeZ: 0
    mapPath: /Maps/_NC/Missions/Mission8x8Floor0.yml
  - relativeZ: 1
    mapPath: /Maps/_NC/Missions/Mission8x8Floor1.yml
  tilePolicy: ReplaceNonEmpty
  entityPolicy: InteriorOnly
  cleanupPolicy: RestoreBaseline
  cachePolicy: Always

- type: ncMissionDefinition
  id: NCMission8x8
  template: NCMissionLayout8x8
  maximumParticipants: 4
  runDuration: 15m
  evacuationTime: 2m
  dynamicSpawnPools:
    Guards:
    - MobSyndicateFootsoldier
    Loot:
    - WeaponPistolMk58
    - MagazinePistol
