- type: ncAgentConfiguration
  id: Default
  addressPrefix: NC
  # RobustToolbox TimeSpan YAML has no day suffix; thirty days are 720 hours.
  messageRetention: 720h
  maximumDirectoryQueryLength: 64
  minimumAliasLength: 3
  maximumAliasLength: 32
  maximumMessageLength: 1024
  maximumPostLength: 2048
  maximumCommentLength: 1024
  directoryResultLimit: 30
  conversationMessageLimit: 100
  conversationPeerLimit: 50
  incomingCallTimeout: 30s
  callHistoryRetention: 720h
  callHistoryLimit: 50
  feedPostLimit: 50
  feedCommentLimit: 200
