- type: entity
  id: OperatingTable
  parent: Bed
  name: operating table
  # NC start - this mapped table now provides the authoritative surgical facility contract.
  description: A powered clinical table with restraint, monitoring and airway support for surgery.
  # NC end
  components:
  - type: Sprite
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
    noRot: true
  - type: Icon
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
  - type: AmbientMusicMarkerMedical
  # NC start - existing mapped clinic tables are authoritative facilities for direct tool-on-patient surgery.
  - type: NCSurgeryFacility
    capabilities:
    - NCSurgeryFacilityStableSurface
    - NCSurgeryFacilitySterileField
    - NCSurgeryFacilityMonitoring
    - NCSurgeryFacilityVentilation
    - NCSurgeryFacilityBoneFixation
    quality: 1
    sterility: 0.95
    powered: true
    stableSurface: true
  - type: NCSurgeryEnvironment
    sterility: 0.9
    lighting: 1
    motion: 0
    contamination: 0.05
  - type: NCSurgeryPreparationProvider
    movement: 0
    restrained: true
    airwayMonitored: true
  - type: NCSurgeryGraftSlot
  # The existing table is also the authoritative diagnostic patient source for a linked body-scanner console.
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceLinkSink
    ports:
    - NCOperatingTableReceiver
  - type: GuideHelp
    guides:
    - NCSurgeryGuide
  # NC end
