- type: entity
  parent: BaseItem
  id: BasePDACartridge
  abstract: true
  components:
  - type: Item
    storedRotation: -90
  - type: Sprite
    sprite: Objects/Devices/cartridge.rsi

- type: entity
  parent: BasePDACartridge
  id: NotekeeperCartridge
  # NC start - Physical Agent shard presentation.
  name: NOTES shard
  description: A local encrypted notebook program for an Agent.
  # NC end
  components:
  - type: Sprite
    state: cart-y
  - type: UIFragment
    # NC - Render through the Agent-native NOTES interface.
    ui: !type:NCAgentNotesUi
  - type: Cartridge
    programName: notekeeper-program-name
    icon:
      sprite:  Objects/Misc/books.rsi
      state: book_icon
  # NC start - Structured notes replace the vanilla string-only storage.
  - type: NCAgentNotes
    maximumNotes: 64
    maximumNoteLength: 512
  # NC end
  # NC start - Agent SHARDS metadata.
  - type: NCAgentShard
    displayName: NOTES
    description: Local encrypted notes stored on this Agent.
    size: 2
    category: Personal
    permissions:
    - LocalStorage
  # NC end

- type: entity
  parent: BasePDACartridge
  id: NanoTaskCartridge
  # NC start - Physical Agent shard presentation.
  name: TASKBOARD shard
  description: A local workflow board for an Agent.
  # NC end
  components:
  - type: Sprite
    state: cart-nav
  - type: Cartridge
    programName: nano-task-program-name
    icon:
      sprite: Interface/Misc/program_icons.rsi
      state: nano_task
  - type: UIFragment
    # NC - Preserve NanoTask storage and relay while using the Agent-native TASKBOARD interface.
    ui: !type:NCAgentTaskboardUi
  - type: NanoTaskCartridge
  # NC start - Agent SHARDS metadata.
  - type: NCAgentShard
    displayName: TASKBOARD
    description: Device-local task tracking and lightweight job planning.
    size: 2
    category: Personal
    permissions:
    - LocalStorage
  # NC end

- type: entity
  parent: BasePDACartridge
  id: NewsReaderCartridge
  # NC start - Physical Agent shard presentation.
  name: NEWSWIRE shard
  description: A public CityNet news feed for an Agent.
  # NC end
  components:
  - type: Sprite
    state: cart-y
  - type: UIFragment
    # NC - Keep the vanilla news service while using the Agent-native NEWSWIRE reader.
    ui: !type:NCAgentNewswireUi
  - type: Cartridge
    programName: news-read-program-name
    icon:
      sprite: Interface/Misc/program_icons.rsi
      state: news_read
  - type: NewsReaderCartridge
  # NC start - Agent SHARDS metadata.
  - type: NCAgentShard
    displayName: NEWSWIRE
    description: Receives public news feeds from the active network.
    size: 3
    category: Network
    permissions:
    - NetworkRead
  # NC end

- type: entity
  parent: BasePDACartridge
  id: CrewManifestCartridge
  # NC start - Physical Agent shard presentation.
  name: DIRECTORY shard
  description: A public organization registry for an Agent.
  # NC end
  components:
    - type: Sprite
      state: cart-y
    - type: UIFragment
      # NC - Keep the vanilla manifest service while using the Agent-native DIRECTORY reader.
      ui: !type:NCAgentDirectoryUi
    - type: Cartridge
      programName: crew-manifest-program-name
      icon:
        sprite: Interface/Misc/program_icons.rsi
        state: crew_manifest
    - type: CrewManifestCartridge
    # NC start - Agent SHARDS metadata.
    - type: NCAgentShard
      displayName: DIRECTORY
      description: Reads the public personnel directory exposed by the current station service.
      size: 3
      category: Network
      permissions:
      - NetworkRead
      - VinRead
    # NC end

- type: entity
  parent: BasePDACartridge
  id: NetProbeCartridge
  # NC start - Physical Agent shard presentation.
  name: SCANNER shard
  description: A network inspection program for an Agent.
  # NC end
  components:
    - type: Sprite
      state: cart-y
    - type: UIFragment
      # NC - Render through the Agent-native SCANNER interface.
      ui: !type:NCAgentScannerUi
    - type: Cartridge
      programName: net-probe-program-name
      icon:
        sprite: Structures/Machines/server.rsi
        state: server
    - type: NetProbeCartridge
    # NC start - NetProbe is presented as the first physical Agent scanner shard.
    - type: NCAgentShard
      displayName: SCANNER
      description: Inspects nearby network devices and exposed service addresses.
      size: 4
      category: Network
      permissions:
      - NetworkRead
      - LocationRead
    # NC end

- type: entity
  parent: BasePDACartridge
  id: LogProbeCartridge
  # NC start - Physical Agent shard presentation.
  name: LOGPROBE shard
  description: An access-device audit program for an Agent.
  # NC end
  components:
    - type: Sprite
      state: cart-log
    - type: Icon
      sprite: Objects/Devices/cartridge.rsi
      state: cart-log
    - type: UIFragment
      # NC - Keep vanilla scanning and printing behind the Agent-native LOGPROBE display.
      ui: !type:NCAgentLogProbeUi
    - type: Cartridge
      programName: log-probe-program-name
      icon:
        sprite: Structures/Doors/Airlocks/Standard/security.rsi
        state: closed
    - type: LogProbeCartridge
    - type: GuideHelp
      guides:
      - Forensics
    # NC start - Agent SHARDS metadata.
    - type: NCAgentShard
      displayName: LOGPROBE
      description: Extracts exposed access logs from compatible devices.
      size: 4
      category: Security
      permissions:
      - NetworkRead
      - DeviceControl
    # NC end

- type: entity
  parent: BasePDACartridge
  id: WantedListCartridge
  # NC start - Physical Agent shard presentation.
  name: WATCHLIST shard
  description: An NCPD wanted-record reader for an Agent.
  # NC end
  components:
  - type: Sprite
    state: cart-sec
  - type: Icon
    sprite: Objects/Devices/cartridge.rsi
    state: cart-sec
  - type: UIFragment
    # NC - Keep the vanilla criminal-record query behind the Agent-native WATCHLIST display.
    ui: !type:NCAgentWatchlistUi
  - type: Cartridge
    programName: wanted-list-program-name
    icon:
      sprite: Objects/Misc/books.rsi
      state: icon_magnifier
  - type: WantedListCartridge
  - type: StealTarget
    stealGroup: WantedListCartridge
  # NC start - Agent SHARDS metadata.
  - type: NCAgentShard
    displayName: WATCHLIST
    description: Queries public and authorized wanted-person records.
    size: 5
    category: Security
    permissions:
    - NetworkRead
    - VinRead
  # NC end

- type: entity
  parent: BasePDACartridge
  id: MedTekCartridge
  # NC start - Physical Agent shard presentation.
  name: MEDTEK shard
  description: A field diagnostic program with device-local scan history.
  # NC end
  components:
    - type: Sprite
      state: cart-med
    - type: Icon
      sprite: Objects/Devices/cartridge.rsi
      state: cart-med
    - type: Cartridge
      programName: med-tek-program-name
      icon:
        sprite: Objects/Specific/Medical/healthanalyzer.rsi
        state: icon
    - type: MedTekCartridge
    # NC start - Agent-native MEDTEK history page; vanilla analyzer remains the live scan UI.
    - type: UIFragment
      ui: !type:NCAgentMedTekUi
    - type: NCAgentMedTek
      maximumHistory: 12
    # NC end
    # NC start - Agent SHARDS metadata.
    - type: NCAgentShard
      displayName: MEDTEK
      description: Interfaces with supported medical diagnostic equipment.
      size: 4
      category: Medical
      permissions:
      - DeviceControl
    # NC end

- type: entity
  parent: BasePDACartridge
  id: AstroNavCartridge
  # NC start - Physical Agent shard presentation.
  name: NAVIGATOR shard
  description: A city-grid navigator with local waypoint storage.
  # NC end
  components:
    - type: Sprite
      state: cart-nav
    - type: Icon
      sprite: Objects/Devices/cartridge.rsi
      state: cart-nav
    - type: Cartridge
      programName: astro-nav-program-name
      icon:
        sprite: Objects/Devices/gps.rsi
        state: icon
    - type: AstroNavCartridge
    # NC start - Agent-native NAVIGATOR UI and physical waypoint storage.
    - type: UIFragment
      ui: !type:NCAgentNavigatorUi
    - type: NCAgentNavigator
      maximumWaypoints: 24
      maximumLabelLength: 30
    # NC end
    # NC start - Agent SHARDS metadata.
    - type: NCAgentShard
      displayName: NAVIGATOR
      description: Reads local navigation coordinates from the Agent hardware.
      size: 2
      category: Utility
      permissions:
      - LocationRead
    # NC end
