- type: entity
  parent: BaseItem
  id: BasePDACartridge
  abstract: true
  components:
  - type: Item
    storedRotation: -90
  - type: Sprite
    sprite: Objects/Devices/cartridge.rsi

- type: entity
  parent: BasePDACartridge
  id: NotekeeperCartridge
  # NC start - Physical Agent shard presentation.
  name: NOTES shard
  description: A local encrypted notebook program for an Agent.
  # NC end
  components:
  - type: Sprite
    state: cart-y
  - type: UIFragment
    # NC - Render through the Agent-native NOTES interface.
    ui: !type:NCAgentNotesUi
  - type: Cartridge
    programName: notekeeper-program-name
    icon:
      sprite:  Objects/Misc/books.rsi
      state: book_icon
  # NC start - Structured notes replace the vanilla string-only storage.
  - type: NCAgentNotes
    maximumNotes: 64
    maximumNoteLength: 512
  # NC end
  # NC start - Agent SHARDS metadata.
  - type: NCAgentShard
    displayName: NOTES
    description: Local encrypted notes stored on this Agent.
    size: 2
    category: Personal
    permissions:
    - LocalStorage
  # NC end

- type: entity
  parent: BasePDACartridge
  id: NanoTaskCartridge
  name: NanoTask cartridge
  description: A program that allows you to keep a list of tasks to do.
  components:
  - type: Sprite
    state: cart-nav
  - type: Cartridge
    programName: nano-task-program-name
    icon:
      sprite: Interface/Misc/program_icons.rsi
      state: nano_task
  - type: UIFragment
    ui: !type:NanoTaskUi
  - type: NanoTaskCartridge
  # NC start - Agent SHARDS metadata.
  - type: NCAgentShard
    displayName: TASKBOARD
    description: Device-local task tracking and lightweight job planning.
    size: 2
    category: Personal
    permissions:
    - LocalStorage
  # NC end

- type: entity
  parent: BasePDACartridge
  id: NewsReaderCartridge
  name: news cartridge
  description: A program for reading news.
  components:
  - type: Sprite
    state: cart-y
  - type: UIFragment
    ui: !type:NewsReaderUi
  - type: Cartridge
    programName: news-read-program-name
    icon:
      sprite: Interface/Misc/program_icons.rsi
      state: news_read
  - type: NewsReaderCartridge
  # NC start - Agent SHARDS metadata.
  - type: NCAgentShard
    displayName: NEWSWIRE
    description: Receives public news feeds from the active network.
    size: 3
    category: Network
    permissions:
    - NetworkRead
  # NC end

- type: entity
  parent: BasePDACartridge
  id: CrewManifestCartridge
  name: crew manifest cartridge
  description: A program for listing your fellow crewmembers.
  components:
    - type: Sprite
      state: cart-y
    - type: UIFragment
      ui: !type:CrewManifestUi
    - type: Cartridge
      programName: crew-manifest-program-name
      icon:
        sprite: Interface/Misc/program_icons.rsi
        state: crew_manifest
    - type: CrewManifestCartridge
    # NC start - Agent SHARDS metadata.
    - type: NCAgentShard
      displayName: DIRECTORY
      description: Reads the public personnel directory exposed by the current station service.
      size: 3
      category: Network
      permissions:
      - NetworkRead
      - VinRead
    # NC end

- type: entity
  parent: BasePDACartridge
  id: NetProbeCartridge
  # NC start - Physical Agent shard presentation.
  name: SCANNER shard
  description: A network inspection program for an Agent.
  # NC end
  components:
    - type: Sprite
      state: cart-y
    - type: UIFragment
      # NC - Render through the Agent-native SCANNER interface.
      ui: !type:NCAgentScannerUi
    - type: Cartridge
      programName: net-probe-program-name
      icon:
        sprite: Structures/Machines/server.rsi
        state: server
    - type: NetProbeCartridge
    # NC start - NetProbe is presented as the first physical Agent scanner shard.
    - type: NCAgentShard
      displayName: SCANNER
      description: Inspects nearby network devices and exposed service addresses.
      size: 4
      category: Network
      permissions:
      - NetworkRead
      - LocationRead
    # NC end

- type: entity
  parent: BasePDACartridge
  id: LogProbeCartridge
  name: LogProbe cartridge
  description: A program for getting access logs from devices.
  components:
    - type: Sprite
      state: cart-log
    - type: Icon
      sprite: Objects/Devices/cartridge.rsi
      state: cart-log
    - type: UIFragment
      ui: !type:LogProbeUi
    - type: Cartridge
      programName: log-probe-program-name
      icon:
        sprite: Structures/Doors/Airlocks/Standard/security.rsi
        state: closed
    - type: LogProbeCartridge
    - type: GuideHelp
      guides:
      - Forensics
    # NC start - Agent SHARDS metadata.
    - type: NCAgentShard
      displayName: LOGPROBE
      description: Extracts exposed access logs from compatible devices.
      size: 4
      category: Security
      permissions:
      - NetworkRead
      - DeviceControl
    # NC end

- type: entity
  parent: BasePDACartridge
  id: WantedListCartridge
  name: Wanted list cartridge
  description: A program to get a list of wanted persons.
  components:
  - type: Sprite
    state: cart-sec
  - type: Icon
    sprite: Objects/Devices/cartridge.rsi
    state: cart-sec
  - type: UIFragment
    ui: !type:WantedListUi
  - type: Cartridge
    programName: wanted-list-program-name
    icon:
      sprite: Objects/Misc/books.rsi
      state: icon_magnifier
  - type: WantedListCartridge
  - type: StealTarget
    stealGroup: WantedListCartridge
  # NC start - Agent SHARDS metadata.
  - type: NCAgentShard
    displayName: WATCHLIST
    description: Queries public and authorized wanted-person records.
    size: 5
    category: Security
    permissions:
    - NetworkRead
    - VinRead
  # NC end

- type: entity
  parent: BasePDACartridge
  id: MedTekCartridge
  name: MedTek cartridge
  description: A program that provides medical diagnostic tools.
  components:
    - type: Sprite
      state: cart-med
    - type: Icon
      sprite: Objects/Devices/cartridge.rsi
      state: cart-med
    - type: Cartridge
      programName: med-tek-program-name
      icon:
        sprite: Objects/Specific/Medical/healthanalyzer.rsi
        state: icon
    - type: MedTekCartridge
    # NC start - Agent SHARDS metadata.
    - type: NCAgentShard
      displayName: MEDTEK
      description: Interfaces with supported medical diagnostic equipment.
      size: 4
      category: Medical
      permissions:
      - DeviceControl
    # NC end

- type: entity
  parent: BasePDACartridge
  id: AstroNavCartridge
  name: AstroNav cartridge
  description: A program for navigation that provides GPS coordinates.
  components:
    - type: Sprite
      state: cart-nav
    - type: Icon
      sprite: Objects/Devices/cartridge.rsi
      state: cart-nav
    - type: Cartridge
      programName: astro-nav-program-name
      icon:
        sprite: Objects/Devices/gps.rsi
        state: icon
    - type: AstroNavCartridge
    # NC start - Agent SHARDS metadata.
    - type: NCAgentShard
      displayName: NAVIGATOR
      description: Reads local navigation coordinates from the Agent hardware.
      size: 2
      category: Utility
      permissions:
      - LocationRead
    # NC end
