services:
  neural-cognition:
    build: .
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY outside the repository}
      NC_NEURAL_MODEL: ${NC_NEURAL_MODEL:-gpt-5.6-luna}
    networks: [night-city-private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
networks:
  night-city-private:
    # No host port is published here, but the service still needs outbound access to the OpenAI API.
    internal: false
