# Merge this server entry into your Codex configuration after building the package.
[mcp_servers.ss14_dev]
command = "dotnet"
args = ["D:/projects/night-city/artifacts/ss14-mcp-package/Server/SS14Mcp.Server.dll"]
startup_timeout_sec = 30
tool_timeout_sec = 60

[mcp_servers.ss14_dev.env]
